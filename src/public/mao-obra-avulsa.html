<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pagamento a Mão de Obra Avulsa — Romatec</title>
<style>
  :root{ --green:#0C3320;--green2:#14472B;--gold:#C9A84C;--gold-soft:#E3D19A;--paper:#f2f0e9;--ink:#1C1C18;--muted:#6A6656;--line:#D8D3C4;--danger:#ef4444;--ok:#10b981; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink)}
  header{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;padding:16px 18px;position:sticky;top:0;z-index:10}
  header .kick{color:var(--gold-soft);letter-spacing:2px;text-transform:uppercase;font-size:10px;margin:0}
  header h1{margin:2px 0 0;font-size:19px}
  header a.back{position:absolute;left:14px;top:16px;color:#fff;text-decoration:none;font-weight:600;font-size:14px}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
  h2{color:var(--green);font-size:16px;margin:0 0 10px;border-bottom:2px solid var(--gold);padding-bottom:6px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}
  input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit;background:#fff}
  textarea{min-height:70px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{border:0;border-radius:9px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer}
  .btn-gold{background:var(--gold);color:var(--green);width:100%}
  .btn-ghost{background:#fff;color:var(--green);border:1px solid var(--gold)}
  .muted{color:var(--muted);font-size:13px}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:50;opacity:0;transition:opacity .2s;max-width:92%}
  .toast.show{opacity:1}
  .okbox{background:rgba(16,185,129,.1);border:1px solid var(--ok);color:#0f7a52;border-radius:8px;padding:12px;margin-top:10px;word-break:break-all}
  .item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .item b{color:var(--green)}
  .pill{display:inline-block;background:var(--green);color:var(--gold-soft);border-radius:12px;padding:2px 10px;font-size:11px}
  .pill.ok{background:var(--ok);color:#fff}
  .thumb{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line);vertical-align:middle}
</style>
</head>
<body>
<header>
  <a class="back" href="/obras.html">‹ Voltar</a>
  <div style="padding-left:56px">
    <p class="kick">Romatec — Gestão de Obras</p>
    <h1>🧾 Pagamento a Mão de Obra Avulsa</h1>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <h2>Novo pagamento</h2>
    <label>Obra <span style="color:var(--muted);font-weight:400">(escolha uma ou digite uma nova — é salva automaticamente)</span></label>
    <input id="obra" list="obras-datalist" placeholder="Digite ou escolha a obra" autocomplete="off">
    <datalist id="obras-datalist"></datalist>
    <div class="row2">
      <div><label>Prestador *</label><input id="nome" placeholder="Nome do prestador"></div>
      <div><label>WhatsApp *</label><input id="tel" placeholder="55DDDNNNNNNNNN" inputmode="numeric"></div>
    </div>
    <div class="row2">
      <div><label>CPF (opcional)</label><input id="cpf" placeholder="000.000.000-00"></div>
      <div><label>Tipo de serviço *</label><input id="tipo" placeholder="Ex: Assentamento de piso"></div>
    </div>
    <label>Descrição do serviço (opcional)</label>
    <textarea id="desc" placeholder="Detalhe o que foi executado..."></textarea>
    <div class="row2">
      <div><label>Valor pago (R$) *</label><input id="valor" type="number" step="0.01" min="0.01" placeholder="0,00"></div>
      <div><label>Forma de pagamento</label>
        <select id="forma"><option value="pix" selected>PIX</option><option value="dinheiro">Dinheiro</option><option value="transferencia">Transferência</option><option value="outro">Outro</option></select>
      </div>
    </div>
    <div class="row2">
      <div><label>Data do pagamento *</label><input id="data" type="date"></div>
      <div><label>Comprovante (PIX/transferência)</label><input id="comprovante" type="file" accept="image/*,application/pdf"></div>
    </div>
    <button class="btn btn-gold" id="btnSalvar" style="margin-top:14px">💾 Registrar e enviar recibo</button>
    <button class="btn btn-ghost" id="btnCancelarEdicao" style="margin-top:8px;width:100%;display:none">✖ Cancelar edição</button>
    <div id="resultado"></div>
  </div>

  <div class="card">
    <h2>Pagamentos recentes</h2>
    <div id="lista"><p class="muted">Carregando…</p></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  var API = '/api/mao-obra-avulsa';
  function ceoTok(){ try { return localStorage.getItem('ceo_token') || ''; } catch(e){ return ''; } }
  function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},2600); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function brl(v){ return v==null?'—':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
  function val(id){ var e=document.getElementById(id); return e?e.value.trim():''; }
  function hdrs(json){ var h={ 'X-CEO-Token': ceoTok() }; if(json) h['Content-Type']='application/json'; return h; }
  function api(path, opts){
    opts=opts||{}; opts.credentials='include';
    return fetch(API+path, opts).then(function(r){
      if(r.status===401){ location.href='/login?next='+encodeURIComponent(location.pathname); throw new Error('não autenticado'); }
      return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||('HTTP '+r.status)); return j; });
    });
  }

  // Carrega obras no select
  fetch('/api/obras',{credentials:'include'}).then(function(r){return r.json();}).then(function(list){
    var arr = Array.isArray(list) ? list : (list.obras||[]);
    var dl=document.getElementById('obras-datalist');
    arr.forEach(function(o){ var op=document.createElement('option'); op.value=o.nome; dl.appendChild(op); });
  }).catch(function(){});

  // Data default = hoje
  document.getElementById('data').value = new Date().toISOString().slice(0,10);

  function fileToB64(file){ return new Promise(function(res,rej){ var fr=new FileReader(); fr.onload=function(){ var d=String(fr.result); var m=/^data:([^;]+);base64,(.*)$/.exec(d); res({mime:m?m[1]:file.type,base64:m?m[2]:d}); }; fr.onerror=rej; fr.readAsDataURL(file); }); }

  var editingId = null;
  document.getElementById('btnSalvar').onclick = async function(){
    var nome=val('nome'), tel=val('tel').replace(/\D/g,''), tipo=val('tipo'), valor=Number(val('valor')), data=val('data');
    if(!nome){toast('Informe o prestador.');return;}
    if(!tel || tel.length<10){toast('Informe o WhatsApp (55+DDD+número).');return;}
    if(!tipo){toast('Informe o tipo de serviço.');return;}
    if(!valor||valor<=0){toast('Informe o valor pago.');return;}
    if(!data){toast('Informe a data do pagamento.');return;}
    var btn=this;
    var payload={ obra_nome: val('obra')||null, nome_prestador:nome, telefone_whatsapp:tel, cpf:val('cpf')||null,
      tipo_servico:tipo, descricao_servico:val('desc')||null, valor_pago:valor, forma_pagamento:val('forma'), data_pagamento:data };

    // MODO EDIÇÃO: só salva os campos (PUT), não reenvia.
    if(editingId){
      btn.disabled=true; btn.textContent='💾 Salvando...';
      try { await api('/'+editingId,{method:'PUT',headers:hdrs(true),body:JSON.stringify(payload)});
        toast('Alterações salvas.'); cancelarEdicao(); carregarLista();
      } catch(e){ toast(e.message||'Erro'); }
      finally { btn.disabled=false; btn.textContent = editingId ? '💾 Salvar edição' : '💾 Registrar e enviar recibo'; }
      return;
    }

    btn.disabled=true; btn.textContent='⏳ Registrando...';
    try {
      var j = await api('/', { method:'POST', headers:hdrs(true), body:JSON.stringify(payload) });
      var id = j.mao_obra.id;
      // comprovante (opcional)
      var f=(document.getElementById('comprovante').files||[])[0];
      if(f){ btn.textContent='⏳ Anexando comprovante...'; var o=await fileToB64(f);
        await api('/'+id+'/comprovante',{method:'POST',headers:hdrs(true),body:JSON.stringify({nome:f.name,mime:o.mime,base64:o.base64})}); }
      // enviar
      btn.textContent='⏳ Enviando recibo...';
      var env = await api('/'+id+'/enviar',{method:'POST',headers:hdrs(true)});
      var assinTxt = env.assinado ? '🔒 Assinado (ICP-Brasil). ' : '';
      document.getElementById('resultado').innerHTML =
        '<div class="okbox">✅ Recibo '+esc(env.numero)+' enviado ao prestador. '+assinTxt+
        '<br>Aguardando ele responder <b>CONFIRMAR</b> no WhatsApp.<br>Link: <a href="'+esc(env.link)+'" target="_blank">'+esc(env.link)+'</a></div>';
      toast('Recibo enviado!');
      // limpa campos principais
      ['nome','tel','cpf','tipo','desc','valor'].forEach(function(k){ document.getElementById(k).value=''; });
      document.getElementById('comprovante').value='';
      carregarLista();
    } catch(e){ toast(e.message||'Erro'); }
    finally { btn.disabled=false; btn.textContent='💾 Registrar e enviar recibo'; }
  };

  // Rótulo/cor por status do recibo
  function statusInfo(st){
    var map={ rascunho:['Rascunho','#6A6656'], aguardando_envio:['Aguardando envio','#6A6656'],
      enviado:['📤 Enviado','#3b82f6'], entregue:['📬 Entregue','#3b82f6'], lido:['👁 Lido','#3b82f6'],
      respondido:['Respondido','#3b82f6'], confirmado:['✓ Confirmado','#10b981'],
      contestado:['✗ Contestado','#ef4444'], recusado:['✗ Recusado','#ef4444'],
      cancelado:['Cancelado','#999'], expirado:['Expirado','#999'] };
    return map[st] || [st, '#6A6656'];
  }

  var pagamentosCache = [];
  function carregarLista(){
    api('/',{headers:hdrs(false)}).then(function(j){
      var l=document.getElementById('lista');
      pagamentosCache = j.pagamentos||[];
      if(!pagamentosCache.length){ l.innerHTML='<p class="muted">Nenhum pagamento avulso registrado ainda.</p>'; return; }
      l.innerHTML = pagamentosCache.map(function(p){
        var st = p.recibo_status || 'rascunho';
        var si = statusInfo(st);
        var link = p.recibo_hash ? (location.origin+'/v/'+p.recibo_hash) : null;
        var enviado = st && st!=='rascunho' && st!=='aguardando_envio';
        return '<div class="item"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center">'
          +'<div style="min-width:200px"><b>'+esc(p.nome_prestador)+'</b> — '+esc(p.tipo_servico)+'<br>'
          +'<span class="muted">'+esc(p.obra_nome||'sem obra')+' · '+brl(p.valor_pago)+' · '+esc(p.data_pagamento||'')+(p.tem_comprovante?' · 📎 comprovante':'')+'</span></div>'
          +'<div style="text-align:right"><span class="pill" style="background:'+si[1]+';color:#fff">'+esc(si[0])+'</span>'
          +(p.recibo_numero?'<div class="muted" style="font-size:11px;margin-top:3px">'+esc(p.recibo_numero)+'</div>':'')
          +(link?'<div style="margin-top:4px"><a href="'+esc(link)+'" target="_blank" style="font-size:12px;color:var(--green)">ver recibo →</a></div>':'')
          +'</div></div>'
          +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">'
          +'<button class="btn btn-ghost" data-act="editar" data-id="'+p.id+'" style="flex:1;padding:8px;font-size:13px">✏️ Editar</button>'
          +'<button class="btn btn-ghost" data-act="reenviar" data-id="'+p.id+'" style="flex:1;padding:8px;font-size:13px">'+(enviado?'🔁 Reenviar':'🚀 Enviar')+'</button>'
          +'<button class="btn" data-act="excluir" data-id="'+p.id+'" style="flex:0 0 auto;padding:8px 12px;font-size:13px;background:transparent;border:1px solid var(--danger);color:var(--danger)">🗑️</button>'
          +'</div></div>';
      }).join('');
      Array.prototype.forEach.call(l.querySelectorAll('[data-act]'),function(b){
        b.onclick=function(){ var id=Number(b.dataset.id); var act=b.dataset.act;
          if(act==='editar') editarPagamento(id);
          else if(act==='reenviar') reenviarPagamento(id, b);
          else if(act==='excluir') excluirPagamento(id, b);
        };
      });
    }).catch(function(e){ document.getElementById('lista').innerHTML='<p class="muted">Erro ao carregar: '+esc(e.message)+'</p>'; });
  }

  function editarPagamento(id){
    var p = pagamentosCache.filter(function(x){return x.id===id;})[0]; if(!p) return;
    editingId = id;
    document.getElementById('obra').value = p.obra_nome || '';
    document.getElementById('nome').value = p.nome_prestador || '';
    document.getElementById('tel').value = p.telefone_whatsapp || '';
    document.getElementById('cpf').value = p.cpf || '';
    document.getElementById('tipo').value = p.tipo_servico || '';
    document.getElementById('desc').value = p.descricao_servico || '';
    document.getElementById('valor').value = p.valor_pago || '';
    document.getElementById('forma').value = p.forma_pagamento || 'pix';
    document.getElementById('data').value = p.data_pagamento || '';
    document.getElementById('btnSalvar').textContent = '💾 Salvar edição';
    document.getElementById('btnCancelarEdicao').style.display = '';
    document.getElementById('resultado').innerHTML = '';
    window.scrollTo({top:0,behavior:'smooth'});
    toast('Editando '+(p.recibo_numero||('#'+id))+'…');
  }
  function cancelarEdicao(){
    editingId = null;
    ['obra','nome','tel','cpf','tipo','desc','valor'].forEach(function(k){ document.getElementById(k).value=''; });
    document.getElementById('btnSalvar').textContent = '💾 Registrar e enviar recibo';
    document.getElementById('btnCancelarEdicao').style.display = 'none';
    document.getElementById('comprovante').value='';
  }
  async function reenviarPagamento(id, btn){
    if(btn){ btn.disabled=true; btn.textContent='⏳...'; }
    try { var env = await api('/'+id+'/enviar',{method:'POST',headers:hdrs(true)});
      toast('Recibo '+env.numero+' enviado.'); carregarLista();
    } catch(e){ toast(e.message||'Falha ao enviar'); if(btn){ btn.disabled=false; btn.textContent='🔁 Reenviar'; } }
  }
  async function excluirPagamento(id, btn){
    if(!confirm('Excluir este pagamento? (o recibo, se houver e não confirmado, é cancelado)')) return;
    if(btn) btn.disabled=true;
    try { await api('/'+id,{method:'DELETE',headers:hdrs(false)}); toast('Excluído.'); if(editingId===id) cancelarEdicao(); carregarLista(); }
    catch(e){ toast(e.message||'Falha ao excluir'); if(btn) btn.disabled=false; }
  }

  document.getElementById('btnCancelarEdicao').onclick = cancelarEdicao;
  carregarLista();
})();
</script>
</body>
</html>
