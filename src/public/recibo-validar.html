<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10b981">
<title>Validar Recibo</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#f9fafb;color:#111;line-height:1.5;
    padding:20px 16px;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
  }
  .header{text-align:center;padding:20px 0;max-width:480px}
  .logo{max-width:120px;max-height:55px;margin-bottom:8px}
  .stamp{
    background:linear-gradient(135deg,var(--cor) 0%, var(--cor-dark) 100%);
    color:#fff;padding:18px;border-radius:14px;text-align:center;
    width:100%;max-width:480px;margin-bottom:16px;
    box-shadow:0 8px 24px rgba(16,185,129,.2);
  }
  .stamp .check{font-size:48px;margin-bottom:4px;line-height:1}
  .stamp h1{font-size:20px;font-weight:600;margin-bottom:4px}
  .stamp p{font-size:13px;opacity:.92}
  .stamp.invalid{background:linear-gradient(135deg,#dc2626,#991b1b);box-shadow:0 8px 24px rgba(220,38,38,.2)}
  .card{
    background:#fff;border-radius:14px;padding:22px;
    width:100%;max-width:480px;
    box-shadow:0 4px 16px rgba(0,0,0,.06);
    margin-bottom:14px;
  }
  h2{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:8px}
  dl{display:grid;grid-template-columns:120px 1fr;gap:10px 14px;font-size:14px}
  dt{color:#666;font-weight:500}
  dd{color:#111;font-weight:500;word-wrap:break-word;overflow-wrap:break-word}
  .status{
    display:inline-block;padding:4px 10px;border-radius:999px;
    font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em
  }
  .status-ok{background:#d1fae5;color:#065f46}
  .status-no{background:#fee2e2;color:#991b1b}
  .status-pending{background:#fef3c7;color:#92400e}
  .pdf-link{
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:14px;border-radius:10px;background:var(--cor);color:#fff;
    text-decoration:none;font-weight:600;font-size:15px;margin-top:12px;
  }
  .footer{font-size:11px;color:#9ca3af;text-align:center;padding:8px 16px;max-width:480px}
  .hash-box{
    background:#f3f4f6;padding:10px 12px;border-radius:8px;
    font-family:ui-monospace,Courier,monospace;font-size:11px;
    color:#444;word-break:break-all;line-height:1.4;
  }
  /* v3.23.5: aviso DRL — espelha o box vermelho do PDF (regulamentar, sempre presente em georref) */
  .aviso-drl{
    border:2px solid #c0392b;
    background:#fdecea;
    border-radius:8px;
    padding:16px;
    width:100%;max-width:480px;
    margin-bottom:14px;
  }
  .aviso-drl h3{
    color:#922b21;
    text-transform:uppercase;
    font-size:13px;
    font-weight:700;
    margin:0 0 10px 0;
    line-height:1.3;
  }
  .aviso-drl p{font-size:12.5px;color:#111;margin:0 0 8px 0;line-height:1.55;text-align:justify}
  .aviso-drl p:last-child{margin-bottom:0}
  .aviso-drl strong{color:#922b21;font-weight:700}
  .aviso-drl .reforco{margin-top:8px;border-top:1px dashed #c0392b;padding-top:8px}
</style>
</head>
<body>
<div id="root"></div>
<p class="footer">
  Sistema de validação criptográfica de recibos. Documentos emitidos pelo sistema têm um hash SHA-256 único que vincula o conteúdo ao QR Code. Qualquer alteração no PDF invalida automaticamente.
</p>
<script>
(async function(){
  const root = document.getElementById('root');
  const hash = location.pathname.replace(/^\/v\//,'').split('/')[0];

  function escapeHtml(s){
    return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtBRL(n){
    if (n == null) return '';
    return 'R$ ' + Number(n).toLocaleString('pt-BR', {minimumFractionDigits:2,maximumFractionDigits:2});
  }
  function fmtData(s){
    if (!s) return '-';
    const d = new Date(s);
    if (isNaN(d.getTime())) return s;
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }

  const TIPO_TITULO = {
    funcionario:'Recibo de Pagamento',
    parcela:'Comprovante de Parcela',
    despesa:'Reembolso de Despesa',
    proposta:'Aceite de Proposta',
    vistoria:'Ciência de Vistoria',
    etapa:'Aceite de Etapa',
    chaves:'Termo de Entrega de Chaves',
    custom:'Recibo'
  };
  const STATUS_LABEL = {
    rascunho:'Rascunho',
    aguardando_envio:'Aguardando envio',
    enviado:'Enviado',
    entregue:'Entregue',
    lido:'Lido',
    respondido:'Respondido',
    confirmado:'✓ Confirmado',
    contestado:'✗ Contestado',
    expirado:'⏱ Expirado',
    cancelado:'⊘ Cancelado'
  };

  // v3.27.0: aviso DRL adaptado para Demarcacao de Lotes (4 finalidades:
  // demarcacao_inicial, redemarcacao, subdivisao_lote, piqueteamento_apenas).
  // Reforco SO em subdivisao_lote.
  function avisoDRLDemarcacaoHtml(finalidade) {
    const f = finalidade || 'demarcacao_inicial';
    const paragrafos = [
      `Em qualquer trabalho de demarcação física de lote, a coleta de <strong>Declarações de Respeito de Limite</strong> (DRLs) dos confrontantes é <strong>OBRIGAÇÃO LEGAL E EXCLUSIVA</strong> do proprietário, conforme Lei nº 10.267/2001, NTGIR 3ª Ed. (INCRA) e Provimento CNJ nº 65/2017.`,
      `A Romatec <strong>GERA</strong> os documentos técnicos (planta, memorial, croqui), mas <strong>NÃO COLETA</strong> as DRLs nem reconhece firma — esse é ato pessoal do proprietário perante cartório.`,
      `Sem DRL com <strong>RECONHECIMENTO DE FIRMA EM CARTÓRIO</strong> de todos os confrontantes, o cartório de imóveis <strong>NÃO AVERBA</strong> a demarcação na matrícula, mesmo após instalação física dos marcos.`,
    ];
    let finalP = '';
    if (f === 'subdivisao_lote') {
      finalP = `<p class="reforco"><strong>⚠ ATENÇÃO REFORÇADA — SUBDIVISÃO DE LOTE:</strong> ausência de DRL impede a <strong>abertura de novas matrículas</strong> para as frações resultantes, mesmo que o desmembramento tenha sido aprovado pela Prefeitura.</p>`;
    }
    return `
      <div class="aviso-drl">
        <h3>⚠ Responsabilidade do Proprietário — DRL (Declaração de Respeito de Limite)</h3>
        ${paragrafos.map(p => `<p>${p}</p>`).join('')}
        ${finalP}
      </div>`;
  }

  const FINALIDADE_DEMARCACAO_TEXTOS = {
    demarcacao_inicial: 'Demarcação inicial — implantação física dos vértices definidos em projeto.',
    redemarcacao: 'Redemarcação — repiqueteamento de vértices perdidos/deteriorados.',
    subdivisao_lote: 'Subdivisão de lote — demarcação das frações resultantes de desmembramento aprovado.',
    piqueteamento_apenas: 'Piqueteamento — implantação de marcos sem novo levantamento de campo.',
  };

  const MATERIAL_MARCO_LABEL = {
    concreto: 'Marco de concreto padrão INCRA',
    tubo_galvanizado: 'Marco em tubo galvanizado',
    madeira: 'Piquete de madeira de lei',
  };

  // v3.23.5: monta o HTML do aviso DRL (espelha renderAvisoDRL do PDF).
  // Texto regulamentar fixo — sempre presente em proposta de georref_rural,
  // qualquer finalidade. Reforco adicional para RETIFICACAO; paragrafo extra
  // para DESMEMBRAMENTO/REMEMBRAMENTO. Fonte: Lei 10.267/2001, NTGIR 3a Ed.,
  // Provimento CNJ 65/2017.
  function avisoDRLHtml(finalidade){
    const f = finalidade || 'CERTIFICACAO';
    const paragrafos = [
      `A coleta das <strong>Declarações de Respeito de Limite</strong> (DRLs) dos confrontantes é <strong>OBRIGAÇÃO LEGAL E EXCLUSIVA DO PROPRIETÁRIO</strong> do imóvel, nos termos da Lei 10.267/2001, NTGIR 3ª Edição (INCRA) e Provimento CNJ nº 65/2017.`,
      `A Romatec (responsável técnico) <strong>GERA</strong> as declarações em formulário próprio, mas a obtenção das assinaturas dos confrontantes e o <strong>RECONHECIMENTO DE FIRMA EM CARTÓRIO</strong> são de inteira responsabilidade do contratante.`,
      `Sem as DRLs devidamente assinadas e com firma reconhecida, <strong>o INCRA NÃO CERTIFICA</strong> o memorial no SIGEF e <strong>o cartório NÃO AVERBA</strong> o georreferenciamento na matrícula. O prazo de certificação (60–180 dias) só começa a contar após a entrega das DRLs completas.`,
    ];
    if (f === 'DESMEMBRAMENTO' || f === 'REMEMBRAMENTO') {
      paragrafos.push(`Em operações de <strong>${escapeHtml(f)}</strong>, são exigidas DRLs de TODOS os confrontantes da poligonal resultante, inclusive dos lotes vizinhos que serão criados ou unificados.`);
    }
    let finalP;
    if (f === 'RETIFICACAO') {
      finalP = `<p class="reforco"><strong>⚠ ATENÇÃO REFORÇADA PARA RETIFICAÇÃO DE ÁREA:</strong> a ausência de qualquer DRL impede TOTALMENTE o procedimento, seja na via administrativa (Lei 10.931/2004) ou judicial. Recomenda-se fortemente a contratação prévia do serviço de coleta de anuências (item 6.4) para evitar atrasos.</p>`;
    } else {
      finalP = `<p>Caso o proprietário deseje contratar a coleta das anuências como serviço adicional, consultar o item 6.4 desta proposta (R$ 150,00 por confrontante).</p>`;
    }
    return `
      <div class="aviso-drl">
        <h3>⚠ Responsabilidade do Proprietário — DRL (Declaração de Respeito de Limite)</h3>
        ${paragrafos.map(p => `<p>${p}</p>`).join('')}
        ${finalP}
      </div>`;
  }

  // v3.23.5: textos da finalidade do Georref Rural (espelha o PDF/engine)
  const FINALIDADE_TEXTOS = {
    CERTIFICACAO:    'Certificação SIGEF/INCRA + averbação na matrícula vigente.',
    DESMEMBRAMENTO:  'Desmembramento — encerramento da matrícula atual e abertura de nova matrícula.',
    REMEMBRAMENTO:   'Remembramento — unificação de matrículas confrontantes em matrícula única.',
    RETIFICACAO:     'Retificação de área — averbação da nova área na matrícula.',
  };
  const OPC_ROTULOS = {
    ccir:        'Atualização do CCIR (INCRA)',
    car:         'Atualização / emissão do CAR (SICAR)',
    itr:         'Regularização de ITR em atraso',
    anuencia:    'Coleta de anuência dos confrontantes',
    retificacao: 'Retificação de área (Lei 10.931/2004)',
  };

  try {
    const res = await fetch('/v/' + encodeURIComponent(hash) + '/json');
    if (!res.ok) {
      const j = await res.json().catch(()=>({error:'Documento não encontrado'}));
      root.innerHTML = `
        <div class="stamp invalid">
          <div class="check">✗</div>
          <h1>Documento inválido</h1>
          <p>${escapeHtml(j.error || 'Hash não corresponde a nenhum documento.')}</p>
        </div>
        <div class="card">
          <p style="font-size:13px;color:#444">Verifique:</p>
          <ul style="font-size:13px;color:#666;margin:8px 0 0 18px;line-height:1.7">
            <li>Se o QR foi escaneado corretamente</li>
            <li>Se o PDF não foi alterado após emissão</li>
            <li>Se o link foi digitado sem erros</li>
          </ul>
        </div>`;
      return;
    }
    // v3.23.5: a rota /v/:hash/json retorna { tipo: 'recibo' | 'proposta', ... }.
    // Antes a pagina sempre destrutuvava `recibo: r` — quebrava pra propostas.
    const payload = await res.json();
    const tenant = payload.tenant;
    document.documentElement.style.setProperty('--cor', tenant?.primary_color || '#10b981');
    document.documentElement.style.setProperty('--cor-dark', tenant?.primary_color_dark || '#059669');

    const headerHtml = `
      <div class="header">
        ${tenant?.logo_url ? `<img src="${escapeHtml(tenant.logo_url)}" class="logo" alt="">` : ''}
        <strong>${escapeHtml(tenant?.brand_name || 'Romatec')}</strong>
        ${tenant?.cnpj ? `<div style="font-size:12px;color:#666">CNPJ ${escapeHtml(tenant.cnpj)}</div>` : ''}
      </div>`;

    if (payload.tipo === 'proposta') {
      // v3.23.5: render proposta — especial pro subtipo georreferenciamento_rural
      // (mostra finalidade + opcionais contratados). Outros subtipos mostram
      // resumo basico (numero, cliente, valor, validade).
      // v3.27.0: render dedicado para demarcacao_urbana / demarcacao_rural.
      const p = payload.proposta;
      const dados = p.dados_imovel || {};
      const subtipoEff = p.subtipo_consultoria || p.subtipo;
      const isGeo = subtipoEff === 'georreferenciamento_rural';
      const isDemarc = subtipoEff === 'demarcacao_urbana' || subtipoEff === 'demarcacao_rural';

      if (isDemarc) {
        const statusUpD = String(p.status || '').toUpperCase();
        const statusClassD =
          statusUpD === 'APROVADA' ? 'status-ok' :
          statusUpD === 'EXPIRADA' || statusUpD === 'CANCELADA' ? 'status-no' :
          'status-pending';
        const finD = dados.finalidade || 'demarcacao_inicial';
        const finTexto = FINALIDADE_DEMARCACAO_TEXTOS[finD] || finD;
        const isUrbana = subtipoEff === 'demarcacao_urbana';
        const marcos = Array.isArray(dados.marcos) ? dados.marcos : [];
        const marcosHtml = marcos.length > 0
          ? `<div class="card">
               <h2>Marcos a implantar</h2>
               <ul style="font-size:13px;color:#333;line-height:1.7;margin-left:18px">
                 ${marcos.map(m => `<li>${m.quantidade}× ${escapeHtml(MATERIAL_MARCO_LABEL[m.tipo] || m.tipo)}</li>`).join('')}
               </ul>
             </div>`
          : '';
        const cm = dados.codigos_mintados;
        const codigosHtml = cm
          ? `<div class="card">
               <h2>Códigos FQNS atribuídos (rastreabilidade INCRA)</h2>
               <dl>
                 <dt>Prefixo</dt><dd><strong>${escapeHtml(cm.prefixo || 'FQNS')}</strong></dd>
                 <dt>Vértices</dt><dd>${(cm.vertices||[]).length} (${(cm.vertices||[])[0] || '-'} ${cm.vertices && cm.vertices.length>1 ? 'a ' + cm.vertices[cm.vertices.length-1] : ''})</dd>
                 <dt>Concreto</dt><dd>${(cm.marcos_por_tipo?.concreto||[]).length}</dd>
                 <dt>Tubo galv.</dt><dd>${(cm.marcos_por_tipo?.tubo_galvanizado||[]).length}</dd>
                 <dt>Madeira</dt><dd>${(cm.marcos_por_tipo?.madeira||[]).length}</dd>
                 <dt>Atribuído em</dt><dd>${escapeHtml(fmtData(cm.mintado_em))}</dd>
               </dl>
             </div>`
          : '';
        const opc = dados.opcionais || {};
        const opcContratados = [];
        if (opc.laudo_tecnico?.contratado) opcContratados.push('<li>Laudo Técnico de Demarcação</li>');
        if (opc.alinhamento_cerca?.contratado) opcContratados.push(`<li>Alinhamento de Cerca — ${opc.alinhamento_cerca.metros||0} m × ${fmtBRL(opc.alinhamento_cerca.valor_unitario||0)}</li>`);
        if (opc.croqui_assinado?.contratado) opcContratados.push(`<li>Croqui Assinado em Cartório — ${fmtBRL(opc.croqui_assinado.valor_unitario||0)}</li>`);
        if (opc.acompanhamento_obra?.contratado) opcContratados.push(`<li>Acompanhamento de Obra — ${opc.acompanhamento_obra.diarias||0} diária(s) × ${fmtBRL(opc.acompanhamento_obra.valor_unitario||0)}</li>`);
        if (opc.consultoria_juridica?.contratado) opcContratados.push('<li>Consultoria Jurídica — <em>Sob orçamento</em></li>');
        const opcHtml = opcContratados.length > 0
          ? `<div class="card"><h2>Serviços adicionais opcionais</h2><ul style="font-size:13px;color:#333;line-height:1.7;margin-left:18px">${opcContratados.join('')}</ul></div>`
          : '';

        root.innerHTML = `
          ${headerHtml}
          <div class="stamp">
            <div class="check">✓</div>
            <h1>Proposta autenticada</h1>
            <p>Documento emitido oficialmente pelo sistema</p>
          </div>
          <div class="card">
            <h2>Detalhes da proposta</h2>
            <dl>
              <dt>Número</dt><dd>${escapeHtml(p.numero || '-')}</dd>
              <dt>Status</dt><dd><span class="status ${statusClassD}">${escapeHtml(statusUpD || 'RASCUNHO')}</span></dd>
              <dt>Cliente</dt><dd>${escapeHtml(p.cliente?.nome || '-')}</dd>
              ${p.cliente?.cpf_cnpj ? `<dt>Documento</dt><dd>${escapeHtml(p.cliente.cpf_cnpj)}</dd>` : ''}
              <dt>Município</dt><dd>${escapeHtml(dados.municipio || '-')}${dados.uf ? '/'+escapeHtml(dados.uf) : ''}</dd>
              ${dados.matricula ? `<dt>Matrícula</dt><dd>${escapeHtml(dados.matricula)}</dd>` : ''}
              ${isUrbana && dados.area_m2 ? `<dt>Área</dt><dd>${Number(dados.area_m2).toLocaleString('pt-BR',{minimumFractionDigits:2})} m²</dd>` : ''}
              ${!isUrbana && dados.area_hectares ? `<dt>Área</dt><dd>${Number(dados.area_hectares).toLocaleString('pt-BR',{minimumFractionDigits:4})} ha</dd>` : ''}
              <dt>Vértices</dt><dd>${dados.num_vertices || '-'}</dd>
              <dt>Valor total</dt><dd><strong>${escapeHtml(fmtBRL(p.valor_total))}</strong></dd>
              <dt>Emitida em</dt><dd>${escapeHtml(fmtData(p.data_proposta || p.criado_em))}</dd>
              <dt>Validade</dt><dd>${p.validade_dias || 15} dias</dd>
            </dl>
            <a href="/v/${encodeURIComponent(hash)}/pdf" class="pdf-link">📄 Abrir PDF original</a>
          </div>
          <div class="card" style="background:#fef3c7;border:1px solid #d97706">
            <h2 style="color:#92400e">Finalidade</h2>
            <p style="font-size:13px;color:#111;font-weight:600">${escapeHtml(finTexto)}</p>
          </div>
          ${marcosHtml}
          ${codigosHtml}
          ${opcHtml}
          ${avisoDRLDemarcacaoHtml(finD)}
          <div class="card">
            <h2>Hash de autenticidade</h2>
            <div class="hash-box">${escapeHtml(p.hash_validacao || hash)}</div>
            <p style="font-size:11px;color:#9ca3af;margin-top:8px">
              Este hash é único e imutável. Vinculado ao conteúdo do PDF no momento da emissão.
            </p>
          </div>`;
        return;
      }

      const statusUp = String(p.status || '').toUpperCase();
      const statusClass =
        statusUp === 'APROVADA' ? 'status-ok' :
        statusUp === 'EXPIRADA' || statusUp === 'CANCELADA' ? 'status-no' :
        'status-pending';

      let opcionaisHtml = '';
      if (isGeo && dados.opcionais) {
        const op = dados.opcionais;
        const contratados = [];
        if (op.ccir?.contratado)        contratados.push(`<li>${escapeHtml(OPC_ROTULOS.ccir)} — ${fmtBRL(op.ccir.valor_unitario)}</li>`);
        if (op.car?.contratado)         contratados.push(`<li>${escapeHtml(OPC_ROTULOS.car)} — ${fmtBRL(op.car.valor_unitario)}</li>`);
        if (op.itr?.contratado)         contratados.push(`<li>${escapeHtml(OPC_ROTULOS.itr)} — ${op.itr.quantidade}× ${fmtBRL(op.itr.valor_unitario)} = ${fmtBRL((op.itr.quantidade||0)*(op.itr.valor_unitario||0))}</li>`);
        if (op.anuencia?.contratado)    contratados.push(`<li>${escapeHtml(OPC_ROTULOS.anuencia)} — ${op.anuencia.quantidade}× ${fmtBRL(op.anuencia.valor_unitario)} = ${fmtBRL((op.anuencia.quantidade||0)*(op.anuencia.valor_unitario||0))}</li>`);
        if (op.retificacao?.contratado) contratados.push(`<li>${escapeHtml(OPC_ROTULOS.retificacao)} — <em>Sob orçamento</em></li>`);
        opcionaisHtml = contratados.length > 0
          ? `<div class="card">
               <h2>Serviços adicionais opcionais (não inclusos no total)</h2>
               <ul style="font-size:13px;color:#333;line-height:1.7;margin-left:18px">${contratados.join('')}</ul>
             </div>`
          : '';
      }

      const finalidadeHtml = isGeo && dados.finalidade
        ? `<div class="card" style="background:#fef3c7;border:1px solid #d97706">
             <h2 style="color:#92400e">Finalidade</h2>
             <p style="font-size:13px;color:#111;font-weight:600">${escapeHtml(FINALIDADE_TEXTOS[dados.finalidade] || dados.finalidade)}</p>
           </div>`
        : '';

      root.innerHTML = `
        ${headerHtml}
        <div class="stamp">
          <div class="check">✓</div>
          <h1>Proposta autenticada</h1>
          <p>Documento emitido oficialmente pelo sistema</p>
        </div>
        <div class="card">
          <h2>Detalhes da proposta</h2>
          <dl>
            <dt>Número</dt><dd>${escapeHtml(p.numero || '-')}</dd>
            <dt>Status</dt><dd><span class="status ${statusClass}">${escapeHtml(statusUp || 'RASCUNHO')}</span></dd>
            <dt>Cliente</dt><dd>${escapeHtml(p.cliente?.nome || '-')}</dd>
            ${p.cliente?.cpf_cnpj ? `<dt>Documento</dt><dd>${escapeHtml(p.cliente.cpf_cnpj)}</dd>` : ''}
            ${isGeo && dados.municipio ? `<dt>Município</dt><dd>${escapeHtml(dados.municipio)}${dados.estado ? '/'+escapeHtml(dados.estado) : ''}</dd>` : ''}
            ${isGeo && dados.matricula ? `<dt>Matrícula</dt><dd>${escapeHtml(dados.matricula)}</dd>` : ''}
            ${isGeo && dados.area_hectares ? `<dt>Área</dt><dd>${Number(dados.area_hectares).toLocaleString('pt-BR',{minimumFractionDigits:4})} ha</dd>` : ''}
            <dt>Valor total</dt><dd><strong>${escapeHtml(fmtBRL(p.valor_total))}</strong></dd>
            <dt>Emitida em</dt><dd>${escapeHtml(fmtData(p.data_proposta || p.criado_em))}</dd>
            <dt>Validade</dt><dd>${p.validade_dias || 15} dias</dd>
          </dl>
          <a href="/v/${encodeURIComponent(hash)}/pdf" class="pdf-link">📄 Abrir PDF original</a>
        </div>
        ${finalidadeHtml}
        ${opcionaisHtml}
        ${isGeo ? avisoDRLHtml(dados.finalidade) : ''}
        <div class="card">
          <h2>Hash de autenticidade</h2>
          <div class="hash-box">${escapeHtml(p.hash_validacao || hash)}</div>
          <p style="font-size:11px;color:#9ca3af;margin-top:8px">
            Este hash é único e imutável. Vinculado ao conteúdo do PDF no momento da emissão.
          </p>
        </div>`;
      return;
    }

    // Render recibo (caminho original)
    const r = payload.recibo;
    const statusClass =
      r.status === 'confirmado' ? 'status-ok' :
      r.status === 'contestado' || r.status === 'expirado' || r.status === 'cancelado' ? 'status-no' :
      'status-pending';

    let html = `
      ${headerHtml}
      <div class="stamp">
        <div class="check">✓</div>
        <h1>Documento autenticado</h1>
        <p>Recibo emitido oficialmente pelo sistema</p>
      </div>
      <div class="card">
        <h2>Detalhes do recibo</h2>
        <dl>
          <dt>Tipo</dt><dd>${escapeHtml(TIPO_TITULO[r.tipo] || r.tipo)}</dd>
          <dt>Número</dt><dd>${escapeHtml(r.numero)}</dd>
          <dt>Status</dt><dd><span class="status ${statusClass}">${escapeHtml(STATUS_LABEL[r.status] || r.status)}</span></dd>
          <dt>Destinatário</dt><dd>${escapeHtml(r.destinatario_nome)}</dd>
          ${r.destinatario_doc ? `<dt>Documento</dt><dd>${escapeHtml(r.destinatario_doc)}</dd>` : ''}
          ${r.valor != null ? `<dt>Valor</dt><dd><strong>${escapeHtml(fmtBRL(r.valor))}</strong></dd>` : ''}
          ${r.forma_pagamento ? `<dt>Forma</dt><dd>${escapeHtml(r.forma_pagamento.toUpperCase())}</dd>` : ''}
          ${r.descricao_servico ? `<dt>Descrição</dt><dd>${escapeHtml(r.descricao_servico)}</dd>` : ''}
          <dt>Emitido em</dt><dd>${escapeHtml(fmtData(r.created_at))}</dd>
          ${r.respondido_em ? `<dt>Respondido em</dt><dd>${escapeHtml(fmtData(r.respondido_em))}</dd>` : ''}
        </dl>
        <a href="/v/${encodeURIComponent(hash)}/pdf" class="pdf-link">📄 Abrir PDF original</a>
      </div>
      <div class="card">
        <h2>Hash de autenticidade</h2>
        <div class="hash-box">${escapeHtml(r.hash_validacao)}</div>
        <p style="font-size:11px;color:#9ca3af;margin-top:8px">
          Este hash é único e imutável. Vinculado ao conteúdo do PDF no momento da emissão.
        </p>
      </div>`;
    root.innerHTML = html;
  } catch (err) {
    root.innerHTML = `<div class="stamp invalid"><div class="check">✗</div><h1>Erro</h1><p>${escapeHtml(err.message)}</p></div>`;
  }
})();
</script>
</body>
</html>
