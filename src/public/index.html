<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ZAYRA" />
<meta name="theme-color" content="#04140d" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icons/zayra-180.png" />
<link rel="apple-touch-icon" sizes="120x120" href="/icons/zayra-120.png" />
<link rel="apple-touch-icon" sizes="152x152" href="/icons/zayra-152.png" />
<link rel="apple-touch-icon" sizes="167x167" href="/icons/zayra-167.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/icons/zayra-180.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/zayra-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/zayra-512.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/zayra-120.png" />
<title>ZAYRA — Romatec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg-deep:#020a07;--bg-mid:#04140d;--neon:#3dffb0;--gold:#d4b878;--text:#cfeede;--text-dim:#6a8a7c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg-deep);color:var(--text);font-family:'JetBrains Mono',monospace;overflow:hidden;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 800px at 50% -10%, rgba(61,255,176,.18), transparent 60%),radial-gradient(900px 600px at 20% 110%, rgba(212,184,120,.08), transparent 60%),linear-gradient(180deg, var(--bg-deep), var(--bg-mid) 60%, #010705);min-height:100vh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#particles{position:fixed;inset:0;z-index:0;opacity:.55}
.stage{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;width:100%;max-width:480px;margin:0 auto}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center}
.brand{font-family:'Orbitron',sans-serif;font-weight:900;letter-spacing:.35em;font-size:13px;color:var(--gold)}
.status{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.18em}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--neon);box-shadow:0 0 12px var(--neon);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.85)}}
.core-wrap{margin-top:14px;width:min(86vw,420px);aspect-ratio:1/1}
#neural{width:100%;height:100%;display:block}
.clock{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:'Orbitron',sans-serif;color:var(--gold);opacity:.78;text-align:center;line-height:1.1}
.clock-time{font-weight:700;font-size:22px;letter-spacing:.18em;color:var(--neon);text-shadow:0 0 10px rgba(61,255,176,.35)}
.clock-time .seconds{font-size:14px;letter-spacing:.12em;color:var(--gold);opacity:.85;margin-left:4px}
.clock-date{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--text-dim)}
.identity{margin-top:14px;text-align:center}
.name{font-family:'Orbitron',sans-serif;font-weight:900;font-size:38px;letter-spacing:.55em;color:var(--neon);text-shadow:0 0 24px rgba(61,255,176,.55);padding-left:.55em}
.role{margin-top:6px;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--text-dim)}
.state{margin-top:18px;display:inline-flex;align-items:center;gap:10px;padding:10px 22px;border:1px solid rgba(212,184,120,.45);border-radius:999px;background:rgba(7,32,24,.6);backdrop-filter:blur(6px);font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.state .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.state[data-state="listening"]{border-color:var(--neon);color:var(--neon)}
.state[data-state="listening"] .dot{background:var(--neon);box-shadow:0 0 14px var(--neon);animation:pulse 1s infinite}
.state[data-state="thinking"]{border-color:#ffd166;color:#ffd166}
.state[data-state="speaking"]{border-color:#7fffd4;color:#7fffd4}
.transcript{margin-top:14px;margin-bottom:16px;width:100%;min-height:60px;max-height:min(28vh,26dvh);padding:14px;border:1px solid rgba(61,255,176,.15);border-radius:12px;background:rgba(4,20,13,.55);backdrop-filter:blur(8px);font-size:13px;color:var(--text);line-height:1.5;text-align:left;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(61,255,176,.55) rgba(4,20,13,.3)}
.transcript::-webkit-scrollbar{width:6px}
.transcript::-webkit-scrollbar-track{background:rgba(4,20,13,.3);border-radius:8px}
.transcript::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(61,255,176,.6),rgba(61,255,176,.25));border-radius:8px;border:1px solid rgba(61,255,176,.2)}
.transcript::-webkit-scrollbar-thumb:hover{background:rgba(61,255,176,.8)}
.transcript:empty::before{content:"Toque o microfone e fale com a ZAYRA";color:var(--text-dim);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.nav-links{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nav-links a{color:var(--gold);text-decoration:none;font-size:11px;letter-spacing:.22em;text-transform:uppercase;padding:6px 12px;border:1px solid rgba(212,184,120,.35);border-radius:999px;background:rgba(7,32,24,.45);transition:all .2s}
.nav-links a:hover{border-color:var(--neon);color:var(--neon);box-shadow:0 0 12px rgba(61,255,176,.3)}
/* v1.65.31: badge de versao do app — combina com o de obras.html */
.version-badge{background:linear-gradient(135deg,rgba(61,255,176,.15),rgba(212,184,120,.15));border:1px solid rgba(61,255,176,.35);color:var(--neon);padding:4px 10px;border-radius:999px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;font-family:'Orbitron',sans-serif}
/* v1.65.28: mic menor (52px) e mais alto pra nao cobrir o transcript.
   Tambem encolhi a fonte pra ficar mais discreto. */
.mic{position:fixed;right:14px;bottom:calc(82px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:1px solid var(--neon);background:radial-gradient(circle at 30% 30%,#0a3326,#020a07 70%);color:var(--neon);display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;box-shadow:0 0 30px rgba(61,255,176,.35);z-index:11}
.mic.active{animation:micPulse 1.2s infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 20px rgba(61,255,176,.4)}50%{box-shadow:0 0 50px rgba(61,255,176,.9)}}

/* ── CHAT PANEL (v1.37) — docked embaixo, estilo WhatsApp Web ──────── */
.chat-fab{display:none}  /* removido — chat sempre visível agora */

.chat-overlay{position:fixed;left:0;right:0;bottom:0;background:transparent;z-index:10;display:flex;flex-direction:column;align-items:stretch;pointer-events:none}
.chat-overlay > *{pointer-events:auto}
.chat-modal{width:100%;max-width:560px;margin:0 auto;background:linear-gradient(180deg,rgba(4,20,13,.98),rgba(2,10,7,.98));border:1px solid rgba(61,255,176,.25);border-bottom:none;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -8px 40px rgba(61,255,176,.18);transition:height .25s ease;backdrop-filter:blur(8px)}
.chat-modal{height:60px}
.chat-overlay.open .chat-modal{height:min(75vh,640px)}
/* Quando recolhido, esconde tudo exceto header. Quando aberto, mostra tudo. */
.chat-msgs,.chat-attachments,.chat-rec-info,.chat-status,.chat-input-row,.chat-toggle-voice{display:none}
.chat-overlay.open .chat-msgs{display:flex}
.chat-overlay.open .chat-input-row{display:flex}
.chat-overlay.open .chat-toggle-voice{display:flex}

.chat-header{padding:14px 18px;border-bottom:1px solid rgba(61,255,176,.15);display:flex;justify-content:space-between;align-items:center;background:rgba(7,32,24,.5);cursor:pointer;flex-shrink:0;height:60px;box-sizing:border-box}
.chat-header h3{font-family:'Orbitron',sans-serif;font-weight:700;font-size:15px;letter-spacing:.2em;color:var(--neon);display:flex;align-items:center;gap:10px}
.chat-header h3::before{content:'💬';font-size:18px;letter-spacing:0}
.chat-header .close{background:transparent;border:none;color:var(--text-dim);font-size:22px;cursor:pointer;padding:4px 10px;transition:transform .25s}
.chat-overlay.open .chat-header .close{transform:rotate(45deg)}
.chat-header .close:hover{color:var(--neon)}
/* Espaço pra que a barra fixa não tampe o conteúdo principal.
   v1.65.28: 160px = chat dock 60px + mic FAB 52px + safe-area + folga.
   Garante que o transcript termina ACIMA do mic, sem sobreposicao. */
body.has-chat-bar .stage{padding-bottom:calc(160px + env(safe-area-inset-bottom))}

.chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.msg-bubble{max-width:85%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5;word-wrap:break-word;white-space:pre-wrap}
.msg-user{align-self:flex-end;background:linear-gradient(135deg,rgba(61,255,176,.18),rgba(61,255,176,.08));border:1px solid rgba(61,255,176,.3);color:var(--text);border-bottom-right-radius:4px}
.msg-zayra{align-self:flex-start;background:rgba(7,32,24,.7);border:1px solid rgba(212,184,120,.25);color:var(--text);border-bottom-left-radius:4px}
.msg-bubble .attach-preview{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.msg-bubble .attach-preview img{width:80px;height:80px;object-fit:cover;border-radius:6px;border:1px solid rgba(61,255,176,.3)}
.msg-bubble .attach-preview .doc{padding:6px 10px;background:rgba(212,184,120,.15);border:1px solid var(--gold);border-radius:6px;font-size:11px;color:var(--gold)}
.msg-meta{font-size:10px;color:var(--text-dim);margin-top:4px;letter-spacing:.06em}
.msg-tools{margin-top:6px;font-size:10px;color:var(--gold);opacity:.85;font-family:'JetBrains Mono',monospace}

.chat-status{padding:8px 14px;font-size:11px;color:var(--gold);text-align:center;letter-spacing:.18em;text-transform:uppercase;background:rgba(212,184,120,.06);border-top:1px solid rgba(212,184,120,.15);display:none}
.chat-status.active{display:flex;justify-content:center;gap:8px;align-items:center}
.chat-status .dots{display:inline-flex;gap:3px}
.chat-status .dots span{width:5px;height:5px;background:var(--gold);border-radius:50%;animation:typing 1.2s infinite}
.chat-status .dots span:nth-child(2){animation-delay:.15s}
.chat-status .dots span:nth-child(3){animation-delay:.3s}
@keyframes typing{0%,60%,100%{opacity:.3;transform:scale(.8)}30%{opacity:1;transform:scale(1.1)}}

.chat-attachments{padding:8px 14px;border-top:1px solid rgba(61,255,176,.1);display:none;flex-wrap:wrap;gap:6px;background:rgba(4,20,13,.5)}
.chat-attachments.has-items{display:flex}
.attach-chip{position:relative;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;background:rgba(212,184,120,.12);border:1px solid var(--gold);border-radius:8px;font-size:11px;color:var(--gold)}
.attach-chip img{width:32px;height:32px;object-fit:cover;border-radius:4px}
.attach-chip button{background:transparent;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;padding:0 4px}
.attach-chip button:hover{color:#ff5555}

.chat-input-row{padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid rgba(61,255,176,.15);display:flex;gap:8px;align-items:flex-end;background:rgba(4,20,13,.6)}
.chat-input-row .icon-btn{flex-shrink:0;width:40px;height:40px;border-radius:50%;border:1px solid rgba(212,184,120,.4);background:rgba(7,32,24,.6);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;padding:0;transition:all .15s}
.chat-input-row .icon-btn:hover{border-color:var(--neon);color:var(--neon)}
.chat-input-row .icon-btn.recording{border-color:#ff5555;color:#ff5555;background:rgba(255,85,85,.15);animation:recPulse 1s infinite}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,85,85,.6)}50%{box-shadow:0 0 0 8px rgba(255,85,85,0)}}
.chat-rec-info{padding:8px 14px;font-size:12px;color:#ff5555;text-align:center;letter-spacing:.1em;background:rgba(255,85,85,.08);border-top:1px solid rgba(255,85,85,.2);display:none}
.chat-rec-info.active{display:flex;justify-content:center;gap:10px;align-items:center}
.chat-rec-info .rec-dot{width:8px;height:8px;background:#ff5555;border-radius:50%;animation:pulse 1s infinite}
.chat-input-row textarea{flex:1;min-height:40px;max-height:120px;padding:10px 14px;background:rgba(2,10,7,.8);border:1px solid rgba(61,255,176,.2);border-radius:20px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:14px;resize:none;outline:none}
.chat-input-row textarea:focus{border-color:var(--neon);box-shadow:0 0 10px rgba(61,255,176,.2)}
.chat-input-row textarea::placeholder{color:var(--text-dim)}
.chat-input-row .send-btn{flex-shrink:0;width:42px;height:42px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--neon),#7fffd4);color:#020a07;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;font-weight:bold}
.chat-input-row .send-btn:hover{filter:brightness(1.15);box-shadow:0 0 16px rgba(61,255,176,.5)}
.chat-input-row .send-btn:disabled{opacity:.4;cursor:not-allowed}

.chat-toggle-voice{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text-dim);padding:0 4px}
.chat-toggle-voice input{accent-color:var(--neon)}

.chat-empty{text-align:center;color:var(--text-dim);font-size:12px;padding:40px 20px;letter-spacing:.1em}
.chat-empty strong{color:var(--gold);display:block;margin-bottom:8px}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="stage">
  <div class="topbar">
    <div class="brand">ROMATEC</div>
    <div class="nav-links">
      <span class="version-badge" id="versionBadge" title="Versão do app">v...</span>
      <a href="/obras" title="Gestão de Obras">🏗 Obras</a>
      <div class="status"><span class="pulse"></span><span>ZAYRA online</span></div>
    </div>
  </div>
  <div class="core-wrap"><canvas id="neural"></canvas></div>
  <div class="clock" id="clock">
    <div class="clock-time"><span id="clockHM">--:--</span><span class="seconds" id="clockS">--</span></div>
    <div class="clock-date" id="clockDate">— — —</div>
  </div>
  <div class="identity">
    <div class="name">ZAYRA</div>
    <div class="role">Assistente Executiva — Romatec</div>
  </div>
  <div class="state" id="stateChip" data-state="idle">
    <span class="dot"></span><span id="stateLabel">Em Standby</span>
  </div>
  <div class="transcript" id="transcript"></div>
</div>
<button class="mic" id="micBtn" aria-label="Falar com a ZAYRA">🎙</button>
<button class="chat-fab" id="chatFab" aria-label="Abrir chat de texto">💬</button>

<!-- Chat Modal (v1.35) -->
<div class="chat-overlay" id="chatOverlay">
  <div class="chat-modal">
    <div class="chat-header">
      <h3>Conversar com ZAYRA</h3>
      <button class="close" id="chatClose" aria-label="Abrir/fechar chat">+</button>
    </div>
    <div class="chat-msgs" id="chatMsgs">
      <div class="chat-empty">
        <strong>💬 Comece a conversar</strong>
        Digite sua mensagem, anexe foto ou documento.<br>
        ZAYRA responde em texto e (opcional) áudio.
      </div>
    </div>
    <div class="chat-status" id="chatStatus">
      <span id="chatStatusText">processando</span>
      <span class="dots"><span></span><span></span><span></span></span>
    </div>
    <div class="chat-attachments" id="chatAttachments"></div>
    <div class="chat-rec-info" id="chatRecInfo">
      <span class="rec-dot"></span>
      <span>Gravando… <span id="chatRecTimer">0s</span> · clique no mic pra parar e enviar</span>
    </div>
    <div class="chat-input-row">
      <input type="file" id="fileInput" multiple accept="image/*,application/pdf" style="display:none">
      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
      <button class="icon-btn" id="btnAttach" title="Anexar arquivo (PDF/imagem)">📎</button>
      <button class="icon-btn" id="btnCamera" title="Tirar foto">📷</button>
      <button class="icon-btn" id="btnMicChat" title="Gravar áudio (clique pra gravar, clique pra enviar)">🎙</button>
      <textarea id="chatInput" placeholder="Mensagem pra ZAYRA..." rows="1"></textarea>
      <button class="send-btn" id="chatSend" title="Enviar (Enter)">▶</button>
    </div>
    <div class="chat-toggle-voice" style="padding:0 14px 8px;">
      <label><input type="checkbox" id="chatVoice"> Resposta em áudio também</label>
    </div>
  </div>
</div>
<script>
/* v1.65.31: badge de versao sincroniza com /health (mesma logica do obras.html) */
fetch('/health')
  .then(r => r.json())
  .then(d => {
    const el = document.getElementById('versionBadge');
    if (el && d && d.version) el.textContent = 'v' + d.version;
  })
  .catch(() => {
    const el = document.getElementById('versionBadge');
    if (el) el.textContent = '—';
  });

/* RELÓGIO — Fortaleza/BRT, com segundos discretos */
(()=>{
  const hm=document.getElementById('clockHM');
  const ss=document.getElementById('clockS');
  const dd=document.getElementById('clockDate');
  const TZ='America/Fortaleza';
  function pad(n){return String(n).padStart(2,'0');}
  function tick(){
    const now=new Date();
    const fmtTime=new Intl.DateTimeFormat('pt-BR',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false});
    const fmtSec =new Intl.DateTimeFormat('pt-BR',{timeZone:TZ,second:'2-digit'});
    const fmtDate=new Intl.DateTimeFormat('pt-BR',{timeZone:TZ,weekday:'short',day:'2-digit',month:'short',year:'numeric'});
    hm.textContent=fmtTime.format(now);
    ss.textContent=':'+pad(parseInt(fmtSec.format(now),10));
    dd.textContent=fmtDate.format(now).replace('.','').replace('.','');
  }
  tick();setInterval(tick,1000);
})();

/* PARTÍCULAS */
(()=>{const c=document.getElementById('particles'),x=c.getContext('2d');let W,H,parts;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;
parts=Array.from({length:Math.min(80,Math.floor(W*H/16000))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.4+.3,a:Math.random()*.6+.2}));}
rs();addEventListener('resize',rs);
(function loop(){x.clearRect(0,0,W,H);for(const p of parts){p.x+=p.vx;p.y+=p.vy;
if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fillStyle=`rgba(61,255,176,${p.a})`;x.fill();}
requestAnimationFrame(loop);})();})();

/* NÚCLEO NEURAL */
const cv=document.getElementById('neural'),ctx=cv.getContext('2d');
const DPR=Math.min(devicePixelRatio||1,2);
function fitCore(){const r=cv.getBoundingClientRect();cv.width=r.width*DPR;cv.height=r.height*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fitCore();addEventListener('resize',fitCore);
const NODES=22;
const nodes=Array.from({length:NODES},(_,i)=>({ang:(i/NODES)*Math.PI*2,rBase:.55+Math.random()*.25,phase:Math.random()*Math.PI*2,speed:.4+Math.random()*.6}));
let amp=.15,target=.15;
function drawCore(t){
  const w=cv.clientWidth,h=cv.clientHeight,cx=w/2,cy=h/2,R=Math.min(w,h)/2-6;
  ctx.clearRect(0,0,w,h);
  const grad=ctx.createRadialGradient(cx,cy,R*.1,cx,cy,R);
  grad.addColorStop(0,'rgba(61,255,176,.18)');grad.addColorStop(.6,'rgba(61,255,176,.05)');grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grad;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.translate(cx,cy);ctx.rotate(t*.0002);
  ctx.strokeStyle='rgba(212,184,120,.55)';ctx.lineWidth=1;ctx.setLineDash([4,8]);
  ctx.beginPath();ctx.arc(0,0,R-2,0,Math.PI*2);ctx.stroke();ctx.restore();
  ctx.save();ctx.translate(cx,cy);
  const innerR=R*0.66+amp*R*0.18;
  ctx.strokeStyle=`rgba(61,255,176,${.35+amp*.5})`;ctx.lineWidth=1.2;ctx.setLineDash([]);
  ctx.beginPath();ctx.arc(0,0,innerR,0,Math.PI*2);ctx.stroke();
  for(let i=0;i<60;i++){const a=(i/60)*Math.PI*2+t*.0006;
    const r1=innerR-2,r2=innerR-2-(2+amp*8);
    ctx.beginPath();ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);
    ctx.strokeStyle=`rgba(61,255,176,${.15+amp*.6})`;ctx.stroke();}
  ctx.restore();
  ctx.save();ctx.translate(cx,cy);
  const pos=[];
  for(const n of nodes){const wob=Math.sin(t*.001*n.speed+n.phase)*.06;
    const r=(n.rBase+wob)*R*(0.7+amp*0.15),ang=n.ang+t*.00015;
    pos.push({x:Math.cos(ang)*r,y:Math.sin(ang)*r});}
  for(let i=0;i<pos.length;i++)for(let j=i+1;j<pos.length;j++){
    const a=pos[i],b=pos[j],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d<R*0.55){const op=(1-d/(R*0.55))*(0.18+amp*.5);
      ctx.strokeStyle=`rgba(61,255,176,${op})`;ctx.lineWidth=.7;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}
  for(const p of pos){ctx.beginPath();ctx.arc(p.x,p.y,1.6+amp*1.6,0,Math.PI*2);
    ctx.fillStyle='rgba(61,255,176,.95)';ctx.shadowColor='rgba(61,255,176,.9)';ctx.shadowBlur=8+amp*16;
    ctx.fill();ctx.shadowBlur=0;}
  ctx.restore();
  ctx.save();ctx.translate(cx,cy);
  const coreR=R*0.18+amp*R*0.05;
  const cg=ctx.createRadialGradient(0,0,0,0,0,coreR);
  cg.addColorStop(0,'rgba(255,255,255,.95)');cg.addColorStop(.4,'rgba(127,255,212,.7)');cg.addColorStop(1,'rgba(61,255,176,0)');
  ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,0,coreR,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(212,184,120,.85)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.arc(0,0,coreR*1.35,0,Math.PI*2);ctx.stroke();ctx.restore();
}
(function tick(t){amp+=(target-amp)*0.08;drawCore(t);requestAnimationFrame(tick);})();

/* DESBLOQUEIO DE ÁUDIO iOS — iOS Safari bloqueia .play() fora de user gesture.
   Solução: na PRIMEIRA interação (toque/clique), tocar um áudio silencioso
   sincronicamente. Isso autoriza todas as reproduções futuras na sessão. */
let audioUnlocked=false;
function unlockAudioPlayback(){
  if(audioUnlocked)return;
  audioUnlocked=true;
  try{
    // Web Audio API: cria audioCtx global se nao existe e destrava com buffer silencioso
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(Ctx){
      if(!audioCtx) audioCtx=new Ctx();
      if(audioCtx.state==='suspended') audioCtx.resume().catch(()=>{});
      const buf=audioCtx.createBuffer(1,1,22050);
      const src=audioCtx.createBufferSource();
      src.buffer=buf;src.connect(audioCtx.destination);src.start(0);
    }
  }catch(e){console.warn('[unlock webaudio]',e.message);}
  try{
    // HTMLAudioElement (pra new Audio() da resposta de voz da ZAYRA)
    const a=new Audio('data:audio/mp3;base64,SUQzBAAAAAABEVRYWFgAAAAtAAADY29tbWVudABCaWdTb3VuZEJhbmsuY29tIC8gTGFTb25vdGhlcXVlLm9yZwBURU5DAAAAHQAAA1N3aXRjaCBQbHVzIMKpIE5DSCBTb2Z0d2FyZQBUSVQyAAAABgAAAzIyMzUAVFNTRQAAAA8AAANMYXZmNTcuODMuMTAwAAAAAAAAAAAAAAD/80DEAAAAA0gAAAAATEFNRTMuMTAwVVVVVVVVVVVVVUxBTUUzLjEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV');
    a.volume=0;
    a.play().then(()=>{a.pause();}).catch(()=>{});
  }catch(e){console.warn('[unlock html5]',e.message);}
}
// Liga o desbloqueio na primeira interação em qualquer lugar da página
document.addEventListener('touchstart',unlockAudioPlayback,{once:true,passive:true});
document.addEventListener('click',unlockAudioPlayback,{once:true});

/* MICROFONE → /voice (com auto-stop por silêncio) */
let audioCtx,analyser,dataArr,micStream,mediaRec,chunks=[],listening=false;
let recordStartedAt=0,silenceStartedAt=0,maxRecordTimer=null;
const SILENCE_RMS=0.025;        // limite abaixo do qual considera silêncio
const SILENCE_HOLD_MS=1500;     // 1.5s de silêncio = parar e enviar
const MIN_RECORD_MS=800;        // só pára depois de 0.8s gravando (evita disparo prematuro)
const MAX_RECORD_MS=30000;      // hard cap 30s
document.getElementById('micBtn').addEventListener('click',toggleListen);
function autoStopRec(){
  if(!listening)return;
  listening=false;
  document.getElementById('micBtn').classList.remove('active');
  if(maxRecordTimer){clearTimeout(maxRecordTimer);maxRecordTimer=null;}
  if(mediaRec&&mediaRec.state==='recording')mediaRec.stop();
}

async function toggleListen(){
  unlockAudioPlayback(); // Garante áudio desbloqueado mesmo se mic for o 1º toque
  const btn=document.getElementById('micBtn');
  if(listening){
    listening=false;btn.classList.remove('active');
    if(maxRecordTimer){clearTimeout(maxRecordTimer);maxRecordTimer=null;}
    if(mediaRec&&mediaRec.state==='recording')mediaRec.stop();
    return;
  }
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      throw new Error('Mic API indisponível (precisa HTTPS + iOS 14.3+)');
    }
    if(typeof MediaRecorder==='undefined'){
      throw new Error('MediaRecorder indisponível neste navegador');
    }
    micStream=await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaStreamSource(micStream);
    analyser=audioCtx.createAnalyser();analyser.fftSize=512;src.connect(analyser);
    dataArr=new Uint8Array(analyser.frequencyBinCount);
    chunks=[];
    let mime='';
    if(MediaRecorder.isTypeSupported('audio/webm;codecs=opus'))mime='audio/webm;codecs=opus';
    else if(MediaRecorder.isTypeSupported('audio/webm'))mime='audio/webm';
    else if(MediaRecorder.isTypeSupported('audio/mp4'))mime='audio/mp4';
    else if(MediaRecorder.isTypeSupported('audio/aac'))mime='audio/aac';
    mediaRec=mime?new MediaRecorder(micStream,{mimeType:mime}):new MediaRecorder(micStream);
    const realMime=mediaRec.mimeType||mime||'audio/webm';
    mediaRec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
    mediaRec.onstop=async()=>{
      micStream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(chunks,{type:realMime});
      await sendToZayra(blob,realMime);
    };
    mediaRec.onerror=e=>{tx('Erro mic: '+(e.error?.message||'desconhecido'));setState('idle');};
    mediaRec.start();
    listening=true;btn.classList.add('active');setState('listening','Fale agora…');
    tx('🎙 Fale agora — eu paro sozinha quando você terminar (ou toque o mic pra parar)');
    recordStartedAt=Date.now();silenceStartedAt=0;
    maxRecordTimer=setTimeout(()=>{if(listening){tx('⏱ 30s — parando');autoStopRec();}},MAX_RECORD_MS);
    loopMic();
  }catch(e){
    setState('idle','Mic bloqueado');
    tx('❌ '+(e.message||e));
    console.error('[mic]',e);
  }
}
function loopMic(){if(!listening)return;
  analyser.getByteTimeDomainData(dataArr);let sum=0;
  for(let i=0;i<dataArr.length;i++){const v=(dataArr[i]-128)/128;sum+=v*v;}
  const rms=Math.sqrt(sum/dataArr.length);
  target=Math.min(1,.25+rms*4);
  // Auto-stop por silêncio (depois do mínimo de gravação)
  const elapsed=Date.now()-recordStartedAt;
  if(elapsed>MIN_RECORD_MS){
    if(rms<SILENCE_RMS){
      if(silenceStartedAt===0)silenceStartedAt=Date.now();
      else if(Date.now()-silenceStartedAt>SILENCE_HOLD_MS){
        tx('⏸ silêncio detectado — enviando');
        autoStopRec();return;
      }
    } else {
      silenceStartedAt=0; // som de novo, reseta
    }
  }
  requestAnimationFrame(loopMic);
}
async function sendToZayra(blob,mime){
  setState('thinking','Processando…');
  tx('Enviando '+(blob.size/1024).toFixed(1)+' KB…');
  const ext=(mime||'').includes('mp4')?'mp4':(mime||'').includes('webm')?'webm':'audio';
  const fd=new FormData();
  fd.append('audio',blob,'voice.'+ext);
  try{
    const r=await fetch('/voice',{method:'POST',body:fd,cache:'no-store'});
    if(!r.ok){
      const errTxt=await r.text().catch(()=>'(sem corpo)');
      tx('❌ HTTP '+r.status+' — '+errTxt.slice(0,200));
      setState('idle');return;
    }
    const ctype=r.headers.get('content-type')||'';
    if(ctype.includes('audio')){
      const audioBlob=await r.blob();
      const txtHdr=r.headers.get('x-zayra-text')||r.headers.get('x-response-text');
      const trHdr=r.headers.get('x-transcription');
      const trans=trHdr?decodeURIComponent(trHdr):'';
      const resp=txtHdr?decodeURIComponent(txtHdr):'';
      tx((trans?'🎙 '+trans+'\n\n':'')+(resp||'(sem resposta)'));
      setState('speaking','Falando…');
      // Toca via Web Audio API (audioCtx ja foi desbloqueado pelo mic do user).
      // iOS Safari nao bloqueia AudioContext apos resume(), so HTMLAudioElement.
      try{
        if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
        if(audioCtx.state==='suspended') await audioCtx.resume();
        const arr=await audioBlob.arrayBuffer();
        const buf=await audioCtx.decodeAudioData(arr.slice(0));
        const src=audioCtx.createBufferSource();
        src.buffer=buf;src.connect(audioCtx.destination);
        src.onended=()=>setState('idle');
        src.start(0);
      }catch(playErr){
        // Fallback: tenta HTMLAudioElement se Web Audio API falhar (codec etc)
        console.warn('[Web Audio fallback]',playErr.message);
        try{
          const audio=new Audio(URL.createObjectURL(audioBlob));
          audio.onended=()=>setState('idle');
          audio.onerror=()=>{tx(tx.textContent+'\n⚠️ erro tocando áudio');setState('idle');};
          await audio.play();
        }catch(htmlErr){
          tx((tx.textContent||'')+'\n⚠️ play() bloqueado: '+htmlErr.message);
          setState('idle');
        }
      }
    } else {
      const data=await r.json();
      tx(data.response||data.text||data.message||'(sem resposta)');
      setState('idle');
    }
  }catch(e){
    console.error('[fetch /voice]',e);
    tx('❌ Falha de rede: '+(e.message||e));
    setState('idle');
  }
}

/* ── CHAT DE TEXTO (v1.35) ──────────────────────────────────────────── */
const chatState = {
  msgs:        [], // {role, text, attachments?, tools?, ts}
  attachments: [], // {file, dataUrl, name, type}
  sessionId:   null,
  busy:        false,
};

const $ = id => document.getElementById(id);
const escapeHtml = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function chatRender(){
  const c = $('chatMsgs');
  if(chatState.msgs.length===0){
    c.innerHTML = `<div class="chat-empty"><strong>💬 Comece a conversar</strong>Digite sua mensagem, anexe foto ou documento.<br>ZAYRA responde em texto e (opcional) áudio.</div>`;
    return;
  }
  c.innerHTML = chatState.msgs.map(m => {
    const isUser = m.role === 'user';
    const cls = isUser ? 'msg-user' : 'msg-zayra';
    const attaches = (m.attachments||[]).map(a =>
      a.type.startsWith('image/')
        ? `<img src="${escapeHtml(a.dataUrl)}">`
        : `<div class="doc">📄 ${escapeHtml(a.name)}</div>`
    ).join('');
    const tools = (m.tools && m.tools.length)
      ? `<div class="msg-tools">🔧 ${m.tools.map(t=>typeof t==='string'?t:(t.name||t)).slice(0,5).join(' · ')}</div>`
      : '';
    return `<div class="msg-bubble ${cls}">${escapeHtml(m.text)}${attaches?`<div class="attach-preview">${attaches}</div>`:''}${tools}<div class="msg-meta">${m.ts}</div></div>`;
  }).join('');
  c.scrollTop = c.scrollHeight;
}

function chatRenderAttachments(){
  const wrap = $('chatAttachments');
  if(chatState.attachments.length === 0){
    wrap.classList.remove('has-items');
    wrap.innerHTML = '';
    return;
  }
  wrap.classList.add('has-items');
  wrap.innerHTML = chatState.attachments.map((a,i) => {
    const preview = a.type.startsWith('image/')
      ? `<img src="${escapeHtml(a.dataUrl)}">`
      : `<span>📄</span>`;
    return `${preview}<span style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(a.name)}</span><button data-rm="${i}" aria-label="Remover">×</button>`;
  }).map(html => `<div class="attach-chip">${html}</div>`).join('');
  wrap.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    chatState.attachments.splice(parseInt(b.dataset.rm),1);
    chatRenderAttachments();
  });
}

function chatSetStatus(text){
  const s = $('chatStatus');
  if(!text){ s.classList.remove('active'); return; }
  $('chatStatusText').textContent = text;
  s.classList.add('active');
}

async function fileToDataUrl(file){
  return new Promise((resolve,reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function chatSend(){
  if(chatState.busy) return;
  const text = $('chatInput').value.trim();
  if(!text && chatState.attachments.length === 0) return;

  // Adiciona mensagem do usuário
  const ts = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  chatState.msgs.push({
    role:'user', text, ts,
    attachments: chatState.attachments.map(a => ({name:a.name,type:a.type,dataUrl:a.dataUrl})),
  });
  chatRender();

  const filesParaEnviar = [...chatState.attachments];
  chatState.attachments = [];
  chatRenderAttachments();
  $('chatInput').value = '';
  $('chatInput').style.height = 'auto';

  // Status: processando
  chatState.busy = true;
  $('chatSend').disabled = true;
  unlockAudioPlayback(); // garante áudio destravado pra resposta com voz
  chatSetStatus('ZAYRA está pensando');

  try{
    const fd = new FormData();
    fd.append('message', text);
    if($('chatVoice').checked) fd.append('voice','true');
    if(chatState.sessionId) fd.append('session_id', chatState.sessionId);
    for(const a of filesParaEnviar) fd.append('files', a.file);

    chatSetStatus(filesParaEnviar.length > 0 ? `enviando ${filesParaEnviar.length} anexo(s)` : 'ZAYRA está pensando');

    const r = await fetch('/text', { method:'POST', body: fd, cache:'no-store' });
    const ctype = r.headers.get('content-type') || '';

    if(!r.ok){
      const txt = await r.text().catch(()=>'(sem corpo)');
      chatState.msgs.push({ role:'zayra', text:`❌ Erro ${r.status}: ${txt.slice(0,200)}`, ts: new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) });
      chatRender();
      return;
    }

    if(ctype.includes('audio')){
      // Resposta veio com áudio (voice=true)
      const respText = decodeURIComponent(r.headers.get('x-response-text')||r.headers.get('x-zayra-text')||'');
      const sessionId = r.headers.get('x-session-id');
      if(sessionId) chatState.sessionId = sessionId;
      const audioBlob = await r.blob();
      chatState.msgs.push({ role:'zayra', text: respText || '(resposta em áudio)', ts: new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) });
      chatRender();
      // Toca o áudio via Web Audio API (pra escapar de bloqueio iOS)
      try{
        if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
        if(audioCtx.state==='suspended') await audioCtx.resume();
        const arr = await audioBlob.arrayBuffer();
        const buf = await audioCtx.decodeAudioData(arr.slice(0));
        const src = audioCtx.createBufferSource();
        src.buffer = buf; src.connect(audioCtx.destination);
        src.start(0);
      }catch(e){ console.warn('[chat audio]', e.message); }
    } else {
      const data = await r.json();
      if(data.session_id) chatState.sessionId = data.session_id;
      chatState.msgs.push({
        role:'zayra',
        text: data.response || data.error || '(sem resposta)',
        tools: data.tools_used,
        ts: new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),
      });
      chatRender();
    }
  }catch(e){
    console.error('[chat send]', e);
    chatState.msgs.push({ role:'zayra', text:`❌ Falha: ${e.message}`, ts: new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) });
    chatRender();
  }finally{
    chatState.busy = false;
    $('chatSend').disabled = false;
    chatSetStatus(null);
  }
}

async function handleFiles(files){
  for(const f of Array.from(files)){
    if(f.size > 10*1024*1024){ alert(`Arquivo "${f.name}" maior que 10MB — ignorado.`); continue; }
    if(chatState.attachments.length >= 5){ alert('Máximo 5 anexos por mensagem.'); break; }
    const dataUrl = await fileToDataUrl(f);
    chatState.attachments.push({ file:f, dataUrl, name:f.name, type:f.type });
  }
  chatRenderAttachments();
}

// ── GRAVAÇÃO DE AUDIO NO CHAT (v1.36) ─────────────────────────────────────
const chatRec = { active:false, mediaRec:null, stream:null, chunks:[], startedAt:0, mime:'', timer:null };

async function chatStartRecording(){
  try{
    if(!navigator.mediaDevices?.getUserMedia) throw new Error('Mic API indisponível (precisa HTTPS)');
    if(typeof MediaRecorder==='undefined') throw new Error('MediaRecorder indisponível');
    chatRec.stream = await navigator.mediaDevices.getUserMedia({audio:true});
    let mime = '';
    if(MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mime='audio/webm;codecs=opus';
    else if(MediaRecorder.isTypeSupported('audio/webm')) mime='audio/webm';
    else if(MediaRecorder.isTypeSupported('audio/mp4')) mime='audio/mp4';
    else if(MediaRecorder.isTypeSupported('audio/aac')) mime='audio/aac';
    chatRec.mediaRec = mime ? new MediaRecorder(chatRec.stream,{mimeType:mime}) : new MediaRecorder(chatRec.stream);
    chatRec.mime = chatRec.mediaRec.mimeType || mime || 'audio/webm';
    chatRec.chunks = [];
    chatRec.mediaRec.ondataavailable = e => { if(e.data.size>0) chatRec.chunks.push(e.data); };
    chatRec.mediaRec.onstop = async () => {
      chatRec.stream?.getTracks().forEach(t => t.stop());
      const blob = new Blob(chatRec.chunks, { type: chatRec.mime });
      await chatSendAudio(blob, chatRec.mime);
    };
    chatRec.mediaRec.start();
    chatRec.active = true;
    chatRec.startedAt = Date.now();
    $('btnMicChat').classList.add('recording');
    $('btnMicChat').textContent = '⏹';
    $('chatRecInfo').classList.add('active');
    chatRec.timer = setInterval(() => {
      const sec = Math.floor((Date.now() - chatRec.startedAt) / 1000);
      $('chatRecTimer').textContent = sec + 's';
      if(sec >= 90){ chatStopRecording(); }   // hard cap 90s
    }, 250);
  }catch(e){
    console.error('[chatRec start]', e);
    alert('Não consegui ligar o microfone: ' + e.message);
    chatRec.active = false;
  }
}

function chatStopRecording(){
  if(!chatRec.active) return;
  chatRec.active = false;
  if(chatRec.timer){ clearInterval(chatRec.timer); chatRec.timer = null; }
  $('btnMicChat').classList.remove('recording');
  $('btnMicChat').textContent = '🎙';
  $('chatRecInfo').classList.remove('active');
  if(chatRec.mediaRec && chatRec.mediaRec.state === 'recording') chatRec.mediaRec.stop();
}

    }
  }catch(e){
    console.error('[chatSendAudio]', e);
    chatState.msgs.push({ role:'zayra', text:`❌ Falha: ${e.message}`, ts: new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) });
    chatRender();
  }finally{
    chatState.busy = false;
    $('chatSend').disabled = false;
    chatSetStatus(null);
  }
}

// Wire up — chat docked: header inteiro funciona como toggle abrir/fechar
document.body.classList.add('has-chat-bar');  // libera espaço pra barra do chat
const chatHeader = document.querySelector('.chat-header');
if(chatHeader){
  chatHeader.onclick = (e) => {
    if(e.target.closest('.close')){
      $('chatOverlay').classList.remove('open');
      return;
    }
    const wasOpen = $('chatOverlay').classList.contains('open');
    $('chatOverlay').classList.toggle('open');
    if(!wasOpen) setTimeout(() => $('chatInput').focus(), 250);
  };
}
$('chatClose').onclick = () => $('chatOverlay').classList.remove('open');
$('chatSend').onclick = chatSend;
$('chatInput').onkeydown = e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); chatSend(); }
};
$('chatInput').oninput = e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
};
$('btnAttach').onclick = () => $('fileInput').click();
$('btnCamera').onclick = () => $('cameraInput').click();
$('btnMicChat').onclick = () => {
  unlockAudioPlayback();
  if(chatRec.active) chatStopRecording(); else chatStartRecording();
};
$('fileInput').onchange = e => { handleFiles(e.target.files); e.target.value = ''; };
$('cameraInput').onchange = e => { handleFiles(e.target.files); e.target.value = ''; };

// Fecha modal clicando no overlay (não no modal)
$('chatOverlay').onclick = e => { if(e.target.id === 'chatOverlay') $('chatOverlay').classList.remove('open'); };

/* PWA — registra SW e força reload quando uma versão nova ativar */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('message', e=>{
    if(e.data&&e.data.type==='SW_UPDATED'){
      console.log('[ZAYRA] SW atualizado:',e.data.cache,'— recarregando');
      // Pequeno delay pra evitar loop em iOS
      setTimeout(()=>location.reload(),300);
    }
  });
}
</script>
