<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VTA — Canvas As-Built | ZAYRA</title>
<style>
  :root{
    --bg:#1a2332; --wall-fill:#2d5a27; --wall-stroke:#4a8f40; --door:#e8b84b; --window:#5ba4cf;
    --dim:#f0c040; --snap:#00ff88; --text:#fff; --sidebar:#0f1923; --topbar:#162030;
    --accent:#3a7d44; --panel-bg:#1e2d3d; --panel-border:#2d4a5a;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ width:100%; height:100%; overflow:hidden; background:var(--bg);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--text); }
  #app{ display:flex; flex-direction:column; height:100vh; }

  /* TOPBAR (48px) */
  #topbar{ height:48px; flex-shrink:0; display:flex; align-items:center; gap:6px; padding:0 8px;
    background:var(--topbar); border-bottom:1px solid rgba(255,255,255,.08); overflow-x:auto; white-space:nowrap; }
  #topbar button, #topbar select{ height:34px; border:1px solid rgba(255,255,255,.14); background:#1f2c3e; color:#fff;
    border-radius:7px; padding:0 9px; font-size:12.5px; cursor:pointer; flex:0 0 auto; }
  #topbar button:active{ transform:translateY(1px); }
  #topbar .grow{ flex:1 1 auto; min-width:6px; }
  #title-text{ font-size:13px; color:#a0c8a0; font-weight:600; flex:0 0 auto; }
  #vinculo-badge{ font-size:11px; color:#90ee90; background:rgba(26,77,26,.6); border:1px solid #2d5a2d; padding:2px 7px; border-radius:6px; flex:0 0 auto; }
  #topbar .sep{ width:1px; height:24px; background:rgba(255,255,255,.12); flex:0 0 auto; }
  #topbar .lab{ font-size:11px; opacity:.6; flex:0 0 auto; }
  #topbar .wa{ background:#1f7a46; border-color:#2aa45e; }
  #topbar .save{ background:var(--accent); border-color:#4a8f40; }
  #btn-ortho.on{ background:#1f7a46; border-color:#2aa45e; color:#aef5c8; font-weight:700; }
  #distInput{ display:none; position:fixed; background:#1e2d3d; border:1px solid #f0c040; border-radius:4px;
    padding:4px 8px; font:14px ui-monospace,monospace; color:#f0c040; z-index:200; pointer-events:none; }
  #wallEditPanel{ display:none; position:absolute; right:8px; top:8px; width:208px; background:#1e2d3d;
    border:1px solid #2d4a5a; border-radius:8px; padding:12px; z-index:150; color:#fff; font:13px sans-serif; box-shadow:0 8px 28px rgba(0,0,0,.5); }
  #wallEditPanel h4{ font-weight:bold; margin-bottom:10px; color:#4a8f40; font-size:13px; }
  #wallEditPanel label{ display:block; font-size:11px; opacity:.8; margin:6px 0 2px; }
  #wallEditPanel input, #wallEditPanel select{ width:100%; height:30px; background:#0f1923; border:1px solid #2d4a5a; color:#fff; padding:0 6px; border-radius:4px; font-size:13px; }
  #wallEditPanel .ln{ display:flex; gap:4px; } #wallEditPanel .ln input{ flex:1; }
  #wallEditPanel .ln button{ width:34px; background:#3a7d44; border:none; color:#fff; border-radius:4px; cursor:pointer; }
  #wallEditPanel .act{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  #wallEditPanel .act button{ height:32px; border:none; border-radius:4px; cursor:pointer; color:#fff; font-size:12.5px; }
  #wallEditPanel .act .b1{ background:#2d4a5a; } #wallEditPanel .act .bd{ background:#5a2d2d; } #wallEditPanel .act .bc{ background:transparent; border:1px solid #2d4a5a; color:#aaa; }

  /* WORKSPACE */
  #workspace{ display:flex; flex:1; overflow:hidden; }
  #toolbar{ width:72px; flex-shrink:0; background:var(--sidebar); display:flex; flex-direction:column;
    align-items:stretch; padding:6px 0; gap:3px; overflow-y:auto; }
  .tool-btn{ height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    cursor:pointer; color:#cdd6e0; border-left:3px solid transparent; background:none; user-select:none; font-size:18px; }
  .tool-btn .label{ font-size:8.5px; letter-spacing:.3px; }
  .tool-btn:hover{ background:rgba(255,255,255,.05); }
  .tool-btn.active{ background:var(--accent); border-left-color:#fff; color:#fff; }
  .tool-sep{ height:1px; background:rgba(255,255,255,.08); margin:3px 8px; }

  #canvas-wrap{ flex:1; position:relative; overflow:hidden; background:var(--bg); touch-action:none; cursor:crosshair; }
  #canvas-wrap.tool-pan{ cursor:grab; } #canvas-wrap.tool-pan.panning{ cursor:grabbing; }
  #canvas-wrap.tool-select{ cursor:default; } #canvas-wrap.tool-text{ cursor:text; } #canvas-wrap.tool-erase{ cursor:cell; } #canvas-wrap.tool-modify{ cursor:crosshair; }
  #main-canvas{ position:absolute; top:0; left:0; display:block; touch-action:none; }
  #zoom{ position:absolute; left:8px; bottom:8px; background:rgba(0,0,0,.5); color:#bcd; font-size:11px;
    padding:4px 8px; border-radius:6px; pointer-events:none; }

  /* TOAST / LOADING */
  #toast{ display:none; position:fixed; bottom:64px; left:50%; transform:translateX(-50%);
    background:rgba(10,50,10,.95); border:1px solid #3a8c3a; color:#98fb98; padding:8px 16px; border-radius:18px; font-size:12.5px; z-index:999; }
  #loading{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center;
    color:#90ee90; flex-direction:column; gap:12px; }
  #loading.visible{ display:flex; }
  .spinner{ width:32px; height:32px; border:3px solid rgba(90,180,90,.2); border-top-color:#3a8c3a; border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* PAINEL DE ABERTURA */
  #openingPanel{ display:none; position:absolute; z-index:200; background:var(--panel-bg); border:1px solid var(--panel-border);
    border-radius:8px; padding:12px; min-width:208px; box-shadow:0 8px 28px rgba(0,0,0,.5); }
  #openingPanel h4{ font-size:13px; color:var(--door); margin-bottom:8px; }
  #openingPanel label{ display:block; font-size:11px; opacity:.8; margin:7px 0 2px; }
  #openingPanel input, #openingPanel select{ width:100%; height:30px; background:#0e1a28; border:1px solid rgba(255,255,255,.15);
    color:#fff; border-radius:6px; padding:0 7px; font-size:13px; }
  #openingPanel .row{ display:flex; gap:8px; } #openingPanel .row>div{ flex:1; }
  #openingPanel .mini{ display:flex; gap:8px; margin-top:8px; }
  #openingPanel .mini button{ flex:1; height:30px; border:1px solid var(--panel-border); background:#16263a; color:#fff; border-radius:6px; cursor:pointer; font-size:12px; }
  #openingPanel .btns{ display:flex; gap:8px; margin-top:11px; }
  #openingPanel .btns button{ flex:1; height:32px; border:none; border-radius:7px; cursor:pointer; font-size:13px; color:#fff; }
  #openingPanel .ok{ background:var(--accent); } #openingPanel .cancel{ background:#3a4757; }

  /* TABELAS */
  #tablesOverlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.8); z-index:1000; align-items:center; justify-content:center; padding:16px; }
  #tablesBox{ background:#162030; border:1px solid rgba(255,255,255,.14); border-radius:12px; width:min(700px,100%); max-height:86vh; overflow:auto; padding:18px; }
  #tablesBox h3{ font-size:16px; margin-bottom:12px; }
  .ttabs{ display:flex; gap:6px; margin-bottom:10px; }
  .ttab{ height:32px; padding:0 12px; border:1px solid rgba(255,255,255,.16); background:#22344a; color:#fff; border-radius:7px; cursor:pointer; font-size:12.5px; }
  .ttab.active{ background:var(--accent); border-color:#4a8f40; }
  #tablesBody table{ width:100%; border-collapse:collapse; font-size:13px; }
  #tablesBody th, #tablesBody td{ border:1px solid rgba(255,255,255,.12); padding:6px 9px; text-align:left; }
  #tablesBody th{ background:#1f3148; } #tablesBody td.num{ text-align:center; }
  .tbl-actions{ display:flex; gap:8px; margin-top:12px; }
  .tbl-actions button{ height:32px; padding:0 12px; border:1px solid rgba(255,255,255,.16); background:#22344a; color:#fff; border-radius:7px; cursor:pointer; font-size:12.5px; }

  /* DIALOGS */
  dialog{ background:#171a21; color:#e8eaed; border:1px solid #2d5a2d; border-radius:12px; padding:18px; max-width:380px; width:92%; }
  dialog::backdrop{ background:rgba(0,0,0,.6); }
  dialog p.t{ margin:0 0 10px; font-weight:600; color:#90ee90; }
  dialog label{ display:block; font-size:12px; color:#8a93a6; margin-bottom:9px; }
  dialog input{ width:100%; padding:9px; border-radius:8px; border:1px solid #2a2f3a; background:#0c0e12; color:#e8eaed; font-size:14px; margin-top:3px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
  .dlg-actions{ display:flex; gap:8px; margin-top:10px; }
  .dlg-actions button{ flex:1; padding:9px; border-radius:8px; border:1px solid #2a2f3a; background:#1f2430; color:#e8eaed; font-size:13px; cursor:pointer; }
  .dlg-actions button.go{ background:#1a5c1a; border-color:#2d8c2d; color:#90ee90; font-weight:700; }

  @media (max-width:1023px){ #toolbar{ width:58px; } .tool-btn .label{ display:none; } #topbar{ gap:4px; } }
</style>
</head>
<body>
<div id="app">
  <!-- TOPBAR -->
  <div id="topbar">
    <button id="btn-voltar" title="Voltar">← Voltar</button>
    <button id="btn-edit" title="Editar" style="display:none">✎ Editar</button>
    <span id="title-text" contenteditable="true" title="Clique para nomear o croqui" style="outline:none;cursor:text;border-bottom:1px dashed rgba(255,255,255,.2)">Croqui As-Built</span>
    <span id="vinculo-badge" style="display:none"></span>
    <span class="sep"></span>
    <span class="lab">Esp.</span>
    <select id="sel-espessura" title="Espessura da parede (cm)">
      <option value="10">10</option><option value="12">12</option>
      <option value="15" selected>15</option><option value="20">20</option><option value="25">25</option>
    </select>
    <span class="lab">Escala</span>
    <select id="sel-escala" title="Escala">
      <option value="1:50">1:50</option><option value="1:100" selected>1:100</option>
      <option value="1:200">1:200</option><option value="1:500">1:500</option>
    </select>
    <button id="btn-zoom-out" title="Zoom -">🔍−</button>
    <button id="btn-zoom-in" title="Zoom +">🔍+</button>
    <button id="btn-ortho" title="Modo ortogonal (F8)">⊢ Orto</button>
    <span class="sep"></span>
    <button id="act-undo" title="Desfazer (Ctrl+Z)">↩</button>
    <button id="act-redo" title="Refazer (Ctrl+Shift+Z)">↪</button>
    <button id="act-clear" title="Limpar">🗑</button>
    <button id="act-png" title="Exportar PNG">📷 PNG</button>
    <button id="act-whats" class="wa" title="WhatsApp">WhatsApp</button>
    <button id="act-save" class="save" title="Salvar">💾 Salvar</button>
    <button id="act-prancha" title="Prancha A3">📐 Prancha</button>
    <button id="act-tables" title="Tabelas">📊 Tabelas</button>
    <span class="grow"></span>
  </div>

  <!-- WORKSPACE -->
  <div id="workspace">
    <div id="toolbar">
      <button class="tool-btn" data-tool="select" title="Selecionar">▢<span class="label">SELECT</span></button>
      <button class="tool-btn" data-tool="pan" title="Mover tela">✋<span class="label">PAN</span></button>
      <div class="tool-sep"></div>
      <button class="tool-btn active" data-tool="wall" title="Parede">▬<span class="label">PAREDE</span></button>
      <button class="tool-btn" data-tool="door" title="Porta">🚪<span class="label">PORTA</span></button>
      <button class="tool-btn" data-tool="window" title="Janela">⊞<span class="label">JANELA</span></button>
      <button class="tool-btn" data-tool="dim" title="Cota">↔<span class="label">COTA</span></button>
      <button class="tool-btn" data-tool="text" title="Texto">T<span class="label">TEXTO</span></button>
      <button class="tool-btn" data-tool="measure" title="Medir">📏<span class="label">MEDIDA</span></button>
      <button class="tool-btn" data-tool="north" title="Norte">N↑<span class="label">NORTE</span></button>
      <div class="tool-sep"></div>
      <button class="tool-btn" data-tool="erase" title="Apagar">⌫<span class="label">APAGAR</span></button>
      <div class="tool-sep"></div>
      <div style="font:9px sans-serif;color:#5a7a8a;text-align:center;letter-spacing:1px;padding:2px 0">MODIFICAR</div>
      <button class="tool-btn" data-tool="move" title="Mover">✥<span class="label">MOVER</span></button>
      <button class="tool-btn" data-tool="rotate" title="Rotacionar">↻<span class="label">ROTAR</span></button>
      <button class="tool-btn" data-tool="mirror" title="Espelhar">⇄<span class="label">ESPELHAR</span></button>
      <button class="tool-btn" data-tool="trim" title="Cortar">✂<span class="label">CORTAR</span></button>
      <button class="tool-btn" data-tool="extend" title="Unir/Estender">⊢<span class="label">UNIR</span></button>
      <button class="tool-btn" data-tool="fillet" title="Chanfro/Canto">⌐<span class="label">CHANFRO</span></button>
    </div>

    <div id="canvas-wrap" class="tool-wall">
      <canvas id="main-canvas"></canvas>
      <div id="zoom">100%</div>

      <!-- PAINEL DE ABERTURA (porta/janela) -->
      <div id="openingPanel">
        <h4 id="op-title">Inserir Porta</h4>
        <label>Código</label><input id="op-code" type="text" autocomplete="off">
        <div class="row">
          <div><label>Largura (cm)</label><input id="op-w" type="number" value="80"></div>
          <div><label>Altura (cm)</label><input id="op-h" type="number" value="210"></div>
        </div>
        <label>Tipo</label><select id="op-type"></select>
        <div id="op-swing-wrap"><label>Sentido</label><select id="op-swing"><option value="left">Esquerda</option><option value="right">Direita</option></select></div>
        <div class="mini"><button id="op-rotate" title="Rotacionar 180°">⟳ 180°</button><button id="op-flip" title="Espelhar">⇄ Espelhar</button></div>
        <div class="btns"><button class="cancel" id="op-cancel">Cancelar</button><button class="ok" id="op-ok">Inserir</button></div>
      </div>

      <!-- INPUT DE DISTÂNCIA (correção 2) -->
      <div id="distInput"><span id="distInputValue">0</span> cm</div>

      <!-- PAINEL DE EDIÇÃO DE PAREDE (correção 3) -->
      <div id="wallEditPanel">
        <h4>✎ Editar Parede</h4>
        <label>Comprimento (cm)</label>
        <div class="ln"><input id="wallLenInput" type="number" step="1" min="1"><button id="we-len-ok" title="Aplicar">✓</button></div>
        <label>Espessura (cm)</label>
        <select id="wallThickInput"><option>10</option><option>12</option><option selected>15</option><option>20</option><option>25</option></select>
        <label>Ângulo (°)</label>
        <div class="ln"><input id="wallAngleInput" type="number" step="0.1"><button id="we-angle-ok" title="Aplicar">✓</button></div>
        <div class="act">
          <button class="b1" id="we-rot">↻ Rotacionar 90°</button>
          <button class="b1" id="we-flip">⇄ Espelhar</button>
          <button class="bd" id="we-del">🗑 Excluir</button>
          <button class="bc" id="we-close">Fechar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="loading"><div class="spinner"></div><span>Aguarde...</span></div>

<!-- TABELAS -->
<div id="tablesOverlay">
  <div id="tablesBox">
    <h3>📊 Quadros — As-Built</h3>
    <div class="ttabs">
      <button class="ttab active" data-ttab="doors">Portas</button>
      <button class="ttab" data-ttab="windows">Janelas</button>
      <button class="ttab" data-ttab="rooms">Ambientes</button>
    </div>
    <div id="tablesBody"></div>
    <div class="tbl-actions">
      <button id="tbl-csv">Copiar CSV</button>
      <button id="tbl-tsv">Copiar TSV</button>
      <button id="tbl-close" style="margin-left:auto">Fechar</button>
    </div>
  </div>
</div>

<!-- DIALOG PRANCHA -->
<dialog id="dlg-prancha">
  <p class="t">📐 Gerar prancha técnica (carimbo Romatec)</p>
  <label>Título da obra<input id="p-titulo" placeholder="As-Built Residência"></label>
  <label>Proprietário<input id="p-prop" placeholder="Nome completo"></label>
  <label>Endereço<input id="p-end" placeholder="Quadra X, Lote Y"></label>
  <div class="row2"><label>Município<input id="p-mun" value="Açailândia, MA"></label><label>Tipo de obra<input id="p-tipo" placeholder="Residencial"></label></div>
  <div class="row2"><label>Prancha nº<input id="p-num" value="PR-001"></label><label>Revisão<input id="p-rev" value="R00"></label></div>
  <div class="dlg-actions"><button id="p-cancel">Cancelar</button><button class="go" id="p-gerar">Gerar</button></div>
</dialog>

<!-- DIALOG WHATSAPP -->
<dialog id="dlg-whats">
  <p class="t">Enviar croqui por WhatsApp</p>
  <label>Telefone (DDD+número)<input id="w-tel" placeholder="5599..."></label>
  <div class="dlg-actions"><button id="w-cancel">Cancelar</button><button class="go" id="w-enviar">Enviar</button></div>
</dialog>

<!-- CONFIG (lê da URL; sem EJS) -->
<script src="/js/vtaVinculo.js"></script>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var vinc = (window.VtaVinculo ? VtaVinculo.lerVinculo(location.search) : { laudo_id: null, proposta_id: null });
    var titulo = q.get('titulo'); var escala = q.get('escala') || '1:100';
    if (titulo) document.getElementById('title-text').textContent = titulo;
    var selE = document.getElementById('sel-escala'); if (selE && ['1:50','1:100','1:200','1:500'].indexOf(escala) >= 0) selE.value = escala;
    window.VTA_INIT = {
      canvasId: q.get('id') ? Number(q.get('id')) : null,
      laudoId: vinc.laudo_id, propostaId: vinc.proposta_id,
      titulo: titulo || 'Croqui As-Built', escala: escala,
      tipoPlanta: q.get('tipo_planta') || 'croqui',
      // v3.77.0: parâmetros do wizard de criação (tipo + dimensões + grade)
      modoDesenho: q.get('modo') === 'esboco' ? 'esboco' : 'escala',
      modoUso: q.get('uso') === 'campo' ? 'campo' : 'edificacao',
      unidade: q.get('un') === 'cm' ? 'cm' : 'm',
      gridCm: q.get('grid') ? Number(q.get('grid')) : null,
      envW: q.get('w') ? Number(q.get('w')) : null,
      envH: q.get('h') ? Number(q.get('h')) : null,
      apiBase: '/api/canvas',
    };
    // testes só com ?debug=1
    if (q.has('debug')) { var s = document.createElement('script'); s.src = '/vta-canvas-tests.js'; document.body.appendChild(s); }
  })();
</script>
<script src="/js/vtaCanvasV5.js"></script>
</body>
</html>
