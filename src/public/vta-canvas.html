<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VTA — Canvas Gráfico | Romatec</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/konva/9.3.16/konva.min.js"></script>
<style>
  :root{--bg:#0f1115;--elev:#171a21;--border:#2a2f3a;--text:#e8eaed;--muted:#8a93a6;--gold:#c8a84b;--green:#1a5c2a;--ok:#10b981}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  #top{position:fixed;top:0;left:0;right:0;height:48px;background:var(--green);display:flex;align-items:center;gap:8px;padding:0 12px;z-index:10}
  #top .logo{width:30px;height:30px;border-radius:50%;background:var(--green);border:2px solid var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
  #top b{font-size:14px}
  #top .esc{margin-left:auto;font-size:12px;color:#d9e8dd}
  #stageWrap{position:fixed;top:48px;bottom:0;left:0;right:0;background:#0c0e12}
  #tools{position:fixed;left:8px;top:56px;display:flex;flex-direction:column;gap:6px;z-index:9}
  .tool{width:42px;height:42px;border-radius:10px;border:1px solid var(--border);background:var(--elev);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .tool.on{background:var(--gold);color:#3a2c00;border-color:var(--gold)}
  #actions{position:fixed;right:8px;top:56px;display:flex;flex-direction:column;gap:6px;z-index:9}
  .act{padding:8px 10px;border-radius:9px;border:1px solid var(--border);background:var(--elev);color:var(--text);font-size:12px;cursor:pointer;white-space:nowrap}
  .act.ok{background:var(--ok);color:#04241a;font-weight:700;border:none}
  .act.gold{background:var(--gold);color:#3a2c00;font-weight:700;border:none}
  #zoom{position:fixed;left:8px;bottom:8px;background:rgba(0,0,0,.5);color:var(--muted);font-size:11px;padding:4px 8px;border-radius:6px;z-index:9}
  dialog{background:var(--elev);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:18px;max-width:360px;width:92%}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog label{display:block;font-size:12px;color:var(--muted);margin-bottom:9px}
  dialog input{width:100%;padding:9px;border-radius:8px;border:1px solid var(--border);background:#0c0e12;color:var(--text);font-size:14px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
</style>
</head>
<body>
<div id="top">
  <div class="logo">R</div><b>VTA — Canvas Gráfico</b>
  <span class="esc" id="escala">1:500 · As-Built</span>
</div>
<div id="stageWrap"></div>
<div id="tools">
  <button class="tool on" data-t="select" title="Selecionar/mover">⬚</button>
  <button class="tool" data-t="pan" title="Mover tela">✋</button>
  <button class="tool" data-t="linha" title="Linha">╱</button>
  <button class="tool" data-t="seta" title="Seta de caimento d'água">➜</button>
  <button class="tool" data-t="cota" title="Cota">↔</button>
  <button class="tool" data-t="retangulo" title="Retângulo">▭</button>
  <button class="tool" data-t="circulo" title="Círculo">◯</button>
  <button class="tool" data-t="texto" title="Texto">T</button>
  <button class="tool" data-t="norte" title="Norte">N↑</button>
  <button class="tool" data-t="undo" title="Desfazer">↩</button>
</div>
<div id="actions">
  <button class="act" id="aSalvar">💾 Salvar</button>
  <button class="act gold" id="aPng">🖼 PNG</button>
  <button class="act ok" id="aWhats">WhatsApp</button>
  <button class="act" id="aPrancha">📐 Prancha</button>
</div>
<div id="zoom">100%</div>

<dialog id="dlgPrancha">
  <p style="margin:0 0 10px;font-weight:600">Gerar prancha técnica (carimbo automático)</p>
  <label>Título da obra<input id="pTitulo" placeholder="As-Built Residência"></label>
  <label>Proprietário<input id="pProp" placeholder="Nome completo"></label>
  <label>Endereço<input id="pEnd" placeholder="Quadra X, Lote Y"></label>
  <div class="row2"><label>Município<input id="pMun" value="Açailândia, MA"></label><label>Tipo de obra<input id="pTipo" placeholder="Residencial"></label></div>
  <div class="row2"><label>Prancha nº<input id="pNum" value="PR-001"></label><label>Revisão<input id="pRev" value="R00"></label></div>
  <div style="display:flex;gap:8px;margin-top:10px"><button class="act" id="pCancel" style="flex:1">Cancelar</button><button class="act gold" id="pGerar" style="flex:1">Gerar</button></div>
  <div id="pMsg" style="font-size:12px;margin-top:8px"></div>
</dialog>
<dialog id="dlgWhats">
  <p style="margin:0 0 10px;font-weight:600">Enviar croqui por WhatsApp</p>
  <label>Telefone (DDD+número)<input id="wTel" placeholder="5599..."></label>
  <div style="display:flex;gap:8px;margin-top:10px"><button class="act" id="wCancel" style="flex:1">Cancelar</button><button class="act ok" id="wEnviar" style="flex:1">Enviar</button></div>
  <div id="wMsg" style="font-size:12px;margin-top:8px"></div>
</dialog>

<script>
(function(){
  'use strict';
  var API='/api/canvas';
  var canvasId=null, tool='select', undoStack=[];
  var VW=2000, VH=2000;
  function api(path,opts){opts=opts||{};opts.credentials='include';return fetch(API+path,opts).then(function(r){if(r.status===401){location.href='/login';throw new Error('nao autenticado');}return r.json().then(function(j){if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j;});});}

  var wrap=document.getElementById('stageWrap');
  var stage=new Konva.Stage({container:'stageWrap',width:wrap.clientWidth,height:wrap.clientHeight,draggable:false});
  var gridLayer=new Konva.Layer({listening:false});
  var layer=new Konva.Layer();
  stage.add(gridLayer);stage.add(layer);

  function drawGrid(){
    gridLayer.destroyChildren();
    var s=stage.scaleX(), pos=stage.position();
    var step=50*s;
    if(step<8)step*=5; // evita grid denso demais
    var w=stage.width(), h=stage.height();
    var startX=((pos.x%step)+step)%step, startY=((pos.y%step)+step)%step;
    for(var x=startX;x<w;x+=step){gridLayer.add(new Konva.Line({points:[x,0,x,h],stroke:'#2c3650',strokeWidth:1}));}
    for(var y=startY;y<h;y+=step){gridLayer.add(new Konva.Line({points:[0,y,w,y],stroke:'#2c3650',strokeWidth:1}));}
    // eixos principais (origem virtual)
    gridLayer.add(new Konva.Line({points:[pos.x,0,pos.x,h],stroke:'#46557a',strokeWidth:1.5}));
    gridLayer.add(new Konva.Line({points:[0,pos.y,w,pos.y],stroke:'#46557a',strokeWidth:1.5}));
    gridLayer.batchDraw();
  }
  function updZoom(){document.getElementById('zoom').textContent=Math.round(stage.scaleX()*100)+'%';}

  // ZOOM
  stage.on('wheel',function(e){
    e.evt.preventDefault();
    var old=stage.scaleX(), pointer=stage.getPointerPosition();
    var mp={x:(pointer.x-stage.x())/old,y:(pointer.y-stage.y())/old};
    var dir=e.evt.deltaY>0?-1:1;
    var ns=dir>0?old*1.1:old/1.1;
    ns=Math.max(0.05,Math.min(20,ns));
    stage.scale({x:ns,y:ns});
    stage.position({x:pointer.x-mp.x*ns,y:pointer.y-mp.y*ns});
    drawGrid();updZoom();
  });
  stage.on('dragmove',drawGrid);

  function relPos(){return stage.getRelativePointerPosition();}
  function pushUndo(node){undoStack.push(node);}

  var drawing=null, startP=null;
  stage.on('mousedown touchstart',function(e){
    if(tool==='select'||tool==='pan')return;
    if(tool==='undo')return;
    var p=relPos();startP=p;
    if(tool==='linha'){drawing=new Konva.Line({points:[p.x,p.y,p.x,p.y],stroke:'#e8eaed',strokeWidth:2/stage.scaleX()});layer.add(drawing);}
    else if(tool==='seta'){drawing=new Konva.Arrow({points:[p.x,p.y,p.x,p.y],stroke:'#4aa3ff',fill:'#4aa3ff',strokeWidth:2.5/stage.scaleX(),pointerLength:12/stage.scaleX(),pointerWidth:10/stage.scaleX()});layer.add(drawing);}
    else if(tool==='cota'){drawing=new Konva.Line({points:[p.x,p.y,p.x,p.y],stroke:'#c8a84b',strokeWidth:1.5/stage.scaleX(),dash:[6,4]});layer.add(drawing);}
    else if(tool==='retangulo'){drawing=new Konva.Rect({x:p.x,y:p.y,width:0,height:0,stroke:'#e8eaed',strokeWidth:2/stage.scaleX()});layer.add(drawing);}
    else if(tool==='circulo'){drawing=new Konva.Circle({x:p.x,y:p.y,radius:0,stroke:'#e8eaed',strokeWidth:2/stage.scaleX()});layer.add(drawing);}
    else if(tool==='texto'){var t=prompt('Texto / nome de rua:');if(t){var tx=new Konva.Text({x:p.x,y:p.y,text:t,fontSize:18/stage.scaleX(),fill:'#e8eaed',draggable:true});layer.add(tx);pushUndo(tx);layer.draw();}startP=null;}
    else if(tool==='norte'){var g=desenharNorte(p.x,p.y,60/stage.scaleX());layer.add(g);pushUndo(g);layer.draw();startP=null;}
  });
  stage.on('mousemove touchmove',function(){
    if(!drawing||!startP)return;
    var p=relPos();
    if(tool==='linha'||tool==='seta'||tool==='cota'){drawing.points([startP.x,startP.y,p.x,p.y]);
      if(tool==='cota'){atualizarCota(drawing,startP,p);}}
    else if(tool==='retangulo'){drawing.width(p.x-startP.x);drawing.height(p.y-startP.y);}
    else if(tool==='circulo'){drawing.radius(Math.hypot(p.x-startP.x,p.y-startP.y));}
    layer.batchDraw();
  });
  stage.on('mouseup touchend',function(){
    if(drawing){pushUndo(drawing);drawing=null;startP=null;}
  });

  var cotaLabels={};
  function atualizarCota(line,a,b){
    var d=Math.hypot(b.x-a.x,b.y-a.y);
    var id=line._id;
    if(!cotaLabels[id]){cotaLabels[id]=new Konva.Text({fill:'#c8a84b',fontSize:14/stage.scaleX(),fontStyle:'bold'});layer.add(cotaLabels[id]);line.cotaLabelId=id;}
    var lbl=cotaLabels[id];
    lbl.fontSize(14/stage.scaleX());
    lbl.text((d/100).toFixed(2)+' m'); // 100 px virtuais = 1 m (ajustável)
    lbl.position({x:(a.x+b.x)/2,y:(a.y+b.y)/2-18/stage.scaleX()});
  }
  function desenharNorte(x,y,s){
    var g=new Konva.Group({x:x,y:y,draggable:true});
    g.add(new Konva.Circle({radius:s/2,stroke:'#c8a84b',strokeWidth:1.5/stage.scaleX()}));
    g.add(new Konva.Arrow({points:[0,s/2,0,-s/2],stroke:'#c8a84b',fill:'#c8a84b',strokeWidth:2/stage.scaleX(),pointerLength:s*0.22,pointerWidth:s*0.18}));
    g.add(new Konva.Text({x:-s*0.12,y:-s*0.78,text:'N',fontSize:s*0.4,fontStyle:'bold',fill:'#c8a84b'}));
    return g;
  }

  // TOOLBAR
  document.querySelectorAll('.tool').forEach(function(b){
    b.onclick=function(){
      var t=b.getAttribute('data-t');
      if(t==='undo'){var n=undoStack.pop();if(n){if(n.cotaLabelId&&cotaLabels[n.cotaLabelId]){cotaLabels[n.cotaLabelId].destroy();delete cotaLabels[n.cotaLabelId];}n.destroy();layer.draw();}return;}
      tool=t;
      document.querySelectorAll('.tool').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');
      stage.draggable(t==='pan');
      layer.getChildren().forEach(function(node){node.draggable(t==='select');});
    };
  });

  function exportarPNG(){
    var prev=stage.scaleX(), prevPos=stage.position();
    // exporta em pixelRatio bom
    return stage.toDataURL({pixelRatio:Math.max(2,1240/stage.width()),mimeType:'image/png'});
  }
  function conteudoSvgImagem(){
    var png=exportarPNG();
    return '<image href="'+png+'" x="0" y="0" width="'+VW+'" height="'+VH+'" preserveAspectRatio="xMidYMid meet"/>';
  }

  function garantirCanvas(){
    if(canvasId)return Promise.resolve(canvasId);
    return api('',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tipo:'croqui',titulo:'Croqui VTA',largura_virtual:VW,altura_virtual:VH})}).then(function(j){canvasId=j.id;return canvasId;});
  }

  document.getElementById('aSalvar').onclick=function(){
    garantirCanvas().then(function(id){
      return api('/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({dados_svg:conteudoSvgImagem(),dados_json:JSON.parse(stage.toJSON())})});
    }).then(function(){alert('Croqui salvo.');}).catch(function(e){alert('Falha: '+e.message);});
  };
  document.getElementById('aPng').onclick=function(){
    var a=document.createElement('a');a.href=exportarPNG();a.download='croqui-romatec.png';a.click();
  };
  document.getElementById('aWhats').onclick=function(){document.getElementById('dlgWhats').showModal();};
  document.getElementById('wCancel').onclick=function(){document.getElementById('dlgWhats').close();};
  document.getElementById('wEnviar').onclick=function(){
    var tel=document.getElementById('wTel').value.trim();if(!tel){document.getElementById('wMsg').textContent='Informe o telefone.';return;}
    document.getElementById('wMsg').textContent='Enviando...';
    garantirCanvas().then(function(id){
      return api('/'+id+'/exportar-whatsapp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telefone:tel,imagemBase64:exportarPNG(),legenda:'Croqui - Romatec Consultoria Total'})});
    }).then(function(){document.getElementById('wMsg').innerHTML='<span style="color:#10b981">✓ Enviado.</span>';}).catch(function(e){document.getElementById('wMsg').innerHTML='<span style="color:#dc2626">'+e.message+'</span>';});
  };
  document.getElementById('aPrancha').onclick=function(){document.getElementById('dlgPrancha').showModal();};
  document.getElementById('pCancel').onclick=function(){document.getElementById('dlgPrancha').close();};
  document.getElementById('pGerar').onclick=function(){
    document.getElementById('pMsg').textContent='Gerando...';
    garantirCanvas().then(function(id){
      // salva o conteudo antes de gerar a prancha
      return api('/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({dados_svg:conteudoSvgImagem()})}).then(function(){
        return api('/'+id+'/prancha',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
          tituloObra:document.getElementById('pTitulo').value,proprietario:document.getElementById('pProp').value,
          endereco:document.getElementById('pEnd').value,municipio:document.getElementById('pMun').value,
          tipoObra:document.getElementById('pTipo').value,numeroPrancha:document.getElementById('pNum').value,
          revisao:document.getElementById('pRev').value,escala:'1:500'})});
      });
    }).then(function(j){
      var w=window.open('','_blank');w.document.write(j.svg);w.document.close();
      document.getElementById('pMsg').innerHTML='<span style="color:#10b981">✓ Prancha #'+j.pranchaId+' gerada (abriu em nova aba).</span>';
    }).catch(function(e){document.getElementById('pMsg').innerHTML='<span style="color:#dc2626">'+e.message+'</span>';});
  };

  window.addEventListener('resize',function(){stage.width(wrap.clientWidth);stage.height(wrap.clientHeight);drawGrid();});
  // centraliza origem
  stage.position({x:wrap.clientWidth/2,y:wrap.clientHeight/2});
  drawGrid();updZoom();
})();
</script>
</body>
</html>
