  box.innerHTML = `<div class="row" style="justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="flex:1 1 auto;margin:0;border:0">🏷 Capas do dossiê técnico do lote</h2>
      ${comAssoc.length ? `<button class="btn btn-gold btn-sm" id="capasZip" style="flex:0 0 auto">📦 Baixar todas (ZIP · ${comAssoc.length})</button>` : ''}</div>
    <div class="muted" style="margin:6px 0 10px">Capa padrão aprovada (modelo LT-05): associado, nº e lote da vila, denominação, área em ha e alqueires (48.400 m²), associação e data. Sem área cadastrada sai “a definir após o georreferenciamento”. A mesma capa abre o dossiê completo.</div>
    ${ls.length ? `<div class="tbl"><table class="tcard"><thead><tr><th>Lote</th><th>Associado</th><th>Denominação</th><th class="right">Área</th><th>Medição</th><th>Capa</th><th></th></tr></thead><tbody>
      ${ls.map((l) => `<tr><td class="tc-tit"><b>${esc(l.codigo)}</b>${l.lote_vila ? ` <span class="muted">· vila ${esc(l.lote_vila)}</span>` : ''}</td>
        <td data-l="Associado">${l.associado_nome ? esc(l.associado_nome) + `<div class="muted">${esc(l.associado_numero || '')}</div>` : '<span class="muted">sem associado</span>'}</td>
        <td data-l="Denominação">${l.denominacao ? '“' + esc(l.denominacao) + '”' : '—'}</td>
        <td class="right nowrap" data-l="Área">${l.area_ha ? ha(l.area_ha) + ' ha' + `<div class="muted">${l.area_origem === 'CAMPO' ? 'da medição' : 'cadastrada'}</div>` : '<span class="muted">a definir</span>'}</td>
        <td data-l="Medição">${esc(ST_MEDICAO[l.status_medicao] || l.status_medicao)}</td>
        <td data-l="Capa">${l.capa_versao ? `v${l.capa_versao}<div class="muted">${esc(dhBr(l.capa_em))}</div>` : '<span class="muted">não arquivada</span>'}</td>
        <td class="bol-acoes">${l.associado_id ? `<button class="btn btn-ghost btn-sm" data-cpver="${esc(l.codigo)}">👁 Capa</button>
          ${podeEscrever() ? `<button class="btn btn-primary btn-sm" data-cpger="${l.id}" title="Gera e guarda nos documentos do associado (nova versão)">💾 Arquivar</button>` : ''}` : ''}
          ${podeEscrever() ? `<button class="btn btn-ghost btn-sm" data-cped="${esc(l.codigo)}">✏️ Editar</button>` : ''}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty">Nenhum lote de produção ainda. Eles aparecem quando o lote é ligado ao associado na subdivisão ou medido em campo.</div>'}`;
  box.querySelectorAll('[data-cpver]').forEach((b) => b.onclick = () => abrirPdf(`/projetos/${S.pid}/lotes-producao/${encodeURIComponent(b.dataset.cpver)}/capa.pdf`));
  box.querySelectorAll('[data-cpger]').forEach((b) => b.onclick = async () => {
    b.disabled = true; toast('Gerando a capa…');
    try { const r = await api(`/lotes-producao/${b.dataset.cpger}/gerar/capa`, { json: {} }); toast(`Capa do ${r.codigo} arquivada (v${r.versao}) ✅`); rCapasDossie(); }
    catch (e){ toast(e.message, true); b.disabled = false; }
  });
  box.querySelectorAll('[data-cped]').forEach((b) => b.onclick = async () => {
    const l = ls.find((x) => x.codigo === b.dataset.cped); if (!l) return;
    const den = prompt(`${l.codigo} — denominação da terra (ex.: Chácara Nosso Lar).\nDeixe vazio para "—":`, l.denominacao || ''); if (den === null) return;
    const ar = prompt(`${l.codigo} — área oficial em hectares (ex.: 36 ou 36,0000).\nDeixe vazio para usar a área da medição${l.area_origem === 'CAMPO' ? ' (' + ha(l.area_ha) + ' ha)' : ''} ou "a definir":`, l.area_origem === 'CADASTRO' ? String(l.area_ha).replace('.', ',') : ''); if (ar === null) return;
    const area = ar.trim() ? Number(ar.trim().replace(/\./g, '').replace(',', '.')) : null;
    if (ar.trim() && !(area > 0)) { toast('Área inválida', true); return; }
    try { await api(`/projetos/${S.pid}/lotes-producao/${encodeURIComponent(l.codigo)}`, { method: 'PATCH', json: { denominacao: den, area_ha: area } }); toast(`${l.codigo} atualizado ✅`); rCapasDossie(); }
    catch (e){ toast(e.message, true); }
  });
  const z = $('#capasZip');
  if (z) z.onclick = async () => {
    z.disabled = true; toast(`Gerando ${comAssoc.length} capa(s)… pode levar alguns segundos.`);
    try {
      const r = await api(`/projetos/${S.pid}/gerar/capas-dossie`, { json: {} });
      const url = URL.createObjectURL(await r.blob());
      const a = document.createElement('a'); a.href = url; a.download = 'Capas_Dossie_Salete_Moreno.zip'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    } catch (e){ toast(e.message, true); }
    z.disabled = false;
  };
}

// ─── Importar / exportar ────────────────────────────────────────────────
function rImportar(){
  const v = $('#v-importar');
  // v3.173.0: arquivos da coletora e caderneta liberados para todos os usuários do PA (ADMIN vê a página completa)
  if (S.eu && S.eu.perfil !== 'ADMIN'){
    v.innerHTML = `<div class="card"><h2>📡 Arquivos para a coletora e caderneta de campo</h2><p class="muted">Marcos oficiais do PA em UTM SIRGAS 2000. Carregue na coletora; a caderneta traz os marcos por lote.</p>
      <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn btn-primary" data-col="csv" style="flex:0 0 auto">⬇️ CSV</button><button class="btn btn-ghost" data-col="txt" style="flex:0 0 auto">⬇️ TXT (P,E,N,Z,D)</button><button class="btn btn-ghost" data-col="dxf" style="flex:0 0 auto">⬇️ DXF</button><button class="btn btn-ghost" data-col="kml" style="flex:0 0 auto">⬇️ KML</button><button class="btn btn-gold" id="colCad" style="flex:0 0 auto">📒 Caderneta de campo (PDF)</button></div></div>`;
    v.querySelectorAll('[data-col]').forEach((b) => b.onclick = () => baixar(`/projetos/${S.pid}/coletora.${b.dataset.col}`, `PONTOS-COLETORA.${b.dataset.col}`).catch((e) => toast(e.message, true)));
    $('#colCad').onclick = () => abrirPdf(`/projetos/${S.pid}/caderneta-campo.pdf`);
    return;
  }
  v.innerHTML = `<div class="card"><h2>Importar seed + acervo</h2>
      <p class="muted">Idempotente: pode reenviar o mesmo seed quantas vezes quiser — só entra o que falta e o que foi editado na tela é mantido. O acervo (ZIP com as pastas LOTE-XX-Nome/) é opcional e pode vir depois.</p>
      <div class="grid2"><div><label for="iSeed">Seed (JSON)</label><input type="file" id="iSeed" accept=".json,application/json"></div>
        <div><label for="iAcervo">Acervo digital (ZIP, opcional)</label><input type="file" id="iAcervo" accept=".zip,application/zip"></div></div>
      <div class="row" style="margin-top:10px"><button class="btn btn-primary" id="iBtn" style="flex:0 0 auto">📥 Importar</button><span class="muted" id="iProg"></span></div>
      <div id="iRel"></div></div>
    ${S.pid ? `<div class="card"><h2>${ICO_MARCO} Planilha oficial de marcos</h2><p class="muted">QUANTITATIVO-MARCOS-POR-LOTE (.xlsx), aba "Coordenadas dos Marcos". Os códigos M-001… passam a valer na coletora, na caderneta e no mapa de campo; marcos do perímetro marcados "NÃO comprar" aparecem como já existentes.</p>
      <div class="row" style="gap:8px;align-items:end"><div style="flex:1 1 260px"><input type="file" id="mkPlan" accept=".xlsx,.xls"></div><button class="btn btn-primary" id="mkPlanBtn" style="flex:0 0 auto">⬆️ Enviar planilha</button></div></div>` : ''}
    ${S.pid ? `<div class="card"><h2>📡 Pontos para a coletora (locação dos marcos)</h2><p class="muted">Todos os vértices dos lotes, do perímetro e da vila, sem repetir ponto (vértice comum a dois lotes sai uma vez). Coordenadas UTM SIRGAS 2000. Carregue na coletora e use na locação/cravação dos marcos; a caderneta de campo traz os pontos por lote, com caixa para marcar o que foi cravado.</p>
      <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn btn-primary" data-col="csv" style="flex:0 0 auto">⬇️ CSV (Nome, E, N, Cota, Código)</button><button class="btn btn-ghost" data-col="txt" style="flex:0 0 auto">⬇️ TXT (P,E,N,Z,D)</button><button class="btn btn-ghost" data-col="dxf" style="flex:0 0 auto">⬇️ DXF (pontos + lotes)</button><button class="btn btn-ghost" data-col="kml" style="flex:0 0 auto">⬇️ KML (Google Earth — marcos + lotes)</button><button class="btn btn-gold" id="colCad" style="flex:0 0 auto">📒 Caderneta de campo (PDF)</button></div></div>` : ''}
    ${S.pid ? `<div class="card"><h2>Exportar acervo</h2><p class="muted">ZIP com a estrutura LOTE-XX-Nome/ de todos os documentos carregados. Fica registrado em eventos (LGPD).</p>
      <button class="btn btn-ghost" id="eBtn">⬇️ Baixar ZIP do acervo</button></div>` : ''}`;
  $('#iBtn').onclick = () => {
    const seed = $('#iSeed').files[0];
    if (!seed) return toast('Escolha o seed JSON', true);
    const fd = new FormData(); fd.append('seed', seed); if ($('#iAcervo').files[0]) fd.append('acervo', $('#iAcervo').files[0]);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/pa/importar'); xhr.withCredentials = true;
    xhr.upload.onprogress = (e) => { if (e.lengthComputable) $('#iProg').textContent = `Enviando ${Math.round(e.loaded / e.total * 100)}%…`; };
    xhr.upload.onload = () => { $('#iProg').textContent = 'Processando no servidor (pode levar alguns minutos com o acervo)…'; };
    xhr.onload = () => {
      $('#iBtn').disabled = false;
      if (xhr.status === 401){ location.href = '/login?next=' + encodeURIComponent(location.pathname); return; }
      let j = null; try { j = JSON.parse(xhr.responseText); } catch { /* resposta não-JSON */ }
      if (xhr.status >= 300 || !j){ $('#iProg').textContent = ''; return toast((j && j.erro) || ('Falha HTTP ' + xhr.status), true); }
      const r = j.relatorio;
      $('#iProg').textContent = 'Concluído ✓';
      $('#iRel').innerHTML = `<div class="avisos"><b>Banco agora:</b> ${j.contagem.lotes} lotes · ${j.contagem.associados} associados · ${j.contagem.documentos} documentos (${j.contagem.documentos_com_arquivo} com arquivo)<br>
        <b>Inseridos:</b> ${esc(JSON.stringify(r.inseridos))}<br><b>Atualizados:</b> ${esc(JSON.stringify(r.atualizados))}<br><b>Arquivos:</b> ${esc(JSON.stringify(r.arquivos))}</div>
        ${r.erros.length ? `<h3 style="color:var(--red)">Erros (${r.erros.length})</h3><ul class="avisos">${r.erros.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
        ${avisosHtml(r.avisos)}`;
      api('/projetos').then(({ projetos }) => { S.projetos = projetos; const sel = $('#selProjeto'); sel.innerHTML = projetos.map((p) => `<option value="${p.id}">${esc(p.nome)}</option>`).join(''); S.pid = r.projeto_id; sel.value = String(S.pid); S.painel = S.lotes = S.assoc = null; });
    };
    xhr.onerror = () => { $('#iBtn').disabled = false; $('#iProg').textContent = ''; toast('Falha de rede no envio', true); };
    $('#iBtn').disabled = true; xhr.send(fd);
  };
  v.querySelectorAll('[data-col]').forEach((b) => b.onclick = () => baixar(`/projetos/${S.pid}/coletora.${b.dataset.col}`, `PONTOS-COLETORA.${b.dataset.col}`).catch((e) => toast(e.message, true)));
  if ($('#colCad')) $('#colCad').onclick = () => abrirPdf(`/projetos/${S.pid}/caderneta-campo.pdf`);
  if ($('#mkPlanBtn')) $('#mkPlanBtn').onclick = async () => {
    const f = $('#mkPlan').files[0]; if (!f) return toast('Escolha a planilha', true);
    const fd = new FormData(); fd.append('arquivo', f);
    try { const r = await api(`/projetos/${S.pid}/marcos-planilha`, { method: 'POST', body: fd }); toast(`Planilha carregada: ${r.marcos} marcos (${r.a_implantar} a cravar, ${r.existentes} já existentes)`); S.campo = null; }
    catch (e){ toast(e.message, true); }
  };
  if ($('#eBtn')) $('#eBtn').onclick = () => { toast('Gerando ZIP…'); baixar(`/projetos/${S.pid}/export`, 'ACERVO.zip').catch((e) => toast(e.message, true)); };
}

boot();
})();
</script>
<div id="pwaBanner" class="pwa-ban hide" role="dialog" aria-label="Instalar o app">
  <img src="/icons/pa-192.png" alt="">
  <div class="pwa-txt"><b>Instale o app Romatec PA</b><span id="pwaMsg">Fica o ícone na tela do celular e abre direto, sem navegador.</span></div>
  <div class="pwa-bts"><button class="btn btn-gold btn-sm" id="pwaSim">📲 Instalar</button><button class="btn btn-ghost btn-sm" id="pwaNao">Agora não</button></div>
</div>
<script>
// v3.175.0: PWA do PA — service worker + pop-up de instalação (Android/Chrome nativo; iPhone e
// navegadores sem o pop-up nativo recebem o passo a passo). Não aparece se já estiver instalado.
(() => {
  const instalado = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  const ua = navigator.userAgent || '';
  const ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const android = /android/i.test(ua);
  const inApp = /FBAN|FBAV|Instagram|WhatsApp|; wv\)/i.test(ua); // navegador embutido (WhatsApp etc.) não instala
  const iosSafari = ios && /safari/i.test(ua) && !/crios|fxios|edgios/i.test(ua);
  const ban = document.getElementById('pwaBanner'), msg = document.getElementById('pwaMsg'), sim = document.getElementById('pwaSim'), btn = document.getElementById('btnInstalar');
  let evento = null;
  const CHAVE = 'pa_pwa_adiado';
  const adiado = () => { try { return Number(localStorage.getItem(CHAVE) || 0) > Date.now(); } catch { return false; } };
  const adiar = (dias) => { try { localStorage.setItem(CHAVE, String(Date.now() + dias * 864e5)); } catch { /* ok */ } };
  const passo = () => {
    if (inApp) return 'Abra este link no <b>Chrome</b> (⋮ → <b>Abrir no navegador</b>) para instalar o app.';
    if (ios && !iosSafari) return 'No iPhone, abra este endereço no <b>Safari</b> e toque em <b>Compartilhar ⬆️</b> → <b>Adicionar à Tela de Início</b>.';
    if (ios) return 'Toque em <b>Compartilhar ⬆️</b> (barra de baixo) → <b>Adicionar à Tela de Início</b> → <b>Adicionar</b>.';
    if (android) return 'No Chrome, toque no menu <b>⋮</b> (canto de cima) → <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.';
    return 'No navegador, use o ícone de instalar na barra de endereço ou o menu → <b>Instalar app</b>.';
  };
  const mostrar = (forcar) => {
    if (instalado() || (!forcar && adiado())) return;
    msg.innerHTML = evento ? 'Fica o ícone na tela do celular e abre direto, sem navegador.' : passo();
    sim.textContent = evento ? '📲 Instalar' : 'Entendi';
    ban.classList.remove('hide');
  };
  if (instalado()) return;
  if (ios || android || matchMedia('(pointer:coarse)').matches) btn.classList.remove('hide');
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); evento = e; btn.classList.remove('hide'); mostrar(false); });
  window.addEventListener('appinstalled', () => { ban.classList.add('hide'); btn.classList.add('hide'); evento = null; toast('✅ App instalado — procure o ícone Romatec PA na tela do celular'); });
  sim.onclick = async () => {
    if (!evento) { ban.classList.add('hide'); adiar(1); return; }
    evento.prompt();
    const r = await evento.userChoice.catch(() => ({ outcome: 'dismissed' }));
    evento = null; ban.classList.add('hide');
    if (r.outcome !== 'accepted') adiar(2);
  };
  document.getElementById('pwaNao').onclick = () => { ban.classList.add('hide'); adiar(3); };
  btn.onclick = () => (evento ? sim.onclick() : mostrar(true));
  // iPhone e navegadores sem o pop-up nativo: mostra o passo a passo depois de entrar
  setTimeout(() => { if (!evento && (ios || android)) mostrar(false); }, 4000);
})();
</script>
