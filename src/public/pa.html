<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão de PA — Romatec</title>
<!-- v3.175.0: PWA — instala no celular (Android: pop-up de instalação; iPhone: Compartilhar → Tela de Início) -->
<link rel="manifest" href="/manifest-pa.webmanifest">
<meta name="theme-color" content="#0C3320">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Romatec PA">
<link rel="apple-touch-icon" href="/icons/pa-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/pa-192.png">
<!-- v3.142.0 — Módulo Gestão de PA / Loteamentos. Identidade do manual do PA:
     #0C3320 (verde), #C9A84C (ouro), #B3261E (alerta), #FFF4DC (creme). -->
<style>
  :root{
    --green:#0C3320;--green2:#14472B;--gold:#C9A84C;--gold-soft:#E3D19A;--red:#B3261E;--cream:#FFF4DC;
    --paper:#f4f1e8;--ink:#1C1C18;--muted:#6A6656;--line:#DCD5C2;--ok:#1f7a4d;--warn:#a07a10;--blue:#2b5f8a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Liberation Sans',Arial,Helvetica,sans-serif;background:var(--paper);color:var(--ink);-webkit-text-size-adjust:100%}
  header{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;padding:14px 18px 0;position:sticky;top:0;z-index:20}
  header .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  header .kick{color:var(--gold-soft);letter-spacing:2px;text-transform:uppercase;font-size:10px;margin:0}
  header h1{margin:2px 0 0;font-size:18px}
  header select{background:transparent;color:#fff;border:1px solid var(--gold);border-radius:8px;padding:6px 8px;font-size:13px;max-width:280px}
  header select option{color:var(--ink)}
  .versao{font-size:11px;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(201,168,76,.6);border-radius:8px;padding:4px 9px;white-space:nowrap;line-height:1.3}
  .versao b{color:var(--gold)}
  .perfil{font-size:11px;border:1px solid var(--gold);color:var(--gold-soft);border-radius:12px;padding:2px 8px;white-space:nowrap}
  nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
  nav.tabs button{background:transparent;border:0;color:#d9e6dd;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
  nav.tabs button.on{color:#fff;border-bottom-color:var(--gold)}
  .wrap{max-width:1180px;margin:0 auto;padding:16px}
  /* v3.169.0: celular — barra de cima com ☰; o menu abre na lateral (padrão do CRM) */
  .menu-btn,.menu-fechar{display:none}
  /* v3.175.0: pop-up de instalação do app (PWA) */
  .pwa-ban{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:3000;background:#fff;border:2px solid var(--gold);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.28);padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:560px;margin:0 auto}
  .pwa-ban img{width:48px;height:48px;border-radius:12px;flex:0 0 auto}
  .pwa-ban .pwa-txt{flex:1 1 200px;font-size:13px;line-height:1.35;color:var(--ink)}.pwa-ban .pwa-txt b{display:block;color:var(--green);font-size:14px}.pwa-ban .pwa-txt span b{display:inline;font-size:13px}
  .pwa-ban .pwa-bts{display:flex;gap:6px;flex:0 0 auto;margin-left:auto}
  .pwa-ban.hide{display:none}
  .menu-fundo{display:none}
  @media (max-width:979px){
    .menu-btn{display:inline-flex;font-size:18px;padding:4px 12px;line-height:1}
    header{padding-bottom:12px}
    header nav.tabs, header .top > .row{display:none}
    body.menu-aberto{overflow:hidden}
    body.menu-aberto .menu-fundo{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:39}
    body.menu-aberto header{position:fixed;left:0;top:0;bottom:0;width:min(86vw,330px);z-index:40;padding:16px 12px 12px;border-radius:0 18px 18px 0;
      border:1px solid rgba(201,168,76,.4);border-left:0;display:flex;flex-direction:column;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.35)}
    body.menu-aberto header .top{display:contents}
    body.menu-aberto header .titulo{order:0;position:relative;padding:0 44px 12px 4px;border-bottom:1px solid rgba(201,168,76,.35)}
    body.menu-aberto .menu-btn{display:none}
    body.menu-aberto .menu-fechar{display:inline-flex;position:absolute;right:0;top:0;width:38px;height:38px;border-radius:50%;justify-content:center;align-items:center;font-size:16px;border:2px solid var(--gold);background:transparent}
    body.menu-aberto nav.tabs{order:1;display:flex;flex-direction:column;gap:3px;overflow:visible;margin:12px 0}
    body.menu-aberto nav.tabs button{text-align:left;border:1px solid transparent;border-radius:11px;padding:12px;font-size:15px;color:#d9e6dd}
    body.menu-aberto nav.tabs button.on{color:var(--gold-soft);background:rgba(201,168,76,.14);border-color:var(--gold)}
    body.menu-aberto header .top > .row{order:2;display:flex;margin-top:auto;flex-direction:column;align-items:stretch !important;gap:8px;padding-top:12px;border-top:1px solid rgba(201,168,76,.35)}
    body.menu-aberto header .top > .row > *{max-width:none;width:100%;text-align:center;flex:0 0 auto !important}
  }
  /* v3.169.0: menu na lateral (padrão do CRM, nas cores da ZAYRA) — no computador */
  @media (min-width:980px){
    body{padding-left:272px}
    header{position:fixed;left:12px;top:12px;bottom:12px;width:248px;padding:16px 12px 12px;border-radius:18px;border:1px solid rgba(201,168,76,.4);
      display:flex;flex-direction:column;overflow-y:auto;box-shadow:0 10px 30px rgba(12,51,32,.25);scrollbar-width:thin}
    header .top{display:contents}
    header .titulo{order:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:0 4px 12px;border-bottom:1px solid rgba(201,168,76,.35)}
    header .titulo #hdrEmblema{width:46px;height:46px}
    header h1{font-size:16px;line-height:1.25}
    nav.tabs{order:1;flex-direction:column;gap:3px;overflow:visible;margin:12px 0}
    nav.tabs button{text-align:left;border-bottom:0;border:1px solid transparent;border-radius:11px;padding:10px 12px;color:#d9e6dd;font-size:14px}
    nav.tabs button:hover{background:rgba(255,255,255,.06);color:#fff}
    nav.tabs button.on{color:var(--gold-soft);background:rgba(201,168,76,.14);border-color:var(--gold)}
    header .top > .row{order:2;margin-top:auto;flex-direction:column;align-items:stretch !important;gap:8px;padding-top:12px;border-top:1px solid rgba(201,168,76,.35)}
    header .top > .row > *{max-width:none;width:100%;text-align:center;flex:0 0 auto !important}
    header select{max-width:none}
    .wrap{max-width:1240px}
  }
  /* v3.145.0: cabeçalho com navegação + painel moderno */
  .navbtn{background:rgba(255,255,255,.1);color:#fff;border:1px solid var(--gold);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;font-family:inherit}
  .navbtn:hover{background:rgba(201,168,76,.25)}
  .navbtn.fechar{background:var(--gold);color:var(--green);border-color:var(--gold)}
  .titulo{display:flex;align-items:center;gap:10px}
  .titulo img{height:42px;width:42px;border-radius:50%;background:#fff;padding:2px}
  .hero{position:relative;display:flex;align-items:center;gap:18px;background:linear-gradient(120deg,#0C3320 0%,#14472B 55%,#1e5a36 100%);color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:14px;overflow:hidden;box-shadow:0 6px 18px rgba(12,51,32,.25)}
  .hero:after{content:'';position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.28),transparent 70%)}
  .hero-emb{width:96px;height:96px;border-radius:50%;background:#fff;padding:3px;flex:0 0 auto;box-shadow:0 0 0 3px var(--gold)}
  .hero-txt{flex:1 1 auto;min-width:0;position:relative;z-index:1}
  .hero-kick{color:var(--gold-soft);font-size:11px;letter-spacing:2px;text-transform:uppercase}
  .hero h2{color:#fff;border:0;margin:2px 0 2px;padding:0;font-size:26px;letter-spacing:.5px}
  .hero-sub{color:#d9e6dd;font-size:13px}
  .hero-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .hero-chips span{background:rgba(255,255,255,.12);border:1px solid rgba(201,168,76,.5);border-radius:14px;padding:3px 10px;font-size:12px}
  .hero-chips span.warn{background:rgba(179,38,30,.35);border-color:#e7a29c}
  .hero-bras{height:118px;width:auto;flex:0 0 auto;position:relative;z-index:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
  @media(max-width:700px){.hero{flex-wrap:wrap}.hero-bras{height:84px}.hero-emb{width:72px;height:72px}.hero h2{font-size:21px}}
  .kpis2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
  .k2{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:14px;padding:13px 14px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-top:4px solid var(--gold)}
  .k2.ok{border-top-color:var(--ok)} .k2.red{border-top-color:var(--red)}
  .k2i{font-size:20px;width:38px;height:38px;border-radius:10px;background:var(--cream);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .k2 .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
  .k2 .v{font-size:20px;font-weight:800;color:var(--green);margin:2px 0}
  .k2.red .v{color:var(--red)}
  .bar2{height:7px;background:#ece7d8;border-radius:5px;overflow:hidden;margin:4px 0}
  .bar2 i{display:block;height:100%;background:linear-gradient(90deg,#1f7a4d,#C9A84C)}
  .grid3c{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:900px){.grid3c{grid-template-columns:1fr}}
  .rosca{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
  .rosca svg{width:150px;height:150px;flex:0 0 auto}
  .vleg{flex-direction:column;gap:5px}
  .vleg b{color:var(--green)}
  .medl{display:flex;align-items:center;gap:10px;margin:7px 0}
  .medl span{width:100px}
  .mini-k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mini-k div{background:var(--cream);border-radius:10px;padding:10px;text-align:center}
  .mini-k b{display:block;font-size:22px;color:var(--green)}
  .mini-k span{font-size:11px;color:var(--muted)}
  .pchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
  .citem{display:block;font-size:13px;margin:2px 0;cursor:pointer}
  .citem input{margin-right:4px;vertical-align:middle}
  .pchip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--ink)}
  .pchip b{color:var(--red);margin-left:3px}
  .pchip.on{background:var(--green);color:#fff;border-color:var(--green)}
  .pchip.on b{color:var(--gold-soft)}
  /* v3.145.2: brasão no espaço vazio do canto inferior direito (depois da Rua 08 diagonal) */
  .memo-t{text-align:justify;line-height:1.55;font-size:13px}
  .mapa-bras{position:absolute;right:3%;bottom:3%;width:16%;max-width:210px;height:auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.3));pointer-events:none}
  #mapaBox{position:relative}
  .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
  h2{color:var(--green);font-size:16px;margin:0 0 10px;border-bottom:2px solid var(--gold);padding-bottom:6px}
  h3{color:var(--green);font-size:14px;margin:14px 0 8px}
  label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px;font-weight:700}
  input,textarea,select.f{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
  textarea{min-height:60px;resize:vertical}
  .btn{border:0;border-radius:8px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn-primary{background:var(--green);color:#fff}
  .btn-gold{background:var(--gold);color:var(--green)}
  .btn-ghost{background:#fff;color:var(--green);border:1px solid var(--gold)}
  .btn-danger{background:#fff;color:var(--red);border:1px solid var(--red)}
  .btn-sm{padding:6px 10px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
  .row>*{flex:1 1 160px}
  /* v3.155.1: mobile — blocos de botões com flex:0 0 auto não encolhiam e estouravam a largura da tela */
  html,body{max-width:100%;overflow-x:clip}
  .row>*{min-width:0;max-width:100%}
  .btn{max-width:100%;white-space:normal}
  @media (max-width:700px){
    .row>[style*="flex:0 0 auto"]{flex-shrink:1 !important}
    header .top>.row{flex:1 1 100% !important}
    header select{max-width:100%;min-width:0;flex:1 1 160px}
    .versao{overflow:hidden;text-overflow:ellipsis}
    .card .row>h2{flex:1 1 100% !important}
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
  .muted{color:var(--muted);font-size:12px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .kpi{background:#fff;border-radius:12px;padding:14px;border-left:5px solid var(--gold);box-shadow:0 2px 6px rgba(0,0,0,.05)}
  .kpi .v{font-size:22px;font-weight:800;color:var(--green);margin-top:4px}
  .kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
  .kpi.red{border-left-color:var(--red)} .kpi.red .v{color:var(--red)}
  .kpi.ok{border-left-color:var(--ok)}
  .stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:#eee;margin:8px 0}
  .stack i{display:block;height:100%}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;padding:7px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
  td{padding:7px 6px;border-bottom:1px solid #eee8d8;vertical-align:top}
  tr.click{cursor:pointer} tr.click:hover td{background:var(--cream)}
  .tbl{overflow-x:auto}
  .chip{display:inline-block;border-radius:12px;padding:2px 8px;font-size:11px;font-weight:700;border:1px solid var(--line);background:#faf7ee;color:var(--green2);white-space:nowrap}
  .c-PAGO,.c-QUITADO,.c-EM_DIA,.c-ASSINADO,.c-MEDIDO,.c-PROCESSADO,.c-ENTREGUE{background:#e6f4ec;color:var(--ok);border-color:#b9e0c9}
  .c-PARCIAL,.c-SINAL_PARCIAL,.c-AGENDADA,.c-ENVIADO,.c-PREPARADA{background:#fdf4dd;color:var(--warn);border-color:#f0dfa8}
  .c-A_PAGAR,.c-SINAL_PENDENTE,.c-VENCIDO,.c-RETIDA_PAGAMENTO{background:#fbe9e7;color:var(--red);border-color:#f1c2bd}
  .c-A_VENCER,.c-GERADO,.c-PENDENTE{background:#f1efe8;color:var(--muted)}
  .c-INSTITUCIONAL{background:#e8eef5;color:var(--blue);border-color:#c5d5e6}
  .c-VALIDO{background:#e6f4ec;color:var(--ok);border-color:#b9e0c9}
  .c-INEXISTENTE,.c-CANCELADO,.c-ESTORNADO{background:#fbe9e7;color:var(--red);border-color:#f1c2bd}
  .c-EM_ATRASO{background:#fbe9e7;color:var(--red);border-color:#f1c2bd} .c-SEM_PLANO{background:#f1efe8;color:var(--muted)}
  .grid21{display:grid;grid-template-columns:2fr 1fr;gap:14px} @media (max-width:800px){.grid21{grid-template-columns:1fr}}
  .av{width:36px;height:48px;border-radius:6px;object-fit:cover;border:2px solid var(--gold-soft);background:#f1efe8;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#9c967f;vertical-align:middle}
  .ctframe{width:100%;height:580px;border:1px solid var(--line);border-radius:10px;background:#e9e5d9}
  @media (min-width:801px){.ctgrid{grid-template-columns:3fr 2fr}}
  .ml-mapa{height:560px;border:1px solid #CFD8BF;border-radius:16px;overflow:hidden;margin-top:8px;background:#E7EEDB}
  @media (max-width:700px){.ml-mapa{height:420px}}
  .leaflet-tooltip.ml-rot{background:transparent;border:0;box-shadow:none;padding:0;color:#0C3320;font-weight:800;font-size:10px;text-shadow:0 0 3px #fff,0 0 3px #fff}
  .leaflet-tooltip.ml-rot:before{display:none}
  .ml-leg i{width:14px;height:14px;border-radius:3px;border:1px solid #0C332033}
  /* v3.156.0: mapa 3D dos lotes (MapLibre) — mesmo jeito do Mapa 3D do CRM */
  .ml-modo{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .ml-modo button{display:inline-flex;align-items:center;gap:6px;border:1px solid #CFD8BF;background:#fff;color:#0C3320;border-radius:999px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .ml-modo button.on{border-color:#C9A84C;background:#FBF4E0;color:#7A5B12}
  .ml-wrap{position:relative}
  .ml-ctl{position:absolute;top:10px;left:10px;z-index:5;display:flex;flex-direction:column;align-items:flex-start;gap:8px;max-width:calc(100% - 64px)}
  .ml-ctl .pill,.ml-ctl .seg button{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#0C3320;border:0;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
  .ml-ctl .pill{border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .ml-ctl .pill.on{background:#0C3320;color:#fff}
  .ml-ctl .seg{display:flex;flex-wrap:nowrap;max-width:100%;overflow-x:auto;scrollbar-width:none;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.18);background:#fff}
  .ml-ctl .seg button.on{background:#0C3320;color:#fff}
  .ml-vert{display:flex;align-items:center;gap:3px;cursor:pointer;transform:translate(0,0)}
  .ml-vert i{width:9px;height:9px;border-radius:50%;background:var(--vc,#B3261E);border:1.5px solid #fff;box-shadow:0 0 2px #0006;flex:0 0 auto}
  .ml-vert span{color:var(--vc,#B3261E);font-weight:800;font-size:10px;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;white-space:nowrap}
  .ml-vert.on i{width:15px;height:15px;background:#2F5FD0}
  .ml-vert.on span{color:#1E3F99;font-size:12px}
  .leaflet-tooltip.ml-rotv{color:#B3261E;font-size:10px}
  /* v3.163.0: tela cheia em todos os mapas (no iPhone o Safari não tem tela cheia de elemento: vira camada fixa) */
  .ml-modo .ml-fullbtn{background:#0C3320;color:#fff;border-color:#0C3320}
  .ml-wrap{isolation:isolate}
  .ml-fsico{display:flex !important;align-items:center;justify-content:center;width:29px;height:29px;padding:0;border:0;background:#fff;color:#0C3320;cursor:pointer}
  .ml-fsctl-l .ml-fsico{width:34px;height:34px;border-radius:4px}
  @media (max-width:700px){.ml-fsico,.ml-fsctl-l .ml-fsico{width:36px;height:36px}}
  .ml-full{position:absolute;left:10px;bottom:10px;z-index:1100;background:#fff;color:#0C3320;border:0;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;font-family:inherit;box-shadow:0 2px 8px rgba(0,0,0,.22);cursor:pointer}
  .ml-wrap.cheia,#mapaBox.cheia{position:fixed !important;inset:0;z-index:9999;margin:0 !important;background:#E7EEDB;border-radius:0}
  .ml-wrap.cheia .ml-mapa{height:100vh;height:100dvh;border:0;border-radius:0;margin:0}
  .ml-wrap:fullscreen .ml-mapa{height:100%}
  .ml-wrap.cheia .ml-ctl{top:calc(10px + env(safe-area-inset-top))}
  .cheia>.ml-full{bottom:calc(14px + env(safe-area-inset-bottom));left:calc(12px + env(safe-area-inset-left));background:#0C3320;color:#fff;padding:10px 14px;font-size:14px}
  #mapaBox.cheia{background:#fff;padding:10px;overflow:auto}#mapaBox.cheia #mapaSvg{height:100%}

// v3.157.0: área sempre em hectare e alqueire (1 alqueire = 4,84 ha — padrão MA, igual ao backend services/pa/unidades.ts)
const ALQ_HA = 4.84;
const nbr4 = (v) => Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 4, maximumFractionDigits: 4 });
const alqTxt = (ha) => `${nbr4(ha / ALQ_HA)} ${Math.abs(ha / ALQ_HA - 1) < 1e-12 ? 'alqueire' : 'alqueires'}`;
const haAlq = (ha) => `${nbr4(ha)} ha (${alqTxt(ha)})`;
const haAlqC = (ha) => `${nbr4(ha)} ha · ${nbr4(ha / ALQ_HA)} alq.`;
(function(){
'use strict';
// ─── infra ──────────────────────────────────────────────────────────────
const $ = (s, el) => (el || document).querySelector(s);

const dbr = (iso) => iso ? `${iso.slice(8,10)}/${iso.slice(5,7)}/${iso.slice(0,4)}${iso.length > 10 ? ' ' + iso.slice(11,16) : ''}` : '—';

const dhBr = (iso) => {

  if (Number.isNaN(d.getTime())) return dbr(t);
  return d.toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }).replace(',', '');

async function api(path, opts){
  opts = opts || {}; opts.credentials = 'include';
  if (opts.json !== undefined){ opts.method = opts.method || 'POST'; opts.headers = Object.assign({ 'Content-Type':'application/json' }, opts.headers || {}); opts.body = JSON.stringify(opts.json); delete opts.json; }
  const r = await fetch('/api/pa' + path, opts);
  if (r.status === 401){ location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search); throw new Error('não autenticado'); }
  const ct = r.headers.get('content-type') || '';
  if (!ct.includes('application/json')){ if (!r.ok) throw new Error('HTTP ' + r.status); return r; }
  const j = await r.json();
  if (!r.ok){ const e = new Error(j.erro || ('HTTP ' + r.status)); e.codigo = j.codigo; e.detalhe = j.detalhe; throw e; }
  return j;
}
async function baixar(path, nome){
  const r = await api(path);
  const blob = await r.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = nome || ''; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

/** Rosca SVG: segs = [{v, cor, rotulo}] */
function rosca(segs, centro, sub){
  const tot = segs.reduce((s, x) => s + x.v, 0) || 1;
  const R = 52, C = 2 * Math.PI * R; let off = 0;
  const arcos = segs.filter((x) => x.v > 0).map((x) => { const l = x.v / tot * C; const a = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${x.cor}" stroke-width="20" stroke-dasharray="${l.toFixed(2)} ${(C - l).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"><title>${esc(x.rotulo)}: ${x.fmt ?? x.v}</title></circle>`; off += l; return a; }).join('');
  return `<div class="rosca"><svg viewBox="0 0 140 140" role="img"><circle r="${R}" cx="70" cy="70" fill="none" stroke="#efeadb" stroke-width="20"/>${arcos}
    <text x="70" y="66" text-anchor="middle" font-size="19" font-weight="800" fill="#0C3320">${esc(centro)}</text><text x="70" y="84" text-anchor="middle" font-size="9.5" fill="#6A6656">${esc(sub || '')}</text></svg>
    <div class="leg vleg">${segs.map((x) => `<span><i style="background:${x.cor}"></i>${esc(x.rotulo)} <b>${x.fmt ?? x.v}</b></span>`).join('')}</div></div>`;
}

/** Barras SVG empilhadas: itens [{rotulo, partes:[{v,cor,nome}]}] */
function barras(itens, fmtV){
  if (!itens.length) return '<div class="empty">Sem dados ainda.</div>';
  const max = Math.max(1, ...itens.map((i) => i.partes.reduce((s, p) => s + p.v, 0)));
  const L = 54, W = Math.max(300, itens.length * L + 20), H = 170, base = 140;
  let g = '';
  itens.forEach((it, i) => {
    let y = base; const x = 14 + i * L;
    const tot = it.partes.reduce((s, p) => s + p.v, 0);
    for (const p of it.partes) { const h = p.v / max * 112; if (h <= 0) continue; y -= h; g += `<rect x="${x}" y="${y.toFixed(1)}" width="34" height="${h.toFixed(1)}" rx="3" fill="${p.cor}"><title>${esc(it.rotulo)} · ${esc(p.nome)}: ${fmtV(p.v)}</title></rect>`; }
    g += `<text x="${x + 17}" y="${(y - 5).toFixed(1)}" font-size="10" font-weight="700" text-anchor="middle" fill="#0C3320">${kfmt(tot)}</text><text x="${x + 17}" y="${base + 15}" font-size="10" text-anchor="middle" fill="#6A6656">${esc(it.rotulo)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:190px" role="img"><line x1="6" y1="${base}" x2="${W - 6}" y2="${base}" stroke="#DCD5C2"/>${g}</svg>`;
}

function quebrar(txt, largura, fs){
  const max = Math.max(4, Math.floor(largura / (fs * 0.56))); const out = []; let linha = '';
  for (const p of String(txt).split(/\s+/)) { if (!linha) linha = p; else if ((linha + ' ' + p).length <= max) linha += ' ' + p; else { out.push(linha); linha = p; } }
  if (linha) out.push(linha); return out.slice(0, 3);

function pill(x, y, texto, rot, estilo, tam){

  const st = estilo === 'praca' ? 'fill="#0C3320" stroke="none"' : estilo === 'verde' ? 'fill="rgba(255,255,255,.88)" stroke="#2E7D32" stroke-width=".35"' : 'fill="#fff" stroke="#8A8A8A" stroke-width=".3"';

  return `<g transform="${tr}"><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${h/2}" ${st}/><text class="mt" font-size="${fs}" fill="${cor}">${esc(texto)}</text></g>`;

function icone(i){

    case 'fonte': return `<circle cx="${x}" cy="${y}" r="${r}" fill="#E9E4D6"/><circle cx="${x}" cy="${y}" r="${r*.54}" fill="#4FC3F7" stroke="#90A4AE" stroke-width=".4"/>`;

      + `<rect x="${x+w/2-1.4}" y="${y+h/2-4.5}" width="2.8" height="9" fill="#E53935"/><rect x="${x+w/2-4.5}" y="${y+h/2-1.4}" width="9" height="2.8" fill="#E53935"/>`;

    case 'estacionamento': { let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1" fill="#9E9E9E" stroke="#757575" stroke-width=".4"/>`; for (let k = 1; k < 7; k++) s += `<line x1="${x + w*k/7}" y1="${y + 3}" x2="${x + w*k/7}" y2="${y + 11}" stroke="#fff" stroke-width=".5"/>`; return s; }
    case 'quadra': return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1" fill="#4E8F5A" stroke="#2E5E38" stroke-width=".4"/><rect x="${x+2}" y="${y+2}" width="${w-4}" height="${h-4}" fill="none" stroke="#fff" stroke-width=".5"/><line x1="${x+w/2}" y1="${y+2}" x2="${x+w/2}" y2="${y+h-2}" stroke="#fff" stroke-width=".5"/><circle cx="${x+w/2}" cy="${y+h/2}" r="3" fill="none" stroke="#fff" stroke-width=".5"/>`;

      for (const k of [0, 3]) s += `<rect x="${x + 1.6 + k*(w-3.2)/4}" y="${y + h/2 - 3}" width="${(w-3.2)/4 - 1.6}" height="4" fill="#64B5F6"/>`;

function svgMapa(lotes, d, modo){

  let s = `<svg id="mapaSvg" viewBox="${lim.minX} ${lim.minY} ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">`;
  if (d){
    const praca = d.areas.find((a) => a.tipo === 'praca');
    if (praca) s += `<defs><clipPath id="clipPraca"><polygon points="${pts(praca.pts)}"/></clipPath></defs>`;
    s += d.areas.map((a) => `<polygon points="${pts(a.pts)}" fill="${FILL[a.tipo] || '#ddd'}" ${a.tipo === 'viario' ? '' : 'stroke="#3A3A3A" stroke-width=".45"'}/>`).join('');
    s += d.caminhos.map((c) => `<polyline points="${pts(c.pts)}" stroke="${c.cor}" stroke-width="${c.largura}" fill="none"${praca ? ' clip-path="url(#clipPraca)"' : ''}/>`).join('');
    s += d.icones.map(icone).join('');
  }
  for (const l of com){
    const xs = l.croqui_xy.map((p) => p[0]), ys = l.croqui_xy.map((p) => p[1]);

    const inst = l.tipo === 'INSTITUCIONAL';

    const escuro = !inst && ((modo === 'financeiro' && ['QUITADO','VENCIDO'].includes(l.financeiro.situacao)) || (modo === 'medicao' && l.status_medicao === 'PROCESSADO'));
    const corTxt = escuro ? '#fff' : '#1B1B1B', corNum = escuro ? '#fff' : inst ? '#1F4E79' : '#0C3320', corDim = escuro ? '#e8f0ea' : '#5A5A5A';
    const titulo = `Lote ${l.numero}${l.associado ? ' — ' + l.associado.nome : inst ? ' — área institucional' : ''}`;
    s += `<g class="lote" data-n="${esc(l.numero)}"><title>${esc(titulo)}</title><polygon points="${pts(l.croqui_xy)}" fill="${fill}" stroke="#3A3A3A" stroke-width=".4"/>`;
    s += `<text class="mt" x="${cx}" y="${y0 + 3.6}" font-size="3.8" fill="${corNum}">${esc(l.numero)}</text>`;
    const fs = w >= 40 ? 2.45 : 2.3;
    const linhas = inst ? ['ÁREA', 'INSTITUCIONAL'] : (l.associado ? quebrar(nomeTitulo(l.associado.nome), w - 2.4, fs) : []);
    const y1 = w >= 40 ? y0 + 3.6 + 2.2 + fs : y0 + h / 2 - ((linhas.length - 1) * (fs + 0.6)) / 2;
    linhas.forEach((t, i) => { s += `<text class="mt" x="${cx}" y="${(y1 + i * (fs + 0.6)).toFixed(2)}" font-size="${fs}" fill="${inst ? '#1F4E79' : corTxt}" font-weight="${inst ? 400 : 700}">${esc(t)}</text>`; });
    const dimTxt = `${Math.round(Math.min(w, h))}×${Math.round(Math.max(w, h))} m`, area = l.area_projeto_m2 ? `${Math.round(l.area_projeto_m2)} m²` : '';

  }

    s += d.eixos.map(([a, b]) => `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#F5F5F5" stroke-width=".6" stroke-dasharray="3 3"/>`).join('');
    s += d.cotas.map((c) => { const hz = c.y1 === c.y2; const mx = (c.x1 + c.x2) / 2, my = (c.y1 + c.y2) / 2;
      const tk = hz
        ? `<line x1="${c.x1}" y1="${c.y1-1}" x2="${c.x1}" y2="${c.y1+1}" stroke="#444" stroke-width=".25"/><line x1="${c.x2}" y1="${c.y2-1}" x2="${c.x2}" y2="${c.y2+1}" stroke="#444" stroke-width=".25"/><text class="mt" x="${mx}" y="${my-1.2}" font-size="2.2" fill="#222" font-weight="400">${esc(c.texto)}</text>`
        : `<line x1="${c.x1-1}" y1="${c.y1}" x2="${c.x1+1}" y2="${c.y1}" stroke="#444" stroke-width=".25"/><line x1="${c.x2-1}" y1="${c.y2}" x2="${c.x2+1}" y2="${c.y2}" stroke="#444" stroke-width=".25"/><text class="mt" transform="translate(${mx-1.4},${my}) rotate(-90)" font-size="2.2" fill="#222" font-weight="400">${esc(c.texto)}</text>`;
      return `<line x1="${c.x1}" y1="${c.y1}" x2="${c.x2}" y2="${c.y2}" stroke="#444" stroke-width=".25"/>` + tk; }).join('');
    s += d.rotulos.map((r) => pill(r.x, r.y, r.texto, r.rot || 0, r.estilo, r.tam)).join('');
  }
  return s + '</svg>';
}

function svgPerimetroTela(p){
  const Es = p.vertices.map((x) => x.E), Ns = p.vertices.map((x) => x.N);
  const minE = Math.min(...Es), maxE = Math.max(...Es), minN = Math.min(...Ns), maxN = Math.max(...Ns);
  const span = Math.max(maxE - minE, maxN - minN) || 1, pad = span * 0.12;
  const x0 = minE - pad, y0 = -(maxN + pad), W = maxE - minE + pad * 2, H = maxN - minN + pad * 2, fs = span * 0.025, sw = span * 0.003;
  const cx = Es.reduce((s, x) => s + x, 0) / Es.length, cy = -Ns.reduce((s, x) => s + x, 0) / Ns.length;
  return `<svg viewBox="${x0} ${y0} ${W} ${H}" style="width:100%;max-height:560px;display:block;background:#FBFAF5;border:1px solid var(--line);border-radius:10px">
    <polygon points="${p.vertices.map((x) => `${x.E},${-x.N}`).join(' ')}" fill="#B7D99A" fill-opacity=".55" stroke="#0C3320" stroke-width="${sw * 2}"/>
    ${p.vertices.map((x) => { const dx = x.E - cx, dy = -x.N - cy, L = Math.hypot(dx, dy) || 1; return `<circle cx="${x.E}" cy="${-x.N}" r="${sw * 3}" fill="#B3261E"/><text x="${x.E + dx / L * fs * 1.2}" y="${-x.N + dy / L * fs * 1.2}" font-size="${fs * 0.85}" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#B3261E">${esc(x.nome)}</text>`; }).join('')}
    <text x="${cx}" y="${cy}" font-size="${fs * 1.3}" font-weight="800" text-anchor="middle" fill="#0C3320">${Number(p.area_ha).toLocaleString('pt-BR', { minimumFractionDigits: 4 })} ha</text><text x="${cx}" y="${cy + fs * 1.5}" font-size="${fs * 1.05}" font-weight="700" text-anchor="middle" fill="#0C3320">${alqTxt(p.area_ha)}</text>
    <g transform="translate(${x0 + W - pad * 0.55},${y0 + pad * 0.6})"><polygon points="0,${-fs * 1.6} ${fs * 0.7},${fs * 0.6} 0,${fs * 0.2} ${-fs * 0.7},${fs * 0.6}" fill="#0C3320"/><text y="${-fs * 1.9}" font-size="${fs}" font-weight="800" text-anchor="middle" fill="#0C3320">N</text></g></svg>`;
}
const dms = (g) => { const t = Math.round(g * 3600); return `${Math.floor(t / 3600)}°${String(Math.floor(t % 3600 / 60)).padStart(2, '0')}'${String(t % 60).padStart(2, '0')}"`; };

  const verLote = async (lote) => {

        <img src="/api/pa/projetos/${S.pid}/subdivisao.svg?lote=${encodeURIComponent(pc.lote)}&t=${Date.now()}" alt="Mapa do lote ${esc(pc.lote)}" style="width:100%;display:block;border:1px solid var(--line);border-radius:10px;margin-top:8px">

    } catch (e){ el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  };
  $('#sdBusca').oninput = (e) => { SUBV.busca = e.target.value; lista(); };
  lista();
  if (SUBV.lote) verLote(SUBV.lote);
  // v3.182.0: mapa público para os associados
  if ($('#mpCopiar')) {
    const mp = () => api(`/projetos/${S.pid}/mapa-publico`);
    $('#mpCopiar').onclick = () => copiarTextoGrupo(`/projetos/${S.pid}/mapa-publico`);

      try {
        const r = await mp();

      } catch (e){ toast(e.message, true); }
    };
  }

// v3.158.0: quadro do que a limpeza das poligonais corrigiu
function quadroLimpeza(l){
  if (!l) return '';
  const m2 = (v) => v == null ? '—' : Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
  const quando = new Date(l.em).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' });
  if (!l.lotes_corrigidos && !l.avisos.length) return `<div class="muted" style="margin-top:8px">🧹 Poligonais conferidas em ${quando}: todas fechadas, sem sobreposição nem traço solto.</div>`;
  return `<details class="ml-limp" style="margin-top:8px"${l.avisos.length ? ' open' : ''}><summary>🧹 Limpeza das poligonais (${quando}): <b>${l.lotes_corrigidos} lote(s) corrigido(s)</b>${l.avisos.length ? ` · ${l.avisos.length} aviso(s)` : ''}</summary>

function previaCarteirinha(ids){
  $('#ctPrev').innerHTML = `<iframe class="ctframe" src="/api/pa/projetos/${S.pid}/carteirinhas.html?ids=${ids.join(',')}&t=${Date.now()}" title="Prévia da carteirinha"></iframe>

  $('#ctPrevPdf').onclick = () => gerarPdfCarteirinhas(ids, ids.length);

async function gerarPdfCarteirinhas(ids, n){
  if (n > 1 && !confirm(`Gerar o PDF com ${n} carteirinha(s)? Pode levar alguns segundos.`)) return;
  const janela = window.open('about:blank', '_blank');
  toast('Gerando PDF…');
  try {
    const r = await fetch(`/api/pa/projetos/${S.pid}/carteirinhas.pdf${ids ? '?ids=' + ids.join(',') : ''}`, { credentials: 'include' });
    if (r.status === 401){ location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search); return; }
    if (!r.ok){ let m = 'HTTP ' + r.status; try { m = (await r.json()).erro || m; } catch { /* ok */ } throw new Error(m); }
    const url = URL.createObjectURL(await r.blob());
    if (janela) janela.location.href = url; else window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 120000);
    const agora = new Date().toISOString();
    CART.lista.forEach((a) => { if (!ids || ids.includes(a.id)) a.carteirinha_emitida_em = agora; });
    desenharCarteirinhas();
  } catch (e){ if (janela) janela.close(); toast(e.message, true); }
}
function trocarFoto(aid){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'user';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const fd = new FormData(); fd.append('tipo', 'FOTO_3X4'); fd.append('arquivo', f, f.name);
    try {
      const r = await fetch(`/api/pa/associados/${aid}/documentos`, { method: 'POST', body: fd, credentials: 'include' });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.erro || 'HTTP ' + r.status);
      toast('Foto atualizada — a carteirinha já usa a nova');
      const a = CART.lista.find((x) => x.id === aid); if (a){ a.documentos.tem_foto = true; a.documentos.foto_v = Date.now(); }
      S.assoc = null;
      desenharCarteirinhas();
      previaCarteirinha([aid]);
    } catch (e){ toast(e.message, true); }
  };
  inp.click();
}

      if (r.status === 401){ location.href = '/login?next=' + encodeURIComponent(location.pathname); return; }
      if (!r.ok){ let m = 'HTTP ' + r.status; try { m = (await r.json()).erro || m; } catch { /* ok */ } throw new Error(m); }
      const url = URL.createObjectURL(await r.blob());
      if (janela) janela.location.href = url; else window.open(url, '_blank');
      setTimeout(() => URL.revokeObjectURL(url), 120000);
    } catch (e){ if (janela) janela.close(); toast(e.message, true); }
    bt.disabled = false;
  };

        <div><label for="ptGrupo">Grupo do WhatsApp</label><select class="f" id="ptGrupo"><option value="">Automático (pela sincronização)</option><option value="SIM" ${v.grupo_whatsapp_manual === 'SIM' ? 'selected' : ''}>Está no grupo</option><option value="NAO" ${v.grupo_whatsapp_manual === 'NAO' ? 'selected' : ''}>Não está no grupo</option></select></div>

      <div style="flex:0 0 auto"><button class="btn btn-ghost" id="grpBtn">👥 Grupo do WhatsApp</button>${podeEscrever() ? ' <button class="btn btn-ghost" id="verifWa">📱 Verificar WhatsApps</button> <button class="btn btn-gold" id="novoAssoc">➕ Novo associado</button>' : ''}</div></div>
      <div id="waBox"></div><div id="grpBox"></div></div>
    <div class="card"><div id="assocLista" class="tbl"><div class="empty">Carregando…</div></div></div>`;
  let timer = null;
  const carregar = async () => {
    try {
      const q = $('#busca').value.trim();
      const { associados } = await api(`/projetos/${S.pid}/associados${q ? '?q=' + encodeURIComponent(q) : ''}`);
      const fs = $('#fSit').value;
      const fw = $('#fWa').value;
      const lista = associados.filter((a) => (!fs || (fs === 'VENCIDO' ? a.financeiro.vencidos > 0 : fs === 'SEMDOC' ? a.documentos.total === 0 : a.financeiro.sinal_status === fs)) && (!fw || a.whatsapp_status === fw));
      $('#assocLista').innerHTML = lista.length ? `<table><thead><tr><th></th><th title="Lote onde mora, na vila">Lote vila</th><th title="Lote rural de produção (subdivisão)">Lote produção</th><th>Nº</th><th>Associado</th><th>Terra</th><th>WhatsApp</th><th>Entrada</th><th class="right">Recebido</th><th class="right">Saldo</th><th>Contrato</th><th>Docs</th></tr></thead><tbody>
        ${lista.map((a) => `<tr class="click" data-id="${a.id}"><td>${fotoMini(a)}</td><td><b>${esc(a.lote)}</b></td><td class="nowrap">${a.parcela ? '<b>LT-' + esc(a.parcela) + '</b>' : '<span class="muted">—</span>'}</td><td class="nowrap">${esc(a.numero)}</td><td>${esc(a.nome)}<div class="muted">${esc(a.cpf)}</div>${(a.participantes || []).map((x) => `<div class="muted">+ ${esc(x.nome)} <i>(${esc(x.vinculo.toLowerCase())}${x.responsavel_campo ? ', em campo' : ''})</i></div>`).join('')}</td><td>${esc(a.denominacao_terra || '')}</td>
          <td>${chip(a.whatsapp_status, WA_TXT[a.whatsapp_status])}</td><td>${chip(a.financeiro.sinal_status)}</td><td class="right nowrap">${brl(a.financeiro.recebido)}</td><td class="right nowrap">${a.financeiro.saldo ? brl(a.financeiro.saldo) : chip('QUITADO')}</td>
          <td>${chip(a.contrato_status)}</td><td class="nowrap">${a.documentos.com_arquivo}/${a.documentos.total}</td></tr>`).join('')}</tbody></table>
        <div class="muted" style="margin-top:6px">${lista.length} associado(s)</div>` : '<div class="empty">Nenhum associado encontrado.</div>';
      $('#assocLista').querySelectorAll('tr.click').forEach((tr) => tr.onclick = () => abrirAssociado(Number(tr.dataset.id)));
    } catch (e){ $('#assocLista').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  };
  $('#busca').oninput = () => { clearTimeout(timer); timer = setTimeout(carregar, 300); };
  $('#fSit').onchange = carregar;
  $('#fWa').onchange = carregar;
  if ($('#novoAssoc')) $('#novoAssoc').onclick = formNovoAssociado;
  $('#grpBtn').onclick = painelGrupoWhatsApp;
  if ($('#verifWa')) $('#verifWa').onclick = async () => {
    const b = $('#verifWa'); b.disabled = true; $('#waBox').innerHTML = '<div class="muted" style="margin-top:8px">Consultando a Z-API…</div>';
    try {
      const r = await api(`/projetos/${S.pid}/whatsapp/verificar`, { json: {} });
      const ruins = r.detalhes.filter((x) => x.status !== 'VALIDO');
      $('#waBox').innerHTML = `<div class="avisos" style="margin-top:8px">📱 ${r.verificados} verificados · ${chip('VALIDO', r.validos + ' com WhatsApp')} ${chip('INEXISTENTE', r.inexistentes + ' sem WhatsApp')} ${chip('SEM_TELEFONE', r.sem_telefone + ' sem telefone')}
        ${ruins.length ? `<div style="margin-top:6px">${ruins.map((x) => `Lote ${esc(x.lote)} — ${esc(x.nome)} ${chip(x.status, WA_TXT[x.status])}`).join('<br>')}</div>` : ''}</div>`;
      S.assoc = null; carregar();
    } catch (e){ $('#waBox').innerHTML = `<div class="avisos" style="margin-top:8px;color:var(--red)">${esc(e.message)}</div>`; }
    finally { b.disabled = false; }
  };
  carregar();
}
const WA_TXT = { VALIDO:'✓ WhatsApp', INEXISTENTE:'sem WhatsApp', SEM_TELEFONE:'sem telefone', NAO_VERIFICADO:'não verificado' };

function fecharDrawer(){ $('#drawer').classList.remove('on'); atualizarVoltar(); }
$('#drawer').addEventListener('click', (e) => { if (e.target.id === 'drawer') fecharDrawer(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fecharDrawer(); });

function avisosHtml(av){ return av && av.length ? `<ul class="avisos">${av.map((a) => `<li>⚠️ ${esc(a)}</li>`).join('')}</ul>` : ''; }

async function abrirAssociado(aid, avisos){
  const pane = $('#drawerPane');
  $('#drawer').classList.add('on');

      api(`/projetos/${S.pid}/associados/${aid}`),
      api(`/associados/${aid}/boletos`).catch(() => ({ boletos: [] })),
    ]);
    const a = d.associado;
    const bolAtivo = new Map(bol.boletos.filter((b) => (b.status === 'PENDENTE' || b.status === 'VENCIDO') && b.ambiente_atual).map((b) => [b.lancamento_id, b]));
    const bolPago = new Map(bol.boletos.filter((b) => b.status === 'PAGO').map((b) => [b.lancamento_id, b]));

        ${b.linha_digitavel ? `<button class="btn btn-ghost btn-sm" data-copiar="${esc(b.linha_digitavel)}">Linha</button>` : ''}
        ${b.pix_copia_cola ? `<button class="btn btn-ghost btn-sm" data-copiar="${esc(b.pix_copia_cola)}">Pix</button>` : ''}
        ${podeEscrever() && b.status !== 'PAGO' ? `<button class="btn btn-danger btn-sm" data-cancbol="${b.id}">Cancelar</button>` : ''}`;
      return podeEscrever() && l.saldo > 0 ? `<button class="btn btn-ghost btn-sm" data-emitir="${l.id}">Emitir boleto</button>` : '';
    };
    const tipoDoc = { FOTO_3X4:'Foto 3×4', DOC_IDENTIFICACAO:'Identificação', CERTIDAO:'Certidão', DOC_CONJUGE:'Doc. cônjuge', COMPROVANTE_SINAL:'Comprovante do sinal', PROCESSO_FICHA_CONTRATO:'Ficha + contrato', PROCESSO_ASSINADO:'Processo assinado', CARTEIRINHA:'Carteirinha', MAPA_LOTE:'Mapa do lote', MEMORIAL:'Memorial', TRT:'TRT', RELATORIO:'Relatório', ORIGINAL:'Original', OUTRO:'Outro', CAPA_DOSSIE_LOTE:'Capa do dossiê' };
    pane.innerHTML = `<div class="phead"><div><div style="font-size:11px;color:var(--gold-soft)">${esc(a.numero)} · Lote ${esc(a.lote)}</div><b>${esc(a.nome)}</b></div><button class="x" id="dx">✕</button></div>
      <div style="padding:14px">
        ${avisosHtml(avisos)}
        <div class="card"><h2>Dados</h2>
          ${S.eu.ve_documentos ? '<div class="foto3x4" id="fotoBox">sem foto</div>' : ''}
          <dl class="kv">
            <dt>CPF</dt><dd>${esc(a.cpf)}</dd><dt>RG</dt><dd>${esc(a.rg || '—')}</dd>
            <dt>Nascimento</dt><dd>${dbr(a.nascimento)}</dd><dt>Estado civil</dt><dd>${esc(a.estado_civil || '—')}</dd>
            ${a.conjuge_nome ? `<dt>Cônjuge</dt><dd>${esc(a.conjuge_nome)} ${a.conjuge_cpf ? '· ' + esc(a.conjuge_cpf) : ''}</dd>` : ''}
            <dt>Telefone</dt><dd>${esc(a.telefone || '—')} ${a.telefone_e164 ? `<a href="https://wa.me/${esc(a.telefone_e164.replace('+',''))}" target="_blank" rel="noopener">WhatsApp</a>` : ''} ${chip(a.whatsapp_status, WA_TXT[a.whatsapp_status])}</dd>
            <dt>E-mail</dt><dd>${esc(a.email || '—')}</dd><dt>Terra</dt><dd>${esc(a.denominacao_terra || '—')}</dd>
            <dt>Endereço</dt><dd>${esc(a.endereco || '—')}</dd><dt>Vencimento</dt><dd>dia ${esc(a.dia_vencimento || '—')}</dd>
            <dt>Contrato</dt><dd>${chip(a.contrato_status)} ${a.contrato_assinado_em ? dhBr(a.contrato_assinado_em) : ''}</dd>
            <dt>Lote rural (PA)</dt><dd>${a.parcela ? 'LT-' + esc(a.parcela) : '<span class="muted">sem vínculo (Mapa → Lotes do PA)</span>'}</dd>
            <dt>Pendências</dt><dd>${esc(a.pendencias || '—')}</dd>
          </dl>
          ${podeEscrever() ? '<div class="row" style="margin-top:10px"><button class="btn btn-ghost btn-sm" id="edAssoc">✏️ Editar dados</button><button class="btn btn-ghost btn-sm" id="edPlano">🔁 Sinal diferente do padrão</button></div>' : ''}
          <div id="edBox"></div>
        </div>
        <div class="card" id="partBox"><h2>👥 Participantes do lote</h2><div class="muted">Carregando…</div></div>
        <div class="card"><h2>Financeiro</h2>
          <div class="kpis" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><div class="l">Contratado</div><div class="v" style="font-size:17px">${brl(d.resumo.contratado)}</div></div>
            <div class="kpi ok"><div class="l">Recebido</div><div class="v" style="font-size:17px">${brl(d.resumo.recebido)}</div></div>
            <div class="kpi ${d.resumo.saldo ? 'red' : 'ok'}"><div class="l">Saldo</div><div class="v" style="font-size:17px">${brl(d.resumo.saldo)}</div></div></div>
          <div class="tbl" style="margin-top:10px"><table><thead><tr><th>Lançamento</th><th>Venc.</th><th class="right">Valor</th><th class="right">Recebido</th><th>Situação</th><th>Boleto (Asaas)</th></tr></thead><tbody>
            ${d.lancamentos.map((l) => `<tr><td>${esc(l.tipo === 'BOLETO' ? 'Boleto ' + l.parcela : l.tipo === 'AVISTA' ? 'À vista' : l.tipo === 'SINAL' ? 'Sinal' : l.tipo)}</td><td>${dbr(l.vencimento)}</td><td class="right">${brl(l.valor)}</td><td class="right">${brl(l.valor_recebido)}</td><td>${chip(l.status_efetivo)}</td><td class="nowrap">${celBoleto(l)}${podeEscrever() && l.saldo > 0.009 && l.valor_recebido < 0.01 && l.status !== 'CANCELADO' ? ` <button class="btn btn-ghost btn-sm" data-dividir="${l.id}" title="Dividir esta parcela em duas ou mais (valores e vencimentos)">✂️ Dividir</button>` : ''}</td></tr>
            <tr class="hide" data-divrow="${l.id}"><td colspan="6"><div data-divbox="${l.id}"></div></td></tr>`).join('')}
          </tbody></table></div>
          <h3>Pagamentos</h3>
          ${d.pagamentos.length ? d.pagamentos.map((p) => `<div class="doc" style="margin-bottom:6px"><b>${dbr(p.pago_em)} · ${esc(p.forma.replace(/_/g,' '))} · ${brl(p.valor)}${p.pagamento_compartilhado ? ' · <span class="chip c-PARCIAL">Pagamento único (rateado)</span>' : ''}</b>
            ${p.pagador_nome ? 'Pagador: ' + esc(p.pagador_nome) : ''}${p.vinculo_pagador ? ' (' + esc(p.vinculo_pagador) + ')' : ''}${p.pagador_cpf_parcial ? ' · CPF ' + esc(p.pagador_cpf_parcial) : ''}
            ${p.id_transacao ? `<div class="muted">ID ${esc(p.id_transacao)}</div>` : ''}${p.url_recibo ? `<div><a href="${esc(p.url_recibo)}" target="_blank" rel="noopener">Recibo InfinitePay ↗</a></div>` : ''}
            ${p.obs ? `<div class="muted">${esc(p.obs)}</div>` : ''}
            <div class="muted">Em: ${p.rateio.map((r) => { const l = d.lancamentos.find((x) => x.id === r.lancamento_id); return `${esc(l ? rotLanc(l) : '#' + r.lancamento_id)} (${brl(r.valor)})`; }).join(' + ')}</div>
            ${podeEscrever() && d.lancamentos.some((l) => l.saldo > 0.009 && l.status !== 'CANCELADO') && p.rateio.some((r) => d.lancamentos.some((x) => x.id === r.lancamento_id)) ? `<button class="btn btn-ghost btn-sm" style="margin-top:6px" data-compensar="${p.id}">🔁 Compensar em outra parcela</button><div data-compbox="${p.id}"></div>` : ''}</div>`).join('') : '<div class="muted">Nenhum pagamento lançado.</div>'}
          ${podeEscrever() && d.resumo.saldo > 0 ? `<button class="btn btn-gold btn-sm" style="margin-top:8px" id="pagarAqui">💰 Lançar pagamento</button>` : ''}
        </div>
        ${S.eu.ve_documentos ? `<div class="card"><h2>Documentos</h2>
          <div class="docs">${d.documentos.map((x) => `<div class="doc ${x.arquivo_presente ? '' : 'aus'}"><b>${esc(tipoDoc[x.tipo] || x.tipo)}${x.versao > 1 ? ' v' + x.versao : ''}</b>${esc(x.nome_original || '')}
            <div style="margin-top:4px">${x.arquivo_presente ? `<button class="btn btn-ghost btn-sm" data-doc="${x.id}">Abrir</button>` : '<span class="muted">arquivo não carregado</span>'}</div></div>`).join('') || '<div class="muted">Nenhum documento.</div>'}</div>
          ${podeEscrever() ? `<div class="row" style="margin-top:10px"><div><label for="upTipo">Tipo</label><select class="f" id="upTipo">${Object.entries(tipoDoc).filter(([k]) => k !== 'CAPA_DOSSIE_LOTE').map(([k, t]) => `<option value="${k}">${t}</option>`).join('')}</select></div>
            <div><label for="upArq">Arquivo (PDF/JPG/PNG)</label><input type="file" id="upArq" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,.heic,.docx"></div>
            <div style="flex:0 0 auto"><button class="btn btn-primary" id="upBtn">Enviar</button></div></div>
            <div class="muted">PDF assinado no gov.br → tipo "Processo assinado" (marca o contrato como ASSINADO).</div>` : ''}
        </div>` : ''}
        ${d.entregas.length ? `<div class="card"><h2>Entregas</h2>${d.entregas.map((e) => `<div>${esc(e.protocolo)} ${chip(e.status)} ${e.entregue_em ? dbr(e.entregue_em) : ''}</div>`).join('')}</div>` : ''}
        <div class="card"><h2>Eventos</h2>
          ${d.eventos.length ? `<div class="tbl"><table><tbody>${d.eventos.map((e) => `<tr><td class="nowrap">${dhBr(e.criado_em)}</td><td>${chip('A_VENCER', e.tipo.replace(/_/g,' '))}</td><td class="muted">${esc(e.usuario || '')}</td></tr>`).join('')}</tbody></table></div>` : '<div class="muted">Sem eventos.</div>'}
        </div>
        ${S.eu.pode_excluir ? `<div style="text-align:right"><button class="btn btn-danger btn-sm" id="delAssoc">Excluir cadastro (sem pagamentos)</button></div>` : ''}
      </div>`;
    $('#dx').onclick = fecharDrawer;
    pane.querySelectorAll('[data-doc]').forEach((b) => b.onclick = () => abrirDoc(b.dataset.doc));
    carregarFoto(d.documentos);
    carregarParticipantes(a.id);
    pane.querySelectorAll('[data-copiar]').forEach((b) => b.onclick = () => copiar(b.dataset.copiar));
    pane.querySelectorAll('[data-romatec]').forEach((b) => b.onclick = () => abrirBoletoRomatec(b));
    pane.querySelectorAll('[data-emitir]').forEach((b) => b.onclick = async () => {
      b.disabled = true;
      try { await api(`/lancamentos/${b.dataset.emitir}/boleto`, { method: 'POST' }); toast('Boleto emitido no Asaas'); abrirAssociado(aid); }
      catch (e){ toast(e.message, true); b.disabled = false; }
    });
    pane.querySelectorAll('[data-cancbol]').forEach((b) => b.onclick = async () => {
      if (!confirm('Cancelar este boleto no Asaas? O associado não vai mais conseguir pagá-lo.')) return;
      try { await api(`/boletos/${b.dataset.cancbol}`, { method: 'DELETE' }); toast('Boleto cancelado'); abrirAssociado(aid); } catch (e){ toast(e.message, true); }
    });
    if ($('#upBtn')) $('#upBtn').onclick = async () => {
      const files = $('#upArq').files;
      if (!files.length) return toast('Escolha o arquivo', true);
      const fd = new FormData(); fd.append('tipo', $('#upTipo').value); for (const f of files) fd.append('arquivo', f);
      $('#upBtn').disabled = true;
      try { const r = await api(`/associados/${aid}/documentos`, { method:'POST', body: fd }); toast(`${r.documentos.length} documento(s) enviado(s)` + (r.falhas.length ? ` · ${r.falhas.length} recusado(s)` : '')); S.assoc = null; abrirAssociado(aid); }
      catch (e){ toast(e.message, true); $('#upBtn').disabled = false; }
    };
    if ($('#edAssoc')) $('#edAssoc').onclick = () => formEditar(a);
    if ($('#edPlano')) $('#edPlano').onclick = () => {
      $('#edBox').innerHTML = `<div class="avisos">Refaz sinal + boletos: ≥ R$ 500 de entrada → 1 boleto com o saldo; abaixo disso → 2 parcelas iguais. Só é permitido enquanto nenhum boleto foi pago.</div>
        <div class="row"><div><label for="novoSinal">Sinal combinado (R$)</label><input id="novoSinal" inputmode="decimal" placeholder="ex.: 400"></div><div style="flex:0 0 auto"><button class="btn btn-primary" id="salvaPlano">Recalcular</button></div></div>`;
      $('#salvaPlano').onclick = async () => { try { await api(`/associados/${aid}/plano`, { json: { sinal: $('#novoSinal').value.replace(',', '.') } }); toast('Plano recalculado'); S.painel = S.lotes = null; abrirAssociado(aid); } catch (e){ toast(e.message, true); } };
    };
    if ($('#pagarAqui')) $('#pagarAqui').onclick = () => { fecharDrawer(); mostrar('financeiro'); setTimeout(() => preSelecionar(a), 50); };
    // v3.164.0: dividir uma parcela (ex.: R$ 350 → R$ 200 hoje + R$ 150 depois)
    pane.querySelectorAll('[data-dividir]').forEach((bt) => bt.onclick = () => {
      const l = d.lancamentos.find((x) => x.id === Number(bt.dataset.dividir));
      const linha = pane.querySelector(`[data-divrow="${l.id}"]`), box = pane.querySelector(`[data-divbox="${l.id}"]`);
      if (!linha.classList.contains('hide')) { linha.classList.add('hide'); box.innerHTML = ''; return; }
      linha.classList.remove('hide');
      const hoje = new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10);
      const parte = (v, dt) => `<div class="row dvparte" style="margin-top:4px"><div><label>Valor (R$)</label><input class="dvv" inputmode="decimal" value="${v}"></div><div><label>Vencimento</label><input class="dvd" type="date" value="${dt}"></div></div>`;
      const metade = Math.round(l.valor * 50) / 100;
      box.innerHTML = `<div style="padding:10px;border:1px dashed var(--gold);border-radius:10px;background:#FBF8EE">
        <div class="muted">Dividir <b>${esc(rotLanc(l))}</b> (${brl(l.valor)}, venc. ${dbr(l.vencimento)}) em partes. A soma tem que dar ${brl(l.valor)}; as parcelas seguintes são renumeradas.</div>
        <div class="dvpartes">${parte(String(metade).replace('.', ','), l.vencimento && l.vencimento > hoje ? l.vencimento : hoje)}${parte(String(Math.round((l.valor - metade) * 100) / 100).replace('.', ','), '')}</div>
        <div class="row" style="margin-top:6px;align-items:center"><button class="btn btn-ghost btn-sm" style="flex:0 0 auto" data-dvmais>＋ parte</button><span class="muted dvsoma" style="flex:1 1 auto"></span></div>
        <label class="citem cpchk"><input type="checkbox" class="dvcanc" checked> Cancelar no Asaas o boleto antigo desta parcela (tem o valor cheio)</label>
        <label class="citem cpchk"><input type="checkbox" class="dvemit" checked> Emitir um boleto para cada parte</label>
        <div class="row" style="margin-top:8px"><button class="btn btn-primary btn-sm" style="flex:0 0 auto" data-dvok>✅ Confirmar divisão</button></div></div>`;
      const num = (t) => Number(String(t).replace(/\./g, '').replace(',', '.')) || 0;
      const ler = () => [...box.querySelectorAll('.dvparte')].map((r) => ({ valor: num(r.querySelector('.dvv').value), vencimento: r.querySelector('.dvd').value }));
      const somar = () => { const s = ler().reduce((t, p) => t + p.valor, 0); const ok = Math.abs(s - l.valor) < 0.01; box.querySelector('.dvsoma').innerHTML = `Soma: <b style="color:${ok ? 'var(--ok)' : 'var(--red)'}">${brl(s)}</b> de ${brl(l.valor)}${ok ? ' ✔️' : ''}`; return ok; };
      box.addEventListener('input', somar); somar();
      box.querySelector('[data-dvmais]').onclick = () => { if (box.querySelectorAll('.dvparte').length >= 6) return toast('No máximo 6 partes', true); box.querySelector('.dvpartes').insertAdjacentHTML('beforeend', parte('', '')); somar(); };
      box.querySelector('[data-dvok]').onclick = async (ev) => {
        const partes = ler();
        if (partes.some((p) => !(p.valor > 0) || !p.vencimento)) return toast('Preencha valor e vencimento de todas as partes', true);
        if (!somar()) return toast(`A soma precisa dar ${brl(l.valor)}`, true);

// v3.147.1: pontinho do sinal na coluna Recebido e a divisão em boletos com o que falta de cada um.
function marcaSinal(si){
  if (!si) return '';
  const rot = si.tipo === 'AVISTA' ? 'à vista' : 'sinal';
  if (si.estado === 'PAGO') return `<div class="sinal"><i class="dot d-ok"></i>${rot} pago</div>`;
  if (si.estado === 'PARCIAL') return `<div class="sinal warn"><i class="dot d-warn"></i>${rot} parcial · falta <b>${brl(si.falta)}</b></div>`;
  return `<div class="sinal neg"><i class="dot d-red"></i>${rot} pendente ${brl(si.falta)}</div>` + (si.boleto ? `<div>${envioTag(si.boleto)}</div>` : '');
}
// v3.147.2: situação do boleto e do envio pelo WhatsApp.
function envioTag(bo){
  if (!bo) return '<span class="etag e-sem" title="Boleto ainda não emitido">🧾 sem boleto</span>';
  const g = `<span class="etag e-ger" title="Boleto gerado em ${esc(dhBr(bo.gerado_em))}">🧾 gerado</span>`;
  return g + (bo.enviado_em ? ` <span class="etag e-env" title="Enviado pelo WhatsApp">📤 enviado ${esc(dhBr(bo.enviado_em))}</span>` : ' <span class="etag e-nao">📤 não enviado</span>');
}
function linhasBoletos(bs){
  if (!bs.length) return '<span class="muted">—</span>';
  return bs.map((b) => {
    const tag = b.falta <= 0 ? '<span class="pos">✓ pago</span>'
      : b.recebido > 0 ? `<span class="warn">pagou ${brl(b.recebido)} · <b>falta ${brl(b.falta)}</b></span>`
      : b.status === 'VENCIDO' ? '<span class="neg">vencido</span>' : '<span class="muted">a vencer</span>';
    return `<div class="bl"><b>P${b.parcela}</b> · ${b.vencimento ? dbr(b.vencimento) : 'sem venc.'} · ${brl(b.valor)} — ${tag}${b.falta > 0 ? ' ' + envioTag(b.boleto) : ''}</div>`;
  }).join('');
}
function listaExtratoFiltrada(){
  const q = EXT.busca.trim().toLowerCase();
  return EXT.dados.lista.filter((x) => (!EXT.sit || (EXT.sit === 'PARCIAL' ? x.parciais > 0 : EXT.sit === 'SEM_BOLETO' ? x.envio.gerados < x.envio.em_aberto : EXT.sit === 'NAO_ENVIADO' ? x.envio.enviados < x.envio.gerados : x.situacao === EXT.sit)) && (!q || x.nome.toLowerCase().includes(q) || x.lote === q.padStart(2, '0') || x.lote === q));
}
function resumoExtratoTexto(){
  const l = listaExtratoFiltrada(), hoje = EXT.dados.posicao_em;
  const filtro = SIT_TXT[EXT.sit] || ({ PARCIAL: 'Pagou parcial', SEM_BOLETO: 'Sem boleto', NAO_ENVIADO: 'Boleto não enviado' })[EXT.sit] || 'Todos os associados';
  const tot = (k) => l.reduce((t, x) => t + x[k], 0);
  return [`📋 *${filtro} — ${S.projetos.find((p) => p.id === S.pid)?.nome || 'PA'}*`, `Posição em ${dbr(hoje)} · ${l.length} associado(s)`, `💰 Em aberto: ${brl(tot('em_aberto'))} · 🔴 Vencido: *${brl(tot('vencido'))}*`, '',
    ...l.slice(0, 40).map((x) => `• Lote ${x.lote} — ${x.nome}: ${x.vencido > 0 ? `*${brl(x.vencido)} vencido*` : brl(x.em_aberto) + ' em aberto'}${x.telefone ? ' · ' + x.telefone : ''}`),
    ...(l.length > 40 ? [`… e mais ${l.length - 40} (lista completa no PDF)`] : []), '', 'Romatec Consultoria Total'].join('\n');
}
function desenharExtrato(){
  let lista = listaExtratoFiltrada();
  const ord = { lote: (a, b) => (parseInt(a.lote, 10) || 0) - (parseInt(b.lote, 10) || 0), nome: (a, b) => a.nome.localeCompare(b.nome), aberto: (a, b) => b.em_aberto - a.em_aberto, vencido: (a, b) => b.vencido - a.vencido, recebido: (a, b) => b.recebido - a.recebido }[EXT.ordem];
  lista = [...lista].sort(ord);
  const soma = (k) => lista.reduce((s, x) => s + x[k], 0);
  if (!lista.length){ $('#exTabela').innerHTML = '<div class="empty">Nenhum associado com esse filtro.</div>'; return; }
  $('#exTabela').innerHTML = `<table><thead><tr><th>Lote</th><th>Associado</th><th class="right">Contratado</th><th class="right">Recebido</th><th class="right">Em aberto</th><th>Divisão</th><th>Boletos — vencimento, valor e envio</th><th class="right">Vencido</th><th>% pago</th><th>Situação</th><th>Últ. pagamento</th></tr></thead><tbody>
    ${lista.map((x) => `<tr class="click" data-ex="${x.associado_id}"><td><b>${esc(x.lote)}</b></td><td>${esc(x.nome)}<div>${chip(x.whatsapp_status, WA_TXT[x.whatsapp_status])}</div></td>
      <td class="right nowrap">${brl(x.contratado)}</td><td class="right nowrap"><span class="pos">${brl(x.recebido)}</span>${marcaSinal(x.sinal)}</td><td class="right nowrap"><b>${brl(x.em_aberto)}</b></td>
      <td class="nowrap"><b>${esc(x.divisao)}</b>${x.qtd_boletos ? `<div class="muted">${x.qtd_boletos} boleto(s)</div>` : ''}${x.envio.em_aberto ? `<div class="muted" title="Boletos em aberto gerados / enviados pelo WhatsApp">🧾 ${x.envio.gerados}/${x.envio.em_aberto} · 📤 ${x.envio.enviados}/${x.envio.gerados}</div>` : ''}</td><td class="nowrap">${linhasBoletos(x.boletos)}</td>
      <td class="right nowrap ${x.vencido > 0 ? 'neg' : 'muted'}">${x.vencido > 0 ? brl(x.vencido) : '—'}</td>
      <td style="min-width:90px"><div class="pbar"><i style="width:${Math.min(100, x.pct_pago)}%"></i></div><span class="muted">${x.pct_pago.toLocaleString('pt-BR')}%</span></td>
      <td>${chip(x.situacao, SIT_TXT[x.situacao])}${x.parciais ? '<div style="margin-top:3px">' + chip('PARCIAL', 'pagou parcial') + '</div>' : ''}</td><td class="nowrap">${x.ultimo_pagamento ? dbr(x.ultimo_pagamento) : '<span class="muted">nunca</span>'}</td></tr>
      ${EXT.abertos.has(x.associado_id) ? `<tr class="det"><td></td><td colspan="10">${x.parcelas.length ? x.parcelas.map((p) => `<div class="row" style="align-items:center;gap:10px;margin:2px 0"><span style="flex:0 0 90px"><b>${esc(p.rotulo)}</b></span><span style="flex:0 0 90px">${p.vencimento ? 'venc. ' + dbr(p.vencimento) : 'sem venc.'}</span><span style="flex:0 0 120px">valor ${brl(p.valor)}</span><span style="flex:0 0 130px" class="pos">pago ${brl(p.recebido)}</span><span style="flex:0 0 130px">saldo <b>${brl(p.saldo)}</b></span>${chip(p.status)}</div>`).join('') : '<span class="muted">Sem parcelas lançadas.</span>'}
        <div style="margin-top:6px"><button class="btn btn-ghost btn-sm" data-abrir="${x.associado_id}">Abrir cadastro</button></div></td></tr>` : ''}`).join('')}</tbody>
    <tfoot><tr><td></td><td>${lista.length} associado(s)</td><td class="right nowrap">${brl(soma('contratado'))}</td><td class="right nowrap pos">${brl(soma('recebido'))}</td><td class="right nowrap">${brl(soma('em_aberto'))}</td><td colspan="2"></td><td class="right nowrap neg">${brl(soma('vencido'))}</td><td colspan="3"></td></tr></tfoot></table>`;
  $('#exTabela').querySelectorAll('tr[data-ex]').forEach((tr) => tr.onclick = () => { const id = Number(tr.dataset.ex); EXT.abertos.has(id) ? EXT.abertos.delete(id) : EXT.abertos.add(id); desenharExtrato(); });
  $('#exTabela').querySelectorAll('[data-abrir]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); abrirAssociado(Number(b.dataset.abrir)); });
}

// v3.185.0: 🧾 Gerar boleto de UM associado (sem boleto ativo). Valor menor que o saldo → pergunta se a
// diferença foi paga por fora (lança o pagamento e o boleto sai com o saldo) ou se é o novo valor da taxa.

  const recebido = a.lancamento.valor - a.lancamento.saldo;
  let m = document.getElementById('cxManual');
  if (!m){ m = document.createElement('div'); m.id = 'cxManual'; m.className = 'cx-manual'; document.body.appendChild(m); }
  m.innerHTML = `<div class="cx-in"><b>🧾 Gerar boleto — ${esc(a.nome)}</b>

let CX = { de: '', ate: '', agrupar: 'mes', cats: null };
/** Barras agrupadas: entradas (verde) x saídas (vermelho) + linha do saldo acumulado. */
function graficoFluxo(periodos){
  if (!periodos.length) return '<div class="empty">Sem movimentos no período.</div>';
  const max = Math.max(1, ...periodos.map((p) => Math.max(p.entradas_associados + p.entradas_avulsas, p.saidas)), ...periodos.map((p) => Math.abs(p.saldo_acumulado)));
  const L = 64, W = Math.max(320, periodos.length * L + 30), H = 200, base = 165, alt = 135;
  const rot = (k) => k.length === 7 ? mesTxt(k) : `${k.slice(8, 10)}/${k.slice(5, 7)}`;
  let g = '', pts = [];
  periodos.forEach((p, i) => {
    const x = 18 + i * L, ent = p.entradas_associados + p.entradas_avulsas;
    const he = ent / max * alt, hs = p.saidas / max * alt;
    g += `<rect x="${x}" y="${(base - he).toFixed(1)}" width="22" height="${he.toFixed(1)}" rx="3" fill="#1f7a4d"><title>${rot(p.periodo)} · entradas ${brl(ent)}</title></rect>`;
    g += `<rect x="${x + 24}" y="${(base - hs).toFixed(1)}" width="22" height="${hs.toFixed(1)}" rx="3" fill="#B3261E"><title>${rot(p.periodo)} · saídas ${brl(p.saidas)}</title></rect>`;
    g += `<text x="${x + 23}" y="${base + 15}" font-size="10" text-anchor="middle" fill="#6A6656">${esc(rot(p.periodo))}</text>`;
    pts.push([x + 23, base - Math.max(0, p.saldo_acumulado) / max * alt, p]);
  });
  const linha = pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  const bolas = pts.map(([x, y, p]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="#C9A84C"><title>saldo acumulado ${brl(p.saldo_acumulado)}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:210px" role="img"><line x1="6" y1="${base}" x2="${W - 6}" y2="${base}" stroke="#DCD5C2"/>${g}<polyline points="${linha}" fill="none" stroke="#C9A84C" stroke-width="2"/>${bolas}</svg>
    <div class="leg"><span><i style="background:#1f7a4d"></i>Entradas</span> <span><i style="background:#B3261E"></i>Saídas</span> <span><i style="background:#C9A84C"></i>Saldo acumulado</span></div>`;
}

// ─── Boletos (Asaas) ────────────────────────────────────────────────────
let BOL = { aid: null, nome: '', lista: [] };
async function rBoletos(){
  try {
    const st = await api('/asaas/status');
    $('#asaasStatus').innerHTML = st.configurado
      ? `${chip('VALIDO', 'Asaas ' + (st.ambiente === 'producao' ? 'produção' : 'SANDBOX (teste)'))} ${st.webhook_configurado ? chip('VALIDO', 'baixa automática ativa') : chip('INEXISTENTE', 'webhook sem token')}`
      : chip('INEXISTENTE', 'Asaas não configurado (ASAAS_API_KEY)');
    if (!st.configurado && $('#bEmitir')) $('#bEmitir').disabled = true;
  } catch { $('#asaasStatus').textContent = ''; }
  const listar = async () => {
    try {
      // v3.144.9: padrão esconde os cancelados (histórico fica em "Todos" / "CANCELADO").
      const f = $('#bFiltro').value;
      const resp = await api(`/projetos/${S.pid}/boletos${f && f !== 'TODOS' ? '?status=' + f : ''}`);
      const todos = f ? resp.boletos : resp.boletos.filter((b) => b.status !== 'CANCELADO');
      BOL.lista = resp.boletos;
      const boletos = BOL.aid ? todos.filter((b) => b.associado_id === BOL.aid) : todos;
      $('#bolBox').innerHTML = boletos.length ? `<div class="muted" style="margin-bottom:6px">${boletos.length} boleto(s) · ${brl(boletos.reduce((s, b) => s + b.valor, 0))}</div><table class="tcard"><thead><tr><th>Lote · Associado</th><th>Parcela</th><th>Venc.</th><th class="right">Valor</th><th>Status</th><th></th></tr></thead><tbody>
        ${boletos.map((b) => `<tr><td class="tc-tit"><b>LT ${esc(b.lote)}</b> · ${esc(b.associado_nome)}</td><td data-l="Parcela">${esc(b.tipo === 'BOLETO' ? 'Parcela ' + b.parcela : b.tipo === 'SINAL' ? 'Sinal' : b.tipo === 'MARCO' ? 'Taxa de marcos' : b.tipo)}</td><td data-l="Vencimento">${dbr(b.vencimento)}</td>
          <td class="right nowrap" data-l="Valor">${brl(b.valor)}</td><td data-l="Status">${chip(b.status)}${b.ambiente === 'sandbox' ? ' ' + chip('A_VENCER', 'teste') : ''}${b.pago_em ? ' <span class="muted">' + dbr(b.pago_em).slice(0, 10) + '</span>' : ''}</td>
          <td class="bol-acoes">${b.linha_digitavel && b.status !== 'CANCELADO' ? `<button class="btn btn-gold btn-sm" data-romatec="${b.id}" data-url="${esc(b.url_romatec || '')}" title="Carnê Romatec (mesmo código de barras e Pix do Asaas)">🧾 PDF</button>` : ''}
            ${b.linha_digitavel ? `<button class="btn btn-ghost btn-sm" data-copiar="${esc(b.linha_digitavel)}">Linha</button>` : ''}
            ${b.pix_copia_cola ? `<button class="btn btn-ghost btn-sm" data-copiar="${esc(b.pix_copia_cola)}">Pix</button>` : ''}
            ${podeEscrever() && (b.status === 'PENDENTE' || b.status === 'VENCIDO') ? `<button class="btn btn-primary btn-sm" data-envbol="${b.id}" title="Enviar este boleto no WhatsApp do associado">📲 ${b.enviado_em ? 'Reenviar' : 'Enviar'}</button>${b.enviado_em ? ` <span class="muted" style="font-size:11px">enviado ${esc(dhBr(b.enviado_em))}</span>` : ''} <button class="btn btn-danger btn-sm" data-cancbol="${b.id}">Cancelar</button>` : ''}</td></tr>`).join('')}</tbody></table>` : `<div class="empty">${BOL.aid ? 'Nenhum boleto deste associado com esse status.' : 'Nenhum boleto emitido.'}</div>`;
      $('#bolBox').querySelectorAll('[data-envbol]').forEach((bt) => bt.onclick = async () => {
        const b = boletos.find((x) => x.id === Number(bt.dataset.envbol)); if (!b) return;
        const r = prompt(`Enviar o boleto de ${b.associado_nome} — ${b.tipo === 'BOLETO' ? 'parcela ' + b.parcela : b.tipo === 'MARCO' ? 'taxa de marcos' : b.tipo.toLowerCase()} de ${brl(b.valor)}.\n\nDeixe EM BRANCO para mandar no WhatsApp cadastrado, ou digite outro número:`, '');
        if (r === null) return;
        const d = r.replace(/\D/g, '');
        if (d && d.length < 10) return toast('Número incompleto (DDD + número)', true);
        const numero = d ? (d.length <= 11 ? '55' + d : d) : '';
        bt.disabled = true;
        try { await api(`/associados/${b.associado_id}/whatsapp/cobranca`, { json: { lancamento_ids: [b.lancamento_id], numero: numero || undefined } }); toast(`Boleto enviado para ${b.associado_nome.split(' ')[0]} ✅`); listar(); }
        catch (e){ toast(e.message, true); bt.disabled = false; }
      });
      $('#bolBox').querySelectorAll('[data-copiar]').forEach((b) => b.onclick = () => copiar(b.dataset.copiar));
      $('#bolBox').querySelectorAll('[data-romatec]').forEach((b) => b.onclick = () => abrirBoletoRomatec(b));
      $('#bolBox').querySelectorAll('[data-cancbol]').forEach((b) => b.onclick = async () => {
        if (!confirm('Cancelar este boleto no Asaas?')) return;
        try { await api(`/boletos/${b.dataset.cancbol}`, { method: 'DELETE' }); toast('Boleto cancelado'); listar(); } catch (e){ toast(e.message, true); }
      });
    } catch (e){ $('#bolBox').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  };
  $('#bFiltro').onchange = listar;
  // v3.186.0: seletor de associado (toque → lista; digite → filtra; escolha → só os boletos dele, com 📲 Enviar)
  const inp = $('#bAssoc'), res = $('#bAssocRes');
  const mostrarSel = () => { $('#bAssocSel').innerHTML = BOL.aid ? `<span class="chip c-VALIDO" style="font-size:13px">Só: ${esc(BOL.nome)}</span> <button class="btn btn-ghost btn-sm" id="bAssocLimpar">✕ Todos</button>` : '';
    if ($('#bAssocLimpar')) $('#bAssocLimpar').onclick = () => { BOL.aid = null; BOL.nome = ''; inp.value = ''; mostrarSel(); listar(); }; };
  const abrirLista = () => {
    const q = semAcento(inp.value.trim());
    const mapa = new Map();
    for (const b of BOL.lista || []) if (!mapa.has(b.associado_id)) mapa.set(b.associado_id, { id: b.associado_id, nome: b.associado_nome || '', lote: b.lote || '', abertos: 0 });
    for (const b of BOL.lista || []) if (b.status === 'PENDENTE' || b.status === 'VENCIDO') mapa.get(b.associado_id).abertos++;
    const ls = [...mapa.values()].filter((a) => !q || semAcento(a.nome).includes(q) || String(a.lote) === q.replace(/\D/g, '').padStart(2, '0'))
      .sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')).slice(0, 80);
    res.innerHTML = ls.length ? ls.map((a) => `<button type="button" class="pg-op" data-bass="${a.id}"><b>${esc(a.nome)}</b> <span class="muted">· lote ${esc(a.lote)} · ${a.abertos ? a.abertos + ' boleto(s) em aberto' : 'sem boleto em aberto'}</span></button>`).join('') : '<div class="muted" style="padding:8px">Ninguém com esse nome nos boletos.</div>';
    res.querySelectorAll('[data-bass]').forEach((b) => b.onmousedown = (ev) => { ev.preventDefault(); const a = mapa.get(Number(b.dataset.bass)); BOL.aid = a.id; BOL.nome = a.nome; inp.value = ''; res.innerHTML = ''; inp.blur(); mostrarSel(); listar(); });
  };
  inp.onfocus = abrirLista; inp.oninput = abrirLista;
  inp.onblur = () => setTimeout(() => { res.innerHTML = ''; }, 150);
  mostrarSel();
  if ($('#bSync')) $('#bSync').onclick = async () => {
    const b = $('#bSync'); b.disabled = true; $('#bSyncBox').innerHTML = '<div class="muted" style="margin-top:6px">Consultando o Asaas…</div>';
    try {
      const r = await api(`/projetos/${S.pid}/boletos/sincronizar`, { method: 'POST' });
      const nome = { baixado: 'pago → baixa feita', pago_sem_saldo: 'pago (parcela já estava quitada — conferir devolução)', 'status:VENCIDO': 'vencido', 'status:CANCELADO': 'cancelado no Asaas', 'status:ESTORNADO': 'estornado — conferir' };
      $('#bSyncBox').innerHTML = `<div class="avisos" style="margin-top:6px">🔄 ${r.consultados} boleto(s) consultado(s) · ${chip('PAGO', r.baixados + ' baixa(s)')} ${chip('VENCIDO', r.vencidos + ' vencido(s)')} ${chip('CANCELADO', r.cancelados + ' cancelado(s)')} ${r.estornados ? chip('ESTORNADO', r.estornados + ' estornado(s)') : ''} · ${r.sem_mudanca} sem mudança
        ${r.detalhes.length ? '<div style="margin-top:4px">' + r.detalhes.map((x) => `Lote ${esc(x.lote)} — ${esc(x.associado)}: ${esc(nome[x.acao] || x.acao)}`).join('<br>') + '</div>' : ''}
        ${r.erros.length ? '<div style="margin-top:4px;color:var(--red)">' + r.erros.map((x) => `Lote ${esc(x.lote)}: ${esc(x.erro)}`).join('<br>') + '</div>' : ''}</div>`;
      if (r.baixados) { S.painel = S.lotes = S.assoc = null; }
      listar();
    } catch (e){ $('#bSyncBox').innerHTML = `<div class="avisos" style="margin-top:6px;color:var(--red)">${esc(e.message)}</div>`; }
    finally { b.disabled = false; }
  };
  if ($('#bEmitir')) $('#bEmitir').onclick = async () => {
    const b = $('#bEmitir');
    try {
      const { lancamentos } = await api(`/projetos/${S.pid}/boletos/elegiveis?ate=${encodeURIComponent($('#bAte').value)}&tipos=${encodeURIComponent($('#bTipos').value)}`);
      if (!lancamentos.length) return toast('Nenhuma parcela em aberto sem boleto nesse período');
      const total = lancamentos.reduce((s, l) => s + l.saldo, 0);
      if (!confirm(`Emitir ${lancamentos.length} boleto(s) no Asaas, total ${brl(total)}?\n\nCada boleto fica registrado no banco com o CPF e o endereço do associado.`)) return;
      b.disabled = true;
      let ok = 0; const falhas = [];
      for (const [k, l] of lancamentos.entries()) {
        $('#bProg').innerHTML = `<div class="prog"><i style="width:${Math.round(k / lancamentos.length * 100)}%"></i></div><div class="muted">Emitindo ${k + 1}/${lancamentos.length} — Lote ${esc(l.lote)} ${esc(l.nome)}</div>`;
        try { await api(`/lancamentos/${l.id}/boleto`, { method: 'POST' }); ok++; }
        catch (e){ falhas.push(`Lote ${l.lote} — ${l.nome}: ${e.message}`); if (['ASAAS_NAO_CONFIGURADO', 'ASAAS_CHAVE_INVALIDA', 'CEP_NAO_CONFIGURADO'].includes(e.codigo)) break; }
      }
      $('#bProg').innerHTML = `<div class="avisos">🧾 ${ok} boleto(s) emitido(s)${falhas.length ? ` · ${falhas.length} falha(s):<ul>${falhas.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>` : '.'}</div>`;
      listar();
    } catch (e){ toast(e.message, true); }
    finally { b.disabled = false; }
  };
  listar();
}

function ligarListaVertices(d, lo){

function cartaoPontoCampo(d, id, podeMarcar, eng){
  const p = d.pontos.find((x) => x.nome === id); if (!p) return;
  const m = p.marca;
  const podeDesfazer = m && (S.eu.perfil === 'ADMIN' || (String(m.usuario_id) === String(S.eu.id || '') ));
  $('#cpCard').innerHTML = `<div class="ml-card"><div class="muted">${esc(p.tipo)}${p.existente ? ' · já existe no chão' : ''}</div>
    <div class="ml-tit">${esc(p.nome)}</div>
    <div>E ${nbr(p.E, 3)} · N ${nbr(p.N, 3)} · lotes ${p.lotes.map((x) => 'LT-' + esc(x)).join(', ') || '—'}${p.implantar_com ? ` · implantar com LT-${esc(p.implantar_com)}` : ''}</div>
    ${m ? `<div class="avisos" style="margin-top:8px">✅ Locado em <b>${hBr(m.marcado_em)}</b> por <b>${esc(m.usuario_nome || '—')}</b>${m.base ? `<br>${esc(m.base)} · ${esc(m.rover || '')}` : ''}${m.gps ? `<br>GPS do celular ±${m.gps.precisao ?? '?'} m` : ''}${m.obs ? `<br>Obs.: ${esc(m.obs)}` : ''}</div>
        ${podeMarcar ? '<button class="btn btn-ghost btn-sm" id="cpDesf" style="margin-top:6px">↩️ Desfazer marcação</button>' : ''}`
      : podeMarcar ? `<input id="cpObs" placeholder="Observação (opcional)" style="margin-top:8px;width:100%"><button class="btn btn-primary" id="cpSalvar" style="margin-top:8px;width:100%;font-size:16px;padding:12px">✅ Salvar marcado</button>` : ''}</div>`;
  if ($('#cpSalvar')) $('#cpSalvar').onclick = async () => {
    const b = $('#cpSalvar'); b.disabled = true; b.textContent = 'Salvando…';
    const gps = await new Promise((ok) => { if (!navigator.geolocation) return ok(null); navigator.geolocation.getCurrentPosition((g) => ok({ lat: g.coords.latitude, lon: g.coords.longitude, precisao: Math.round(g.coords.accuracy) }), () => ok(null), { enableHighAccuracy: true, timeout: 6000, maximumAge: 30000 }); });
    try {
      const r = await api(`/projetos/${S.pid}/campo/pontos`, { json: { ponto: p.nome, gps, obs: $('#cpObs') ? $('#cpObs').value : '', base: $('#cpBase').value, rover: $('#cpRover').value } });
      toast(`${p.nome} marcado ✅`);
      r.lotes_fechados.forEach((f) => toast(`🎉 LT-${f.lote} fechado como MEDIDO (${nbr(f.area_ha, 4)} ha)${f.associado ? ' — ' + f.associado : ''}`));
      CP.ponto = r.lotes_fechados.length ? null : p.nome;
      rLocacao($('#cpBox'));
    } catch (e){ toast(e.message, true); b.disabled = false; b.textContent = '✅ Salvar marcado'; }
  };
  if ($('#cpDesf')) $('#cpDesf').onclick = async () => {
    if (!confirm(`Desfazer a marcação do ${p.nome}?${p.lotes.length ? ' O lote volta para "em andamento".' : ''}`)) return;
    try { await api(`/projetos/${S.pid}/campo/pontos/${encodeURIComponent(p.nome)}`, { method: 'DELETE' }); toast('Marcação desfeita'); rLocacao($('#cpBox')); } catch (e){ toast(e.message, true); }
  };
  void podeDesfazer; void eng;
}

const ST_DOSSIE = { AGUARDANDO_PAGAMENTO: ['VENCIDO', '⏳ aguardando pagamento'], PRONTO: ['PARCIAL', '🟡 pronto — aguardando sua aprovação'], ENVIADO: ['VALIDO', '📲 enviado'], ENTREGUE: ['PAGO', '✅ entregue fisicamente'] };

      <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:10px">
