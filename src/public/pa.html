<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão de PA — Romatec</title>
<!-- v3.142.0 — Módulo Gestão de PA / Loteamentos. Identidade do manual do PA:
     #0C3320 (verde), #C9A84C (ouro), #B3261E (alerta), #FFF4DC (creme). -->
<style>
  :root{
    --green:#0C3320;--green2:#14472B;--gold:#C9A84C;--gold-soft:#E3D19A;--red:#B3261E;--cream:#FFF4DC;
    --paper:#f4f1e8;--ink:#1C1C18;--muted:#6A6656;--line:#DCD5C2;--ok:#1f7a4d;--warn:#a07a10;--blue:#2b5f8a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Liberation Sans',Arial,Helvetica,sans-serif;background:var(--paper);color:var(--ink);-webkit-text-size-adjust:100%}
  header{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;padding:14px 18px 0;position:sticky;top:0;z-index:20}
  header .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  header .kick{color:var(--gold-soft);letter-spacing:2px;text-transform:uppercase;font-size:10px;margin:0}
  header h1{margin:2px 0 0;font-size:18px}
  header select{background:transparent;color:#fff;border:1px solid var(--gold);border-radius:8px;padding:6px 8px;font-size:13px;max-width:280px}
  header select option{color:var(--ink)}
  .versao{font-size:11px;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(201,168,76,.6);border-radius:8px;padding:4px 9px;white-space:nowrap;line-height:1.3}
  .versao b{color:var(--gold)}
  .perfil{font-size:11px;border:1px solid var(--gold);color:var(--gold-soft);border-radius:12px;padding:2px 8px;white-space:nowrap}
  nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
  nav.tabs button{background:transparent;border:0;color:#d9e6dd;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
  nav.tabs button.on{color:#fff;border-bottom-color:var(--gold)}
  .wrap{max-width:1180px;margin:0 auto;padding:16px}
  /* v3.145.0: cabeçalho com navegação + painel moderno */
  .navbtn{background:rgba(255,255,255,.1);color:#fff;border:1px solid var(--gold);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;font-family:inherit}
  .navbtn:hover{background:rgba(201,168,76,.25)}
  .navbtn.fechar{background:var(--gold);color:var(--green);border-color:var(--gold)}
  .titulo{display:flex;align-items:center;gap:10px}
  .titulo img{height:42px;width:42px;border-radius:50%;background:#fff;padding:2px}
  .hero{position:relative;display:flex;align-items:center;gap:18px;background:linear-gradient(120deg,#0C3320 0%,#14472B 55%,#1e5a36 100%);color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:14px;overflow:hidden;box-shadow:0 6px 18px rgba(12,51,32,.25)}
  .hero:after{content:'';position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.28),transparent 70%)}
  .hero-emb{width:96px;height:96px;border-radius:50%;background:#fff;padding:3px;flex:0 0 auto;box-shadow:0 0 0 3px var(--gold)}
  .hero-txt{flex:1 1 auto;min-width:0;position:relative;z-index:1}
  .hero-kick{color:var(--gold-soft);font-size:11px;letter-spacing:2px;text-transform:uppercase}
  .hero h2{color:#fff;border:0;margin:2px 0 2px;padding:0;font-size:26px;letter-spacing:.5px}
  .hero-sub{color:#d9e6dd;font-size:13px}
  .hero-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .hero-chips span{background:rgba(255,255,255,.12);border:1px solid rgba(201,168,76,.5);border-radius:14px;padding:3px 10px;font-size:12px}
  .hero-chips span.warn{background:rgba(179,38,30,.35);border-color:#e7a29c}
  .hero-bras{height:118px;width:auto;flex:0 0 auto;position:relative;z-index:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
  @media(max-width:700px){.hero{flex-wrap:wrap}.hero-bras{height:84px}.hero-emb{width:72px;height:72px}.hero h2{font-size:21px}}
  .kpis2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
  .k2{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:14px;padding:13px 14px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-top:4px solid var(--gold)}
  .k2.ok{border-top-color:var(--ok)} .k2.red{border-top-color:var(--red)}
  .k2i{font-size:20px;width:38px;height:38px;border-radius:10px;background:var(--cream);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .k2 .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
  .k2 .v{font-size:20px;font-weight:800;color:var(--green);margin:2px 0}
  .k2.red .v{color:var(--red)}
  .bar2{height:7px;background:#ece7d8;border-radius:5px;overflow:hidden;margin:4px 0}
  .bar2 i{display:block;height:100%;background:linear-gradient(90deg,#1f7a4d,#C9A84C)}
  .grid3c{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:900px){.grid3c{grid-template-columns:1fr}}
  .rosca{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
  .rosca svg{width:150px;height:150px;flex:0 0 auto}
  .vleg{flex-direction:column;gap:5px}
  .vleg b{color:var(--green)}
  .medl{display:flex;align-items:center;gap:10px;margin:7px 0}
  .medl span{width:100px}
  .mini-k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mini-k div{background:var(--cream);border-radius:10px;padding:10px;text-align:center}
  .mini-k b{display:block;font-size:22px;color:var(--green)}
  .mini-k span{font-size:11px;color:var(--muted)}
  .pchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
  .citem{display:block;font-size:13px;margin:2px 0;cursor:pointer}
  .citem input{margin-right:4px;vertical-align:middle}
  .pchip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--ink)}
  .pchip b{color:var(--red);margin-left:3px}
  .pchip.on{background:var(--green);color:#fff;border-color:var(--green)}
  .pchip.on b{color:var(--gold-soft)}
  /* v3.145.2: brasão no espaço vazio do canto inferior direito (depois da Rua 08 diagonal) */
  .memo-t{text-align:justify;line-height:1.55;font-size:13px}
  .mapa-bras{position:absolute;right:3%;bottom:3%;width:16%;max-width:210px;height:auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.3));pointer-events:none}
  #mapaBox{position:relative}
  .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
  h2{color:var(--green);font-size:16px;margin:0 0 10px;border-bottom:2px solid var(--gold);padding-bottom:6px}
  h3{color:var(--green);font-size:14px;margin:14px 0 8px}
  label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px;font-weight:700}
  input,textarea,select.f{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
  textarea{min-height:60px;resize:vertical}
  .btn{border:0;border-radius:8px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn-primary{background:var(--green);color:#fff}
  .btn-gold{background:var(--gold);color:var(--green)}
  .btn-ghost{background:#fff;color:var(--green);border:1px solid var(--gold)}
  .btn-danger{background:#fff;color:var(--red);border:1px solid var(--red)}
  .btn-sm{padding:6px 10px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
  .row>*{flex:1 1 160px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
  .muted{color:var(--muted);font-size:12px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .kpi{background:#fff;border-radius:12px;padding:14px;border-left:5px solid var(--gold);box-shadow:0 2px 6px rgba(0,0,0,.05)}
  .kpi .v{font-size:22px;font-weight:800;color:var(--green);margin-top:4px}
  .kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
  .kpi.red{border-left-color:var(--red)} .kpi.red .v{color:var(--red)}
  .kpi.ok{border-left-color:var(--ok)}
  .stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:#eee;margin:8px 0}
  .stack i{display:block;height:100%}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;padding:7px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
  td{padding:7px 6px;border-bottom:1px solid #eee8d8;vertical-align:top}
  tr.click{cursor:pointer} tr.click:hover td{background:var(--cream)}
  .tbl{overflow-x:auto}
  .chip{display:inline-block;border-radius:12px;padding:2px 8px;font-size:11px;font-weight:700;border:1px solid var(--line);background:#faf7ee;color:var(--green2);white-space:nowrap}
  .c-PAGO,.c-QUITADO,.c-EM_DIA,.c-ASSINADO,.c-MEDIDO,.c-PROCESSADO,.c-ENTREGUE{background:#e6f4ec;color:var(--ok);border-color:#b9e0c9}
  .c-PARCIAL,.c-SINAL_PARCIAL,.c-AGENDADA,.c-ENVIADO,.c-PREPARADA{background:#fdf4dd;color:var(--warn);border-color:#f0dfa8}
  .c-A_PAGAR,.c-SINAL_PENDENTE,.c-VENCIDO,.c-RETIDA_PAGAMENTO{background:#fbe9e7;color:var(--red);border-color:#f1c2bd}
  .c-A_VENCER,.c-GERADO,.c-PENDENTE{background:#f1efe8;color:var(--muted)}
  .c-INSTITUCIONAL{background:#e8eef5;color:var(--blue);border-color:#c5d5e6}
  .c-VALIDO{background:#e6f4ec;color:var(--ok);border-color:#b9e0c9}
  .c-INEXISTENTE,.c-CANCELADO,.c-ESTORNADO{background:#fbe9e7;color:var(--red);border-color:#f1c2bd}
  .c-EM_ATRASO{background:#fbe9e7;color:var(--red);border-color:#f1c2bd} .c-SEM_PLANO{background:#f1efe8;color:var(--muted)}
  .grid21{display:grid;grid-template-columns:2fr 1fr;gap:14px} @media (max-width:800px){.grid21{grid-template-columns:1fr}}
  .av{width:36px;height:48px;border-radius:6px;object-fit:cover;border:2px solid var(--gold-soft);background:#f1efe8;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#9c967f;vertical-align:middle}
  .ctframe{width:100%;height:580px;border:1px solid var(--line);border-radius:10px;background:#e9e5d9}
  @media (min-width:801px){.ctgrid{grid-template-columns:3fr 2fr}}
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .pbar{height:7px;background:#efeadb;border-radius:4px;overflow:hidden;min-width:60px}.pbar i{display:block;height:100%;background:var(--ok)}
  tr.det td{background:#fbfaf5;font-size:12px} tfoot td{font-weight:800;border-top:2px solid var(--line)}
  .neg{color:var(--red)} .pos{color:var(--ok)} .warn{color:var(--warn)}
  .sinal{font-size:11px;margin-top:3px;color:var(--ok);font-weight:600} .sinal.warn{color:var(--warn)} .sinal.neg{color:var(--red)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle} .d-ok{background:var(--ok)} .d-warn{background:var(--warn)} .d-red{border:2px solid var(--red);width:6px;height:6px}
  .bl{font-size:12px;line-height:1.8}
  .etag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:9px;padding:0 6px;border:1px solid var(--line);white-space:nowrap}
  .e-sem{background:#f1efe8;color:var(--muted)} .e-ger{background:#e8eef5;color:var(--blue);border-color:#c5d5e6} .e-env{background:#e6f4ec;color:var(--ok);border-color:#b9e0c9} .e-nao{background:#fdf4dd;color:var(--warn);border-color:#f0dfa8}
  .c-SEM_TELEFONE,.c-NAO_VERIFICADO{background:#f1efe8;color:var(--muted)}
  .prog{height:10px;background:#eee;border-radius:6px;overflow:hidden;margin:8px 0}
  .prog i{display:block;height:100%;background:var(--green);transition:width .2s}
  .right{text-align:right} .nowrap{white-space:nowrap}
  .empty{text-align:center;color:var(--muted);padding:26px 10px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--green);color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw}
  .toast.err{background:var(--red)}
  .avisos{background:var(--cream);border:1px solid var(--gold-soft);border-radius:8px;padding:8px 10px;font-size:12px;margin:8px 0}
  .avisos li{margin:2px 0}
  /* drawer do associado */
  .drawer{position:fixed;inset:0;background:rgba(12,51,32,.45);z-index:50;display:none}
  .drawer.on{display:block}
  .drawer .pane{position:absolute;right:0;top:0;bottom:0;width:min(760px,100vw);background:var(--paper);overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
  .drawer .phead{background:var(--green);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .drawer .phead .x{background:transparent;border:1px solid var(--gold);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;font-size:13px}
  /* v3.144.4: foto 3x4 do associado na ficha */
  .foto3x4{float:right;width:96px;height:128px;margin:0 0 8px 12px;border-radius:8px;border:2px solid var(--gold);background:#f1efe8 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-align:center;overflow:hidden}
  .foto3x4 img{width:100%;height:100%;object-fit:cover;display:block}
  .kv dt{color:var(--muted);font-weight:700} .kv dd{margin:0;word-break:break-word}
  @media(max-width:600px){.kv{grid-template-columns:1fr}}
  .docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .doc{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;font-size:12px}
  .doc.aus{opacity:.6;border-style:dashed}
  .doc b{display:block;color:var(--green);font-size:11px;margin-bottom:2px}
  /* mapa */
  #mapaSvg{width:100%;height:auto;background:#fbfaf5;border:1px solid var(--line);border-radius:10px;touch-action:manipulation}
  #mapaSvg .lote{cursor:pointer}
  #mapaSvg .lote:hover polygon{stroke:#C9A84C;stroke-width:1.1}
  #mapaSvg .mt{font-family:'Liberation Sans',Arial,sans-serif;font-weight:700;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
  #mapaBox:fullscreen{background:#fff;padding:10px;overflow:auto}
  #mapaBox:fullscreen #mapaSvg{height:100%}
  .leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin:8px 0}
  .leg span{display:inline-flex;align-items:center;gap:5px}
  .leg i{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.2)}
  .nota{font-size:11px;color:var(--muted);font-style:italic;margin-top:6px}
  .pre{font-family:ui-monospace,Consolas,monospace;font-size:11px;word-break:break-all;background:#f6f3ea;border-radius:6px;padding:6px}
  .hide{display:none!important}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="titulo">
      <button class="navbtn hide" id="btnVoltar" title="Voltar para a tela anterior">← Voltar</button>
      <img id="hdrEmblema" class="hide" alt="Emblema do PA">
      <div>
        <p class="kick">Romatec · ZAYRA</p>
        <h1>🌾 Gestão de PA / Loteamentos</h1>
      </div>
    </div>
    <div class="row" style="flex:0 0 auto;align-items:center">
      <span class="versao" id="versaoChip" title="Versão e horário do último deploy (package.json via /api/version)">…</span>
      <select id="selProjeto" aria-label="Projeto"></select>
      <span class="perfil" id="perfilChip">…</span>
      <a href="/obras.html" class="navbtn fechar" title="Fechar e voltar para a Gestão da ZAYRA">✕ Voltar à Gestão</a>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-t="painel" class="on">📊 Painel</button>
    <button data-t="mapa">🗺️ Mapa</button>
    <button data-t="associados">👥 Associados</button>
    <button data-t="financeiro">💰 Financeiro</button>
    <button data-t="carteirinhas">🪪 Carteirinhas</button>
    <button data-t="campo">📡 Campo</button>
    <button data-t="importar" data-admin="1">📥 Importar / Exportar</button>
  </nav>
</header>

<div class="wrap">
  <section id="v-painel"></section>
  <section id="v-mapa" class="hide"></section>
  <section id="v-associados" class="hide"></section>
  <section id="v-financeiro" class="hide"></section>
  <section id="v-carteirinhas" class="hide"></section>
  <section id="v-campo" class="hide"></section>
  <section id="v-importar" class="hide"></section>
</div>

<div class="drawer" id="drawer"><div class="pane" id="drawerPane"></div></div>

<script>
(function(){
'use strict';
// ─── infra ──────────────────────────────────────────────────────────────
const $ = (s, el) => (el || document).querySelector(s);
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const brl = (v) => Number(v || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
const dbr = (iso) => iso ? `${iso.slice(8,10)}/${iso.slice(5,7)}/${iso.slice(0,4)}${iso.length > 10 ? ' ' + iso.slice(11,16) : ''}` : '—';
const chip = (s, txt) => s ? `<span class="chip c-${esc(s)}">${esc(txt || String(s).replace(/_/g,' '))}</span>` : '';
function toast(msg, err){ const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 3200); }

async function api(path, opts){
  opts = opts || {}; opts.credentials = 'include';
  if (opts.json !== undefined){ opts.method = opts.method || 'POST'; opts.headers = Object.assign({ 'Content-Type':'application/json' }, opts.headers || {}); opts.body = JSON.stringify(opts.json); delete opts.json; }
  const r = await fetch('/api/pa' + path, opts);
  if (r.status === 401){ location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search); throw new Error('não autenticado'); }
  const ct = r.headers.get('content-type') || '';
  if (!ct.includes('application/json')){ if (!r.ok) throw new Error('HTTP ' + r.status); return r; }
  const j = await r.json();
  if (!r.ok){ const e = new Error(j.erro || ('HTTP ' + r.status)); e.codigo = j.codigo; e.detalhe = j.detalhe; throw e; }
  return j;
}
async function baixar(path, nome){
  const r = await api(path);
  const blob = await r.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = nome || ''; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
// v3.144.0: boleto com layout Romatec — abre o link público (o mesmo que vai no WhatsApp).
async function abrirBoletoRomatec(btn){
  const janela = window.open('about:blank', '_blank');
  try {
    let url = btn.dataset.url;
    if (!url) { url = (await api(`/boletos/${btn.dataset.romatec}/link`, { method: 'POST' })).url_romatec; btn.dataset.url = url; }
    if (janela) janela.location.href = url; else window.open(url, '_blank');
  } catch (e){ if (janela) janela.close(); toast(e.message, true); }
}
// v3.144.4: foto 3x4 (documento FOTO_3X4 mais recente com arquivo) — leitura auditada no servidor.
async function carregarFoto(docs){
  const box = $('#fotoBox');
  if (!box) return;
  const foto = (docs || []).filter((x) => x.tipo === 'FOTO_3X4' && x.arquivo_presente).sort((a, b) => b.versao - a.versao)[0];
  if (!foto) return;
  box.textContent = 'carregando…';
  try {
    const r = await api('/documentos/' + foto.id);
    const url = URL.createObjectURL(await r.blob());
    box.innerHTML = '';
    const img = document.createElement('img');
    img.alt = 'Foto 3x4'; img.src = url; img.onload = () => setTimeout(() => URL.revokeObjectURL(url), 60000);
    box.appendChild(img);

const CORES_FORMA = { PIX:'#1f7a4d', ESPECIE:'#C9A84C', CARTAO_DEBITO:'#2b5f8a', CARTAO_CREDITO:'#5b7fb0', BOLETO:'#14472B', MISTO:'#B3261E' };
const MES_ABR = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const mesTxt = (ym) => { const [a, m] = String(ym).split('-'); return `${MES_ABR[Number(m) - 1] || m}/${String(a).slice(2)}`; };
const kfmt = (v) => v >= 1000 ? (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + 'k' : String(Math.round(v));

/** Rosca SVG: segs = [{v, cor, rotulo}] */
function rosca(segs, centro, sub){
  const tot = segs.reduce((s, x) => s + x.v, 0) || 1;
  const R = 52, C = 2 * Math.PI * R; let off = 0;
  const arcos = segs.filter((x) => x.v > 0).map((x) => { const l = x.v / tot * C; const a = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${x.cor}" stroke-width="20" stroke-dasharray="${l.toFixed(2)} ${(C - l).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"><title>${esc(x.rotulo)}: ${x.fmt ?? x.v}</title></circle>`; off += l; return a; }).join('');
  return `<div class="rosca"><svg viewBox="0 0 140 140" role="img"><circle r="${R}" cx="70" cy="70" fill="none" stroke="#efeadb" stroke-width="20"/>${arcos}
    <text x="70" y="66" text-anchor="middle" font-size="19" font-weight="800" fill="#0C3320">${esc(centro)}</text><text x="70" y="84" text-anchor="middle" font-size="9.5" fill="#6A6656">${esc(sub || '')}</text></svg>
    <div class="leg vleg">${segs.map((x) => `<span><i style="background:${x.cor}"></i>${esc(x.rotulo)} <b>${x.fmt ?? x.v}</b></span>`).join('')}</div></div>`;
}

/** Barras SVG empilhadas: itens [{rotulo, partes:[{v,cor,nome}]}] */
function barras(itens, fmtV){
  if (!itens.length) return '<div class="empty">Sem dados ainda.</div>';
  const max = Math.max(1, ...itens.map((i) => i.partes.reduce((s, p) => s + p.v, 0)));
  const L = 54, W = Math.max(300, itens.length * L + 20), H = 170, base = 140;
  let g = '';
  itens.forEach((it, i) => {
    let y = base; const x = 14 + i * L;
    const tot = it.partes.reduce((s, p) => s + p.v, 0);
    for (const p of it.partes) { const h = p.v / max * 112; if (h <= 0) continue; y -= h; g += `<rect x="${x}" y="${y.toFixed(1)}" width="34" height="${h.toFixed(1)}" rx="3" fill="${p.cor}"><title>${esc(it.rotulo)} · ${esc(p.nome)}: ${fmtV(p.v)}</title></rect>`; }
    g += `<text x="${x + 17}" y="${(y - 5).toFixed(1)}" font-size="10" font-weight="700" text-anchor="middle" fill="#0C3320">${kfmt(tot)}</text><text x="${x + 17}" y="${base + 15}" font-size="10" text-anchor="middle" fill="#6A6656">${esc(it.rotulo)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:190px" role="img"><line x1="6" y1="${base}" x2="${W - 6}" y2="${base}" stroke="#DCD5C2"/>${g}</svg>`;
}

async function carregarLotes(){ if (!S.lotes) S.lotes = (await api(`/projetos/${S.pid}/lotes`)).lotes; return S.lotes; }
async function carregarDesenho(){ if (S.desenho === undefined) { try { const r = await api(`/projetos/${S.pid}/desenho`); S.desenho = r.desenho; S.marca = r.marca || S.marca; mostrarEmblema(); } catch { S.desenho = null; } } return S.desenho; }
function mostrarEmblema(){ const i = $('#hdrEmblema'); if (i && S.marca && S.marca.emblema){ i.src = S.marca.emblema; i.classList.remove('hide'); } }
function nomeTitulo(n){ let t = String(n || '').toLowerCase().replace(/(^|\s)\S/g, (c) => c.toUpperCase()); for (const a of [' Da ',' De ',' Do ',' Dos ',' Das ',' E ']) t = t.split(a).join(a.toLowerCase()); return t; }
function quebrar(txt, largura, fs){
  const max = Math.max(4, Math.floor(largura / (fs * 0.56))); const out = []; let linha = '';
  for (const p of String(txt).split(/\s+/)) { if (!linha) linha = p; else if ((linha + ' ' + p).length <= max) linha += ' ' + p; else { out.push(linha); linha = p; } }
  if (linha) out.push(linha); return out.slice(0, 3);
}
function pill(x, y, texto, rot, estilo, tam){
  const fs = tam || 3.3;
  const w = texto.length * fs * 0.6 + 3, h = fs * 1.35;
  const tr = `translate(${x.toFixed(2)},${y.toFixed(2)})${rot ? ` rotate(${rot.toFixed(2)})` : ''}`;
  if (estilo === 'equip') return `<text transform="${tr}" class="mt" font-size="${fs}" fill="#0C3320">${esc(texto)}</text>`;
  const st = estilo === 'praca' ? 'fill="#0C3320" stroke="none"' : estilo === 'verde' ? 'fill="rgba(255,255,255,.88)" stroke="#2E7D32" stroke-width=".35"' : 'fill="#fff" stroke="#8A8A8A" stroke-width=".3"';
  const cor = estilo === 'praca' ? '#fff' : estilo === 'verde' ? '#1B5E20' : '#0C3320';
  return `<g transform="${tr}"><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${h/2}" ${st}/><text class="mt" font-size="${fs}" fill="${cor}">${esc(texto)}</text></g>`;
}
function icone(i){
  const { x, y, w = 0, h = 0, r = 0 } = i;

    case 'arvore': return `<circle cx="${x + r*.35}" cy="${y + r*.35}" r="${r}" fill="rgba(0,0,0,.18)"/><circle cx="${x}" cy="${y}" r="${r}" fill="#2E7D32"/><circle cx="${x - r*.25}" cy="${y - r*.25}" r="${r*.62}" fill="#4CAF50"/>`;
    case 'fonte': return `<circle cx="${x}" cy="${y}" r="${r}" fill="#E9E4D6"/><circle cx="${x}" cy="${y}" r="${r*.54}" fill="#4FC3F7" stroke="#90A4AE" stroke-width=".4"/>`;
    case 'quiosque': return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1" fill="#F3D9A4" stroke="#C9A84C" stroke-width=".4"/>`;
    case 'saude': return `<polygon points="${x-2},${y} ${x+w/2},${y-7} ${x+w+2},${y}" fill="#C62828"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fff" stroke="#9E9E9E" stroke-width=".4"/>`

function svgMapa(lotes, d, modo){
  const com = lotes.filter((l) => Array.isArray(l.croqui_xy) && l.croqui_xy.length >= 3);
  let lim;
  if (d) lim = d.limites;
  else { const xs = com.flatMap((l) => l.croqui_xy.map((p) => p[0])), ys = com.flatMap((l) => l.croqui_xy.map((p) => p[1])); lim = { minX: Math.min(...xs) - 8, minY: Math.min(...ys) - 8, maxX: Math.max(...xs) + 8, maxY: Math.max(...ys) + 8 }; }
  const W = lim.maxX - lim.minX, H = lim.maxY - lim.minY;
  const pts = (p) => p.map((q) => `${q[0].toFixed(2)},${q[1].toFixed(2)}`).join(' ');
  const FILL = { viario:'#BDBDBD', praca:'#B7D99A', equipamento:'#EEF4EA', verde:'#B7D99A' };
  let s = `<svg id="mapaSvg" viewBox="${lim.minX} ${lim.minY} ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">`;
  if (d){
    const praca = d.areas.find((a) => a.tipo === 'praca');
    if (praca) s += `<defs><clipPath id="clipPraca"><polygon points="${pts(praca.pts)}"/></clipPath></defs>`;
    s += d.areas.map((a) => `<polygon points="${pts(a.pts)}" fill="${FILL[a.tipo] || '#ddd'}" ${a.tipo === 'viario' ? '' : 'stroke="#3A3A3A" stroke-width=".45"'}/>`).join('');
    s += d.caminhos.map((c) => `<polyline points="${pts(c.pts)}" stroke="${c.cor}" stroke-width="${c.largura}" fill="none"${praca ? ' clip-path="url(#clipPraca)"' : ''}/>`).join('');
    s += d.icones.map(icone).join('');
  }
  for (const l of com){
    const xs = l.croqui_xy.map((p) => p[0]), ys = l.croqui_xy.map((p) => p[1]);
    const x0 = Math.min(...xs), y0 = Math.min(...ys), w = Math.max(...xs) - x0, h = Math.max(...ys) - y0, cx = x0 + w / 2;
    const inst = l.tipo === 'INSTITUCIONAL';
    const fill = inst ? '#DCEBF7' : modo === 'financeiro' ? COR_FIN[l.financeiro.situacao] : modo === 'medicao' ? COR_MED[l.status_medicao] : '#EAF3EC';
    const escuro = !inst && ((modo === 'financeiro' && ['QUITADO','VENCIDO'].includes(l.financeiro.situacao)) || (modo === 'medicao' && l.status_medicao === 'PROCESSADO'));
    const corTxt = escuro ? '#fff' : '#1B1B1B', corNum = escuro ? '#fff' : inst ? '#1F4E79' : '#0C3320', corDim = escuro ? '#e8f0ea' : '#5A5A5A';
    const titulo = `Lote ${l.numero}${l.associado ? ' — ' + l.associado.nome : inst ? ' — área institucional' : ''}`;
    s += `<g class="lote" data-n="${esc(l.numero)}"><title>${esc(titulo)}</title><polygon points="${pts(l.croqui_xy)}" fill="${fill}" stroke="#3A3A3A" stroke-width=".4"/>`;
    s += `<text class="mt" x="${cx}" y="${y0 + 3.6}" font-size="3.8" fill="${corNum}">${esc(l.numero)}</text>`;
    const fs = w >= 40 ? 2.45 : 2.3;
    const linhas = inst ? ['ÁREA', 'INSTITUCIONAL'] : (l.associado ? quebrar(nomeTitulo(l.associado.nome), w - 2.4, fs) : []);
    const y1 = w >= 40 ? y0 + 3.6 + 2.2 + fs : y0 + h / 2 - ((linhas.length - 1) * (fs + 0.6)) / 2;
    linhas.forEach((t, i) => { s += `<text class="mt" x="${cx}" y="${(y1 + i * (fs + 0.6)).toFixed(2)}" font-size="${fs}" fill="${inst ? '#1F4E79' : corTxt}" font-weight="${inst ? 400 : 700}">${esc(t)}</text>`; });
    const dimTxt = `${Math.round(Math.min(w, h))}×${Math.round(Math.max(w, h))} m`, area = l.area_projeto_m2 ? `${Math.round(l.area_projeto_m2)} m²` : '';
    if (w >= 40) s += `<text class="mt" x="${cx}" y="${y0 + h - 1.3}" font-size="2" fill="${corDim}" font-weight="400">${dimTxt}${area ? ' · ' + area : ''}</text>`;
    else s += `<text class="mt" x="${cx}" y="${y0 + h - 3.6}" font-size="2" fill="${corDim}" font-weight="400">${dimTxt}</text><text class="mt" x="${cx}" y="${y0 + h - 1.3}" font-size="2" fill="${corDim}" font-weight="400">${area}</text>`;
    s += '</g>';
  }
  if (d){
    s += d.eixos.map(([a, b]) => `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#F5F5F5" stroke-width=".6" stroke-dasharray="3 3"/>`).join('');
    s += d.cotas.map((c) => { const hz = c.y1 === c.y2; const mx = (c.x1 + c.x2) / 2, my = (c.y1 + c.y2) / 2;
      const tk = hz
        ? `<line x1="${c.x1}" y1="${c.y1-1}" x2="${c.x1}" y2="${c.y1+1}" stroke="#444" stroke-width=".25"/><line x1="${c.x2}" y1="${c.y2-1}" x2="${c.x2}" y2="${c.y2+1}" stroke="#444" stroke-width=".25"/><text class="mt" x="${mx}" y="${my-1.2}" font-size="2.2" fill="#222" font-weight="400">${esc(c.texto)}</text>`
        : `<line x1="${c.x1-1}" y1="${c.y1}" x2="${c.x1+1}" y2="${c.y1}" stroke="#444" stroke-width=".25"/><line x1="${c.x2-1}" y1="${c.y2}" x2="${c.x2+1}" y2="${c.y2}" stroke="#444" stroke-width=".25"/><text class="mt" transform="translate(${mx-1.4},${my}) rotate(-90)" font-size="2.2" fill="#222" font-weight="400">${esc(c.texto)}</text>`;
      return `<line x1="${c.x1}" y1="${c.y1}" x2="${c.x2}" y2="${c.y2}" stroke="#444" stroke-width=".25"/>` + tk; }).join('');
    s += d.rotulos.map((r) => pill(r.x, r.y, r.texto, r.rot || 0, r.estilo, r.tam)).join('');
  }
  return s + '</svg>';
}

function svgPerimetroTela(p){
  const Es = p.vertices.map((x) => x.E), Ns = p.vertices.map((x) => x.N);
  const minE = Math.min(...Es), maxE = Math.max(...Es), minN = Math.min(...Ns), maxN = Math.max(...Ns);
  const span = Math.max(maxE - minE, maxN - minN) || 1, pad = span * 0.12;
  const x0 = minE - pad, y0 = -(maxN + pad), W = maxE - minE + pad * 2, H = maxN - minN + pad * 2, fs = span * 0.025, sw = span * 0.003;
  const cx = Es.reduce((s, x) => s + x, 0) / Es.length, cy = -Ns.reduce((s, x) => s + x, 0) / Ns.length;
  return `<svg viewBox="${x0} ${y0} ${W} ${H}" style="width:100%;max-height:560px;display:block;background:#FBFAF5;border:1px solid var(--line);border-radius:10px">
    <polygon points="${p.vertices.map((x) => `${x.E},${-x.N}`).join(' ')}" fill="#B7D99A" fill-opacity=".55" stroke="#0C3320" stroke-width="${sw * 2}"/>
    ${p.vertices.map((x) => { const dx = x.E - cx, dy = -x.N - cy, L = Math.hypot(dx, dy) || 1; return `<circle cx="${x.E}" cy="${-x.N}" r="${sw * 3}" fill="#B3261E"/><text x="${x.E + dx / L * fs * 1.2}" y="${-x.N + dy / L * fs * 1.2}" font-size="${fs * 0.85}" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#B3261E">${esc(x.nome)}</text>`; }).join('')}
    <text x="${cx}" y="${cy}" font-size="${fs * 1.3}" font-weight="800" text-anchor="middle" fill="#0C3320">${Number(p.area_ha).toLocaleString('pt-BR', { minimumFractionDigits: 4 })} ha</text>
    <g transform="translate(${x0 + W - pad * 0.55},${y0 + pad * 0.6})"><polygon points="0,${-fs * 1.6} ${fs * 0.7},${fs * 0.6} 0,${fs * 0.2} ${-fs * 0.7},${fs * 0.6}" fill="#0C3320"/><text y="${-fs * 1.9}" font-size="${fs}" font-weight="800" text-anchor="middle" fill="#0C3320">N</text></g></svg>`;
}

function previaCarteirinha(ids){
  $('#ctPrev').innerHTML = `<iframe class="ctframe" src="/api/pa/projetos/${S.pid}/carteirinhas.html?ids=${ids.join(',')}&t=${Date.now()}" title="Prévia da carteirinha"></iframe>
    <div class="row" style="margin-top:8px"><button class="btn btn-primary btn-sm" id="ctPrevPdf">📄 Gerar PDF ${ids.length > 1 ? 'destes ' + ids.length : 'desta carteirinha'}</button></div>`;
  $('#ctPrevPdf').onclick = () => gerarPdfCarteirinhas(ids, ids.length);
}
async function gerarPdfCarteirinhas(ids, n){
  if (n > 1 && !confirm(`Gerar o PDF com ${n} carteirinha(s)? Pode levar alguns segundos.`)) return;
  const janela = window.open('about:blank', '_blank');
  toast('Gerando PDF…');
  try {
    const r = await fetch(`/api/pa/projetos/${S.pid}/carteirinhas.pdf${ids ? '?ids=' + ids.join(',') : ''}`, { credentials: 'include' });
    if (r.status === 401){ location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search); return; }
    if (!r.ok){ let m = 'HTTP ' + r.status; try { m = (await r.json()).erro || m; } catch { /* ok */ } throw new Error(m); }
    const url = URL.createObjectURL(await r.blob());
    if (janela) janela.location.href = url; else window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 120000);
    const agora = new Date().toISOString();
    CART.lista.forEach((a) => { if (!ids || ids.includes(a.id)) a.carteirinha_emitida_em = agora; });
    desenharCarteirinhas();
  } catch (e){ if (janela) janela.close(); toast(e.message, true); }
}
function trocarFoto(aid){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'user';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const fd = new FormData(); fd.append('tipo', 'FOTO_3X4'); fd.append('arquivo', f, f.name);
    try {
      const r = await fetch(`/api/pa/associados/${aid}/documentos`, { method: 'POST', body: fd, credentials: 'include' });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.erro || 'HTTP ' + r.status);
      toast('Foto atualizada — a carteirinha já usa a nova');
      const a = CART.lista.find((x) => x.id === aid); if (a){ a.documentos.tem_foto = true; a.documentos.foto_v = Date.now(); }
      S.assoc = null;
      desenharCarteirinhas();
      previaCarteirinha([aid]);
    } catch (e){ toast(e.message, true); }
  };
  inp.click();
}

];
function formEditar(a){
  $('#edBox').innerHTML = `<div class="grid2" style="margin-top:10px">${CAMPOS_ASSOC.map(([k, t]) => `<div><label for="e_${k}">${t}</label><input id="e_${k}" value="${esc(k === 'nascimento' ? (a[k] ? dbr(a[k]) : '') : (a[k] ?? ''))}"></div>`).join('')}

  $('#salvaEd').onclick = async () => {
    const body = {};
    for (const [k] of CAMPOS_ASSOC){ const val = $('#e_' + k).value.trim(); const orig = k === 'nascimento' ? (a[k] ? dbr(a[k]) : '') : String(a[k] ?? ''); if (val !== orig) body[k] = val || null; }

    if (!Object.keys(body).length) return toast('Nada mudou');

}

// v3.147.1: pontinho do sinal na coluna Recebido e a divisão em boletos com o que falta de cada um.
function marcaSinal(si){
  if (!si) return '';
  const rot = si.tipo === 'AVISTA' ? 'à vista' : 'sinal';
  if (si.estado === 'PAGO') return `<div class="sinal"><i class="dot d-ok"></i>${rot} pago</div>`;
  if (si.estado === 'PARCIAL') return `<div class="sinal warn"><i class="dot d-warn"></i>${rot} parcial · falta <b>${brl(si.falta)}</b></div>`;
  return `<div class="sinal neg"><i class="dot d-red"></i>${rot} pendente ${brl(si.falta)}</div>` + (si.boleto ? `<div>${envioTag(si.boleto)}</div>` : '');
}
// v3.147.2: situação do boleto e do envio pelo WhatsApp.
function envioTag(bo){
  if (!bo) return '<span class="etag e-sem" title="Boleto ainda não emitido">🧾 sem boleto</span>';
  const g = `<span class="etag e-ger" title="Boleto gerado em ${esc(dbr(bo.gerado_em))}">🧾 gerado</span>`;
  return g + (bo.enviado_em ? ` <span class="etag e-env" title="Enviado pelo WhatsApp">📤 enviado ${esc(dbr(bo.enviado_em))}</span>` : ' <span class="etag e-nao">📤 não enviado</span>');
}
function linhasBoletos(bs){
  if (!bs.length) return '<span class="muted">—</span>';
  return bs.map((b) => {
    const tag = b.falta <= 0 ? '<span class="pos">✓ pago</span>'
      : b.recebido > 0 ? `<span class="warn">pagou ${brl(b.recebido)} · <b>falta ${brl(b.falta)}</b></span>`
      : b.status === 'VENCIDO' ? '<span class="neg">vencido</span>' : '<span class="muted">a vencer</span>';
    return `<div class="bl"><b>P${b.parcela}</b> · ${b.vencimento ? dbr(b.vencimento) : 'sem venc.'} · ${brl(b.valor)} — ${tag}${b.falta > 0 ? ' ' + envioTag(b.boleto) : ''}</div>`;
  }).join('');
}

      <td class="nowrap"><b>${esc(x.divisao)}</b>${x.qtd_boletos ? `<div class="muted">${x.qtd_boletos} boleto(s)</div>` : ''}${x.envio.em_aberto ? `<div class="muted" title="Boletos em aberto gerados / enviados pelo WhatsApp">🧾 ${x.envio.gerados}/${x.envio.em_aberto} · 📤 ${x.envio.enviados}/${x.envio.gerados}</div>` : ''}</td><td class="nowrap">${linhasBoletos(x.boletos)}</td>

      <td style="min-width:90px"><div class="pbar"><i style="width:${Math.min(100, x.pct_pago)}%"></i></div><span class="muted">${x.pct_pago.toLocaleString('pt-BR')}%</span></td>
      <td>${chip(x.situacao, SIT_TXT[x.situacao])}${x.parciais ? '<div style="margin-top:3px">' + chip('PARCIAL', 'pagou parcial') + '</div>' : ''}</td><td class="nowrap">${x.ultimo_pagamento ? dbr(x.ultimo_pagamento) : '<span class="muted">nunca</span>'}</td></tr>
      ${EXT.abertos.has(x.associado_id) ? `<tr class="det"><td></td><td colspan="10">${x.parcelas.length ? x.parcelas.map((p) => `<div class="row" style="align-items:center;gap:10px;margin:2px 0"><span style="flex:0 0 90px"><b>${esc(p.rotulo)}</b></span><span style="flex:0 0 90px">${p.vencimento ? 'venc. ' + dbr(p.vencimento) : 'sem venc.'}</span><span style="flex:0 0 120px">valor ${brl(p.valor)}</span><span style="flex:0 0 130px" class="pos">pago ${brl(p.recebido)}</span><span style="flex:0 0 130px">saldo <b>${brl(p.saldo)}</b></span>${chip(p.status)}</div>`).join('') : '<span class="muted">Sem parcelas lançadas.</span>'}
        <div style="margin-top:6px"><button class="btn btn-ghost btn-sm" data-abrir="${x.associado_id}">Abrir cadastro</button></div></td></tr>` : ''}`).join('')}</tbody>
    <tfoot><tr><td></td><td>${lista.length} associado(s)</td><td class="right nowrap">${brl(soma('contratado'))}</td><td class="right nowrap pos">${brl(soma('recebido'))}</td><td class="right nowrap">${brl(soma('em_aberto'))}</td><td colspan="2"></td><td class="right nowrap neg">${brl(soma('vencido'))}</td><td colspan="3"></td></tr></tfoot></table>`;
  $('#exTabela').querySelectorAll('tr[data-ex]').forEach((tr) => tr.onclick = () => { const id = Number(tr.dataset.ex); EXT.abertos.has(id) ? EXT.abertos.delete(id) : EXT.abertos.add(id); desenharExtrato(); });
  $('#exTabela').querySelectorAll('[data-abrir]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); abrirAssociado(Number(b.dataset.abrir)); });

// ─── v3.147.0: Fluxo de caixa (entradas dos associados + movimentos manuais) ─
let CX = { de: '', ate: '', agrupar: 'mes', cats: null };
/** Barras agrupadas: entradas (verde) x saídas (vermelho) + linha do saldo acumulado. */
function graficoFluxo(periodos){
  if (!periodos.length) return '<div class="empty">Sem movimentos no período.</div>';
  const max = Math.max(1, ...periodos.map((p) => Math.max(p.entradas_associados + p.entradas_avulsas, p.saidas)), ...periodos.map((p) => Math.abs(p.saldo_acumulado)));
  const L = 64, W = Math.max(320, periodos.length * L + 30), H = 200, base = 165, alt = 135;
  const rot = (k) => k.length === 7 ? mesTxt(k) : `${k.slice(8, 10)}/${k.slice(5, 7)}`;
  let g = '', pts = [];
  periodos.forEach((p, i) => {
    const x = 18 + i * L, ent = p.entradas_associados + p.entradas_avulsas;
    const he = ent / max * alt, hs = p.saidas / max * alt;
    g += `<rect x="${x}" y="${(base - he).toFixed(1)}" width="22" height="${he.toFixed(1)}" rx="3" fill="#1f7a4d"><title>${rot(p.periodo)} · entradas ${brl(ent)}</title></rect>`;
    g += `<rect x="${x + 24}" y="${(base - hs).toFixed(1)}" width="22" height="${hs.toFixed(1)}" rx="3" fill="#B3261E"><title>${rot(p.periodo)} · saídas ${brl(p.saidas)}</title></rect>`;
    g += `<text x="${x + 23}" y="${base + 15}" font-size="10" text-anchor="middle" fill="#6A6656">${esc(rot(p.periodo))}</text>`;
    pts.push([x + 23, base - Math.max(0, p.saldo_acumulado) / max * alt, p]);
  });
  const linha = pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  const bolas = pts.map(([x, y, p]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="#C9A84C"><title>saldo acumulado ${brl(p.saldo_acumulado)}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:210px" role="img"><line x1="6" y1="${base}" x2="${W - 6}" y2="${base}" stroke="#DCD5C2"/>${g}<polyline points="${linha}" fill="none" stroke="#C9A84C" stroke-width="2"/>${bolas}</svg>
    <div class="leg"><span><i style="background:#1f7a4d"></i>Entradas</span> <span><i style="background:#B3261E"></i>Saídas</span> <span><i style="background:#C9A84C"></i>Saldo acumulado</span></div>`;
}

          <td class="nowrap">${b.linha_digitavel && b.status !== 'CANCELADO' ? `<button class="btn btn-gold btn-sm" data-romatec="${b.id}" data-url="${esc(b.url_romatec || '')}" title="Carnê Romatec (mesmo código de barras e Pix do Asaas)">🧾 PDF</button>` : ''}
            ${b.linha_digitavel ? `<button class="btn btn-ghost btn-sm" data-copiar="${esc(b.linha_digitavel)}">Linha</button>` : ''}
            ${b.pix_copia_cola ? `<button class="btn btn-ghost btn-sm" data-copiar="${esc(b.pix_copia_cola)}">Pix</button>` : ''}
            ${podeEscrever() && (b.status === 'PENDENTE' || b.status === 'VENCIDO') ? `<button class="btn btn-danger btn-sm" data-cancbol="${b.id}">Cancelar</button>` : ''}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">Nenhum boleto emitido.</div>';
      $('#bolBox').querySelectorAll('[data-copiar]').forEach((b) => b.onclick = () => copiar(b.dataset.copiar));
      $('#bolBox').querySelectorAll('[data-romatec]').forEach((b) => b.onclick = () => abrirBoletoRomatec(b));
      $('#bolBox').querySelectorAll('[data-cancbol]').forEach((b) => b.onclick = async () => {
        if (!confirm('Cancelar este boleto no Asaas?')) return;
        try { await api(`/boletos/${b.dataset.cancbol}`, { method: 'DELETE' }); toast('Boleto cancelado'); listar(); } catch (e){ toast(e.message, true); }
      });
    } catch (e){ $('#bolBox').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  };
  $('#bFiltro').onchange = listar;
  if ($('#bSync')) $('#bSync').onclick = async () => {
    const b = $('#bSync'); b.disabled = true; $('#bSyncBox').innerHTML = '<div class="muted" style="margin-top:6px">Consultando o Asaas…</div>';
    try {
      const r = await api(`/projetos/${S.pid}/boletos/sincronizar`, { method: 'POST' });
      const nome = { baixado: 'pago → baixa feita', pago_sem_saldo: 'pago (parcela já estava quitada — conferir devolução)', 'status:VENCIDO': 'vencido', 'status:CANCELADO': 'cancelado no Asaas', 'status:ESTORNADO': 'estornado — conferir' };
      $('#bSyncBox').innerHTML = `<div class="avisos" style="margin-top:6px">🔄 ${r.consultados} boleto(s) consultado(s) · ${chip('PAGO', r.baixados + ' baixa(s)')} ${chip('VENCIDO', r.vencidos + ' vencido(s)')} ${chip('CANCELADO', r.cancelados + ' cancelado(s)')} ${r.estornados ? chip('ESTORNADO', r.estornados + ' estornado(s)') : ''} · ${r.sem_mudanca} sem mudança
        ${r.detalhes.length ? '<div style="margin-top:4px">' + r.detalhes.map((x) => `Lote ${esc(x.lote)} — ${esc(x.associado)}: ${esc(nome[x.acao] || x.acao)}`).join('<br>') + '</div>' : ''}
        ${r.erros.length ? '<div style="margin-top:4px;color:var(--red)">' + r.erros.map((x) => `Lote ${esc(x.lote)}: ${esc(x.erro)}`).join('<br>') + '</div>' : ''}</div>`;
      if (r.baixados) { S.painel = S.lotes = S.assoc = null; }
      listar();
    } catch (e){ $('#bSyncBox').innerHTML = `<div class="avisos" style="margin-top:6px;color:var(--red)">${esc(e.message)}</div>`; }
    finally { b.disabled = false; }
  };
  if ($('#bEmitir')) $('#bEmitir').onclick = async () => {
    const b = $('#bEmitir');
    try {
      const { lancamentos } = await api(`/projetos/${S.pid}/boletos/elegiveis?ate=${encodeURIComponent($('#bAte').value)}&tipos=${encodeURIComponent($('#bTipos').value)}`);
      if (!lancamentos.length) return toast('Nenhuma parcela em aberto sem boleto nesse período');
      const total = lancamentos.reduce((s, l) => s + l.saldo, 0);
      if (!confirm(`Emitir ${lancamentos.length} boleto(s) no Asaas, total ${brl(total)}?\n\nCada boleto fica registrado no banco com o CPF e o endereço do associado.`)) return;
      b.disabled = true;
      let ok = 0; const falhas = [];
      for (const [k, l] of lancamentos.entries()) {
        $('#bProg').innerHTML = `<div class="prog"><i style="width:${Math.round(k / lancamentos.length * 100)}%"></i></div><div class="muted">Emitindo ${k + 1}/${lancamentos.length} — Lote ${esc(l.lote)} ${esc(l.nome)}</div>`;
        try { await api(`/lancamentos/${l.id}/boleto`, { method: 'POST' }); ok++; }
        catch (e){ falhas.push(`Lote ${l.lote} — ${l.nome}: ${e.message}`); if (['ASAAS_NAO_CONFIGURADO', 'ASAAS_CHAVE_INVALIDA', 'CEP_NAO_CONFIGURADO'].includes(e.codigo)) break; }
      }
      $('#bProg').innerHTML = `<div class="avisos">🧾 ${ok} boleto(s) emitido(s)${falhas.length ? ` · ${falhas.length} falha(s):<ul>${falhas.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>` : '.'}</div>`;
      listar();
    } catch (e){ toast(e.message, true); }
    finally { b.disabled = false; }
  };
  listar();
}
// v3.146.1: progresso da fila de envio (servidor). Atualiza a cada 3 s enquanto roda.
let FILA_TIMER = null;
async function acompanharFila(){
  clearTimeout(FILA_TIMER);
  const alvo = $('#envProg'); if (!alvo) return;
  try {
    const { fila: f } = await api('/whatsapp/fila');
    if (!f){ alvo.innerHTML = ''; return; }
    const pct = f.total ? Math.round((f.enviados + f.falhas) / f.total * 100) : 0;
    const resta = f.total - f.enviados - f.falhas;
    const prox = f.proximo_em ? Math.max(0, Math.round((new Date(f.proximo_em) - Date.now()) / 1000)) : null;
    const rodando = f.status === 'RODANDO';
    const titulo = rodando ? 'em andamento' : f.status === 'CONCLUIDA' ? 'concluído' : f.status === 'PARADA' ? 'parado' : 'interrompido';
    alvo.innerHTML = `<div class="avisos"><b>📤 Envio em lote ${titulo}</b> — ${f.enviados} enviado(s)${f.falhas ? ` · ${f.falhas} falha(s)` : ''} de ${f.total}
      <div class="prog"><i style="width:${pct}%"></i></div>
      ${rodando ? (f.atual ? `Enviando para <b>${esc(f.atual)}</b>…` : prox != null ? `Próximo envio em ${prox} s (intervalo sorteado para não parecer robô) · faltam ${resta} · ≈ ${Math.ceil(resta * 45 / 60)} min` : '') : ''}
      ${f.erro ? `<div style="color:var(--red);margin-top:4px">⚠️ ${esc(f.erro)} — a fila parou para proteger o número.</div>` : ''}
      ${rodando ? '<div style="margin-top:6px"><button class="btn btn-danger btn-sm" id="filaParar">⏹ Parar fila</button></div>' : ''}</div>`;
    if ($('#filaParar')) $('#filaParar').onclick = async () => { try { await api('/whatsapp/fila/parar', { method: 'POST' }); toast('Parando a fila (termina o envio atual)'); acompanharFila(); } catch (e){ toast(e.message, true); } };
    if (rodando) FILA_TIMER = setTimeout(acompanharFila, 3000);
  } catch { /* sem fila */ }
}

async function adicionarAoRateio(aid){
  if (FIN.selecionados.some((s) => s.associado.id === aid)) return;

      return `<tr><td>${esc(s.associado.lote)}</td><td>${esc(s.associado.nome)}</td><td>${esc(l.tipo === 'BOLETO' ? 'Boleto ' + l.parcela : l.tipo === 'AVISTA' ? 'À vista' : 'Sinal')} ${chip(l.status_efetivo)}</td><td class="right">${brl(l.saldo)}</td>
        <td class="right"><input data-lanc="${l.id}" data-saldo="${l.saldo}" inputmode="decimal" style="width:100px;text-align:right" value="${v ? String(v).replace('.', ',') : ''}"></td>
        <td>${li === 0 ? `<button class="btn btn-ghost btn-sm" data-rm="${si}">✕</button>` : ''}</td></tr>`; }).join('') || `<tr><td>${esc(s.associado.lote)}</td><td colspan="5">${esc(s.associado.nome)} — sem saldo em aberto <button class="btn btn-ghost btn-sm" data-rm="${si}">✕</button></td></tr>`).join('')}
  </tbody></table>`;
  box.querySelectorAll('[data-rm]').forEach((b) => b.onclick = () => { FIN.selecionados.splice(Number(b.dataset.rm), 1); desenharRateio(); });
  box.querySelectorAll('[data-lanc]').forEach((i) => i.oninput = somaRateio);
  somaRateio();
}
function lerRateio(){
  return [...document.querySelectorAll('#rateioBox [data-lanc]')].map((i) => ({ lancamento_id: Number(i.dataset.lanc), valor: Number(i.value.replace(/\./g, '').replace(',', '.')) || 0 })).filter((r) => r.valor > 0);
}
function somaRateio(e){
  if (e && e.target && e.target.id === 'pValor' && FIN.selecionados.length) { desenharRateio(); return; }
  const soma = lerRateio().reduce((s, r) => s + r.valor, 0);
  const valor = Number(String($('#pValor').value || '0').replace(/\./g, '').replace(',', '.')) || 0;
  $('#pSoma').textContent = FIN.selecionados.length ? `Rateado ${brl(soma)} de ${brl(valor)}${Math.abs(soma - valor) > 0.009 ? ' — diferença ' + brl(valor - soma) : ' ✓'}` : '';
}
async function salvarPagamento(){
  const rateio = lerRateio();
  if (!rateio.length) return toast('Selecione o associado e o valor de cada lançamento', true);
  const body = {
    forma: $('#pForma').value, valor: $('#pValor').value.replace(/\./g, '').replace(',', '.'),
    pago_em: $('#pData').value ? $('#pData').value.replace('T', ' ') + ':00' : null,
    id_transacao: $('#pTx').value.trim() || null, pagador_nome: $('#pPagador').value.trim() || null,
    pagador_cpf_parcial: $('#pCpf').value.trim() || null, vinculo_pagador: $('#pVinc').value.trim() || null,
    obs: $('#pObs').value.trim() || null, url_recibo: FIN.recibo ? $('#urlRecibo').value.trim() : null, rateio,
  };
  $('#pSalvar').disabled = true;
  try {
    const r = await api(`/projetos/${S.pid}/pagamentos`, { json: body });
    toast(`Pagamento #${r.pagamento_id} lançado` + (r.pagador_terceiro ? ' (pagador terceiro)' : ''));
    S.painel = S.lotes = S.assoc = null; rFinanceiro();
  } catch (e){
    toast(e.message, true);
    if (e.codigo === 'VINCULO_OBRIGATORIO') $('#pVinc').focus();
  } finally { const b = $('#pSalvar'); if (b) b.disabled = false; }
}

// ─── Campo ──────────────────────────────────────────────────────────────
async function rCampo(){
  const v = $('#v-campo');
  v.innerHTML = '<div class="card empty">Carregando lotes…</div>';
  try {
    const lotes = await carregarLotes();
    v.innerHTML = `<div class="card"><div class="row"><div style="flex:0 1 220px"><label for="fMed">Status de medição</label><select class="f" id="fMed"><option value="">Todos</option>${Object.keys(COR_MED).map((s) => `<option>${s}</option>`).join('')}</select></div>
      <div class="muted" style="flex:1 1 300px">Mudar para AGENDADA/MEDIDO registra evento (aviso ao associado pela Zayra entra na fase 4). Vértices SIRGAS (E,N,h) por lote: importação de CSV na fase 5.</div></div></div>
      <div class="card"><div class="tbl" id="campoBox"></div></div>`;
    const desenhar = () => {
      const f = $('#fMed').value;
      const ls = lotes.filter((l) => !f || l.status_medicao === f);
      $('#campoBox').innerHTML = `<table><thead><tr><th>Lote</th><th>Associado</th><th>Área projeto</th><th>Status</th><th>Data</th><th>Equipe</th><th>Base GNSS</th><th>Área medida (m²)</th><th></th></tr></thead><tbody>
        ${ls.map((l) => `<tr data-n="${esc(l.numero)}"><td><b>${esc(l.numero)}</b> ${l.tipo === 'INSTITUCIONAL' ? chip('INSTITUCIONAL','inst.') : ''}</td><td>${esc(l.associado ? l.associado.nome : '—')}</td><td class="nowrap">${l.area_projeto_m2 ? l.area_projeto_m2.toLocaleString('pt-BR') : '—'}</td>
          <td><select class="f" data-c="status_medicao" ${podeEscrever() ? '' : 'disabled'}>${Object.keys(COR_MED).map((s) => `<option ${l.status_medicao === s ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
          <td><input type="date" data-c="data_medicao" value="${esc(l.data_medicao || '')}" ${podeEscrever() ? '' : 'disabled'}></td>
          <td><input data-c="equipe" value="${esc(l.equipe || '')}" ${podeEscrever() ? '' : 'disabled'}></td>
          <td><input data-c="base_gnss" value="${esc(l.base_gnss || '')}" style="width:110px" ${podeEscrever() ? '' : 'disabled'}></td>
          <td><input data-c="area_medida_m2" inputmode="decimal" value="${l.area_medida_m2 == null ? '' : esc(l.area_medida_m2)}" style="width:100px" ${podeEscrever() ? '' : 'disabled'}></td>
          <td>${podeEscrever() ? '<button class="btn btn-ghost btn-sm" data-salvar="1">Salvar</button>' : ''}</td></tr>`).join('')}</tbody></table>`;
      $('#campoBox').querySelectorAll('[data-salvar]').forEach((b) => b.onclick = async () => {
        const tr = b.closest('tr'); const n = tr.dataset.n; const l = lotes.find((x) => x.numero === n); const body = {};
        tr.querySelectorAll('[data-c]').forEach((i) => { const c = i.dataset.c; const val = i.value.trim().replace(',', '.'); const orig = l[c] == null ? '' : String(l[c]); if (val !== orig) body[c] = val || null; });
        if (!Object.keys(body).length) return toast('Nada mudou');
        b.disabled = true;
        try { const r = await api(`/projetos/${S.pid}/lotes/${encodeURIComponent(n)}`, { method:'PATCH', json: body }); Object.assign(l, r.lote); toast(`Lote ${n} atualizado`); S.painel = null; }
        catch (e){ toast(e.message, true); } finally { b.disabled = false; }
      });
    };
    $('#fMed').onchange = desenhar;
    desenhar();
  } catch (e){ v.innerHTML = `<div class="card empty">${esc(e.message)}</div>`; }
}

// ─── Importar / exportar ────────────────────────────────────────────────
function rImportar(){
  const v = $('#v-importar');
  if (!S.eu || S.eu.perfil !== 'ADMIN'){ v.innerHTML = '<div class="card empty">Somente ADMIN.</div>'; return; }
  v.innerHTML = `<div class="card"><h2>Importar seed + acervo</h2>
      <p class="muted">Idempotente: pode reenviar o mesmo seed quantas vezes quiser — só entra o que falta e o que foi editado na tela é mantido. O acervo (ZIP com as pastas LOTE-XX-Nome/) é opcional e pode vir depois.</p>
      <div class="grid2"><div><label for="iSeed">Seed (JSON)</label><input type="file" id="iSeed" accept=".json,application/json"></div>
        <div><label for="iAcervo">Acervo digital (ZIP, opcional)</label><input type="file" id="iAcervo" accept=".zip,application/zip"></div></div>
      <div class="row" style="margin-top:10px"><button class="btn btn-primary" id="iBtn" style="flex:0 0 auto">📥 Importar</button><span class="muted" id="iProg"></span></div>
      <div id="iRel"></div></div>
    ${S.pid ? `<div class="card"><h2>Exportar acervo</h2><p class="muted">ZIP com a estrutura LOTE-XX-Nome/ de todos os documentos carregados. Fica registrado em eventos (LGPD).</p>
      <button class="btn btn-ghost" id="eBtn">⬇️ Baixar ZIP do acervo</button></div>` : ''}`;
  $('#iBtn').onclick = () => {
    const seed = $('#iSeed').files[0];
    if (!seed) return toast('Escolha o seed JSON', true);
    const fd = new FormData(); fd.append('seed', seed); if ($('#iAcervo').files[0]) fd.append('acervo', $('#iAcervo').files[0]);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/pa/importar'); xhr.withCredentials = true;
    xhr.upload.onprogress = (e) => { if (e.lengthComputable) $('#iProg').textContent = `Enviando ${Math.round(e.loaded / e.total * 100)}%…`; };
    xhr.upload.onload = () => { $('#iProg').textContent = 'Processando no servidor (pode levar alguns minutos com o acervo)…'; };
    xhr.onload = () => {
      $('#iBtn').disabled = false;
      if (xhr.status === 401){ location.href = '/login?next=' + encodeURIComponent(location.pathname); return; }
      let j = null; try { j = JSON.parse(xhr.responseText); } catch { /* resposta não-JSON */ }
      if (xhr.status >= 300 || !j){ $('#iProg').textContent = ''; return toast((j && j.erro) || ('Falha HTTP ' + xhr.status), true); }
      const r = j.relatorio;
      $('#iProg').textContent = 'Concluído ✓';
      $('#iRel').innerHTML = `<div class="avisos"><b>Banco agora:</b> ${j.contagem.lotes} lotes · ${j.contagem.associados} associados · ${j.contagem.documentos} documentos (${j.contagem.documentos_com_arquivo} com arquivo)<br>
        <b>Inseridos:</b> ${esc(JSON.stringify(r.inseridos))}<br><b>Atualizados:</b> ${esc(JSON.stringify(r.atualizados))}<br><b>Arquivos:</b> ${esc(JSON.stringify(r.arquivos))}</div>
        ${r.erros.length ? `<h3 style="color:var(--red)">Erros (${r.erros.length})</h3><ul class="avisos">${r.erros.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
        ${avisosHtml(r.avisos)}`;
      api('/projetos').then(({ projetos }) => { S.projetos = projetos; const sel = $('#selProjeto'); sel.innerHTML = projetos.map((p) => `<option value="${p.id}">${esc(p.nome)}</option>`).join(''); S.pid = r.projeto_id; sel.value = String(S.pid); S.painel = S.lotes = S.assoc = null; });
    };
    xhr.onerror = () => { $('#iBtn').disabled = false; $('#iProg').textContent = ''; toast('Falha de rede no envio', true); };
    $('#iBtn').disabled = true; xhr.send(fd);
  };
  if ($('#eBtn')) $('#eBtn').onclick = () => { toast('Gerando ZIP…'); baixar(`/projetos/${S.pid}/export`, 'ACERVO.zip').catch((e) => toast(e.message, true)); };
}

boot();
})();
</script>
</body>
